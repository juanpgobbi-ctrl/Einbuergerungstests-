elches Amt gehört in Deutschland zur Gemeindeverwaltung?","a":["Pfarramt","Ordnungsamt","Finanzamt","Auswärtiges Amt"],"c":1,"x":"Das Ordnungsamt gehört zur Gemeindeverwaltung. Es kümmert sich zum Beispiel um öffentliche Ordnung, bestimmte Genehmigungen und lokale Vorschriften.","en":{"q":"Which office in Germany belongs to the municipal administration?","a":["parish office","public order office","tax office","Federal Foreign Office"],"x":"The public order office belongs to the municipal administration. It is responsible, for example, for public order, certain permits, and local regulations."}},{"id":"G57","n":57,"land":false,"cat":"Politik","q":"Wer wird meistens zur Präsidentin / zum Präsidenten des Deutschen Bundestages gewählt?","a":["die / der älteste Abgeordnete im Parlament","die Ministerpräsidentin / der Ministerpräsident des größten Bundeslandes","eine ehemalige Bundeskanzlerin / ein ehemaliger Bundeskanzler","eine Abgeordnete / ein Abgeordneter der stärksten Fraktion"],"c":3,"x":"Meistens wird eine Abgeordnete oder ein Abgeordneter der stärksten Fraktion zur Präsidentin oder zum Präsidenten des Bundestages gewählt. Dieses Amt leitet die Sitzungen des Bundestages.","en":{"q":"Who is usually elected President of the German Bundestag?","a":["the oldest member of parliament","the Minister-President of the largest federal state","a former Federal Chancellor","a member of parliament from the largest parliamentary group"],"x":"Usually, a member of parliament from the largest parliamentary group is elected President of the Bundestag. This office presides over Bundestag sessions."}},{"id":"G58","n":58,"land":false,"cat":"Politik","q":"Wer ernennt in Deutschland die Ministerinnen / die Minister der Bundesregierung?","a":["die Präsidentin / der Präsident des Bundesverfassungsgerichtes","die Bundespräsidentin / der Bundespräsident","die Bundesratspräsidentin / der Bundesratspräsident","die Bundestagspräsidentin / der Bundestagspräsident"],"c":1,"x":"Die Bundesministerinnen und Bundesminister werden vom Bundespräsidenten ernannt. Grundlage ist der Vorschlag der Bundeskanzlerin oder des Bundeskanzlers.","en":{"q":"Who appoints the federal ministers in Germany?","a":["the President of the Federal Constitutional Court","the Federal President","the President of the Bundesrat","the President of the Bundestag"],"x":"The federal ministers are appointed by the Federal President. The appointment is based on the proposal of the Federal Chancellor."}},{"id":"G59","n":59,"land":false,"cat":"Geschichte","q":"Vor wie vielen Jahren gab es erstmals eine jüdische Gemeinde auf dem Gebiet des heutigen Deutschlands?","a":["vor etwa 300 Jahren","vor etwa 700 Jahren","vor etwa 1150 Jahren","vor etwa 1700 Jahren"],"c":3,"x":"Jüdisches Leben gibt es auf dem Gebiet des heutigen Deutschlands seit etwa 1700 Jahren. Ein wichtiges frühes Zeugnis stammt aus der römischen Stadt Köln.","en":{"q":"How many years ago was there a Jewish community for the first time in the territory of present-day Germany?","a":["about 300 years ago","about 700 years ago","about 1,150 years ago","about 1,700 years ago"],"x":"Jewish life has existed in the territory of present-day Germany for about 1,700 years. An important early record comes from the Roman city of Cologne."}},{"id":"G60","n":60,"land":false,"cat":"Staat","q":"In Deutschland gehören der Bundestag und der Bundesrat zur …","a":["Exekutive.","Legislative.","Direktive.","Judikative."],"c":1,"x":"Bundestag und Bundesrat gehören zur Legislative. Die Legislative ist die gesetzgebende Gewalt und wirkt an der Entstehung von Gesetzen mit.","en":{"q":"In Germany, the Bundestag and the Bundesrat belong to the ...","a":["executive.","legislature.","directive.","judiciary."],"x":"The Bundestag and Bundesrat belong to the legislature. The legislature is the law-making branch of government and participates in creating laws."}},{"id":"G61","n":61,"land":false,"cat":"Staat","q":"Was bedeutet 'Volkssouveränität'?","a":["Die Königin / der König herrscht über das Volk.","Das Bundesverfassungsgericht steht über der Verfassung.","Die Interessenverbände üben die Souveränität zusammen mit der Regierung aus.","Die Staatsgewalt geht vom Volke aus."],"c":3,"x":"Volkssouveränität heißt, dass alle Staatsgewalt vom Volk ausgeht. In Deutschland geschieht das vor allem durch Wahlen und demokratische Institutionen.","en":{"q":"What does 'popular sovereignty' mean?","a":["The queen / king rules over the people.","The Federal Constitutional Court stands above the constitution.","Interest groups exercise sovereignty together with the government.","State authority derives from the people."],"x":"Popular sovereignty means that all state authority derives from the people. In Germany, this happens mainly through elections and democratic institutions."}},{"id":"G62","n":62,"land":false,"cat":"Bund und Länder","q":"Wenn das Parlament eines deutschen Bundeslandes gewählt wird, nennt man das …","a":["Kommunalwahl","Landtagswahl","Europawahl","Bundestagswahl"],"c":1,"x":"Die Wahl des Parlaments eines Bundeslandes heißt Landtagswahl. Dabei wählen die Bürgerinnen und Bürger die Abgeordneten des jeweiligen Landesparlaments.","en":{"q":"When the parliament of a German federal state is elected, this is called a ...","a":["local election","state parliament election","European election","Bundestag election"],"x":"The election of a federal state's parliament is called a state parliament election. Citizens elect the members of the respective state parliament."}},{"id":"G63","n":63,"land":false,"cat":"Staat","q":"Was gehört in Deutschland nicht zur Exekutive?","a":["die Polizei","die Gerichte","das Finanzamt","die Ministerien"],"c":1,"x":"Die Gerichte gehören nicht zur Exekutive, sondern zur Judikative. Polizei, Finanzämter und Ministerien sind dagegen Teil der ausführenden Gewalt.","en":{"q":"Which does not belong to the executive branch in Germany?","a":["the police","the courts","the tax office","the ministries"],"x":"The courts do not belong to the executive branch, but to the judiciary. The police, tax offices, and ministries, on the other hand, are part of the executive branch."}},{"id":"G64","n":64,"land":false,"cat":"Bund und Länder","q":"Die Bundesrepublik Deutschland ist heute gegliedert in …","a":["vier Besatzungszonen.","einen Oststaat und einen Weststaat.","16 Kantone.","Bund, Länder und Kommunen."],"c":3,"x":"Deutschland ist föderal aufgebaut. Es gibt den Bund, die Bundesländer und die Kommunen, die jeweils eigene Aufgaben haben.","en":{"q":"Today, the Federal Republic of Germany is divided into ...","a":["four occupation zones.","an eastern state and a western state.","16 cantons.","the federation, federal states, and municipalities."],"x":"Germany has a federal structure. There is the federation, the federal states, and the municipalities, each with its own responsibilities."}},{"id":"G65","n":65,"land":false,"cat":"Staat","q":"Es gehört nicht zu den Aufgaben des Deutschen Bundestages, …","a":["Gesetze zu entwerfen.","die Bundesregierung zu kontrollieren.","die Bundeskanzlerin / den Bundeskanzler zu wählen.","das Bundeskabinett zu bilden."],"c":3,"x":"Der Bundestag kontrolliert die Bundesregierung, beschließt Gesetze und wählt die Bundeskanzlerin oder den Bundeskanzler. Das Bundeskabinett wird aber nicht vom Bundestag gebildet.","en":{"q":"It is not one of the duties of the German Bundestag to ...","a":["draft laws.","monitor the federal government.","elect the Federal Chancellor.","form the federal cabinet."],"x":"The Bundestag monitors the federal government, passes laws, and elects the Federal Chancellor. However, the federal cabinet is not formed by the Bundestag."}},{"id":"G66","n":66,"land":false,"cat":"Religion und Kultur","q":"Welche Städte haben die größten jüdischen Gemeinden in Deutschland?","a":["Berlin und München","Hamburg und Essen","Nürnberg und Stuttgart","Worms und Speyer"],"c":0,"x":"Die größten jüdischen Gemeinden in Deutschland befinden sich laut diesem Fragenkatalog in Berlin und München. Beide Städte haben ein bedeutendes jüdisches Gemeindeleben.","en":{"q":"Which cities have the largest Jewish communities in Germany?","a":["Berlin and Munich","Hamburg and Essen","Nuremberg and Stuttgart","Worms and Speyer"],"x":"According to this question catalog, the largest Jewish communities in Germany are located in Berlin and Munich. Both cities have significant Jewish communal life."}},{"id":"G67","n":67,"land":false,"cat":"Bund und Länder","q":"Was ist in Deutschland vor allem eine Aufgabe der Bundesländer?","a":["Verteidigungspolitik","Außenpolitik","Wirtschaftspolitik","Schulpolitik"],"c":3,"x":"Schulpolitik ist vor allem Aufgabe der Bundesländer. Deshalb können sich Schulsysteme und Regeln zwischen den Ländern unterscheiden.","en":{"q":"What is primarily a responsibility of the federal states in Germany?","a":["defense policy","foreign policy","economic policy","education policy"],"x":"Education policy is primarily the responsibility of the federal states. This is why school systems and rules can differ between the states."}},{"id":"G68","n":68,"land":false,"cat":"Staat","q":"Warum kontrolliert der Staat in Deutschland das Schulwesen?","a":["weil es in Deutschland nur staatliche Schulen gibt","weil alle Schülerinnen und Schüler einen Schulabschluss haben müssen","weil es in den Bundesländern verschiedene Schulen gibt","weil es nach dem Grundgesetz seine Aufgabe ist"],"c":3,"x":"Der Staat hat nach dem Grundgesetz die Aufsicht über das Schulwesen. Deshalb kontrollieren staatliche Stellen Schulen und wichtige Regeln des Bildungssystems.","en":{"q":"Why does the state supervise the school system in Germany?","a":["because there are only state schools in Germany","because all pupils must obtain a school-leaving qualification","because there are different types of schools in the federal states","because it is its responsibility under the Basic Law"],"x":"Under the Basic Law, the state is responsible for supervising the school system. Therefore, state authorities oversee schools and important rules of the education system."}},{"id":"G69","n":69,"land":false,"cat":"Bund und Länder","q":"Die Bundesrepublik Deutschland hat einen dreistufigen Verwaltungsaufbau. Wie heißt die unterste politische Stufe?","a":["Stadträte","Landräte","Gemeinden","Bezirksämter"],"c":2,"x":"Die unterste politische Ebene sind die Gemeinden. Sie kümmern sich um viele Aufgaben vor Ort, zum Beispiel Straßen, Kitas oder kommunale Einrichtungen.","en":{"q":"The Federal Republic of Germany has a three-tier administrative structure. What is the lowest political level called?","a":["city councils","district administrators","municipalities","district offices"],"x":"The lowest political level is the municipalities. They are responsible for many local tasks, such as roads, daycare centers, and municipal facilities."}},{"id":"G70","n":70,"land":false,"cat":"Politik","q":"Der deutsche Bundespräsident Gustav Heinemann gibt Helmut Schmidt 1974 die Ernennungsurkunde zum deutschen Bundeskanzler. Was gehört zu den Aufgaben der deutschen Bundespräsidentin / des deutschen Bundespräsidenten?","a":["Sie / Er führt die Regierungsgeschäfte.","Sie / Er kontrolliert die Regierungspartei.","Sie / Er wählt die Ministerinnen / Minister aus.","Sie / Er schlägt die Kanzlerin / den Kanzler zur Wahl vor."],"c":3,"x":"Der Bundespräsident schlägt dem Bundestag eine Kandidatin oder einen Kandidaten für das Amt der Bundeskanzlerin oder des Bundeskanzlers vor. Gewählt wird diese Person anschließend vom Bundestag.","en":{"q":"In 1974, German Federal President Gustav Heinemann presented Helmut Schmidt with the certificate appointing him Federal Chancellor. Which is one of the duties of the German Federal President?","a":["He / She conducts government business.","He / She controls the governing party.","He / She selects the ministers.","He / She proposes the Chancellor for election."],"x":"The Federal President proposes a candidate to the Bundestag for the office of Federal Chancellor. This person is then elected by the Bundestag."}},{"id":"G71","n":71,"land":false,"cat":"Staat","q":"Wo hält sich die deutsche Bundeskanzlerin / der deutsche Bundeskanzler am häufigsten auf?","a":["in Bonn, weil sich dort das Bundeskanzleramt und der Bundestag befinden.","auf Schloss Meseberg, dem Gästehaus der Bundesregierung, um Staatsgäste zu empfangen.","auf Schloss Bellevue, dem Amtssitz der Bundespräsidentin / des Bundespräsidenten, um Staatsgäste zu empfangen.","in Berlin, weil sich dort das Bundeskanzleramt und der Bundestag befinden."],"c":3,"x":"Der wichtigste Arbeitsort der Bundeskanzlerin oder des Bundeskanzlers ist Berlin. Dort befinden sich das Bundeskanzleramt und der Deutsche Bundestag.","en":{"q":"Where does the German Federal Chancellor spend most of their time?","a":["in Bonn, because the Federal Chancellery and the Bundestag are located there.","at Meseberg Castle, the federal government's guest house, to receive state guests.","at Bellevue Palace, the official residence of the Federal President, to receive state guests.","in Berlin, because the Federal Chancellery and the Bundestag are located there."],"x":"The main workplace of the Federal Chancellor is Berlin. The Federal Chancellery and the German Bundestag are located there."}},{"id":"G72","n":72,"land":false,"cat":"Politik","q":"Wie heißt die jetzige Bundeskanzlerin / der jetzige Bundeskanzler von Deutschland?","a":["Gerhard Schröder","Angela Merkel","Ursula von der Leyen","Friedrich Merz"],"c":3,"x":"Laut dem vorliegenden Fragenkatalog heißt der jetzige Bundeskanzler Friedrich Merz. Diese Frage bezieht sich auf die aktuelle politische Besetzung des Amtes im verwendeten Datensatz.","en":{"q":"What is the name of the current Federal Chancellor of Germany?","a":["Gerhard Schröder","Angela Merkel","Ursula von der Leyen","Friedrich Merz"],"x":"According to the present question catalog, the current Federal Chancellor is Friedrich Merz. This question refers to the current officeholder in the dataset being used."}},{"id":"G73","n":73,"land":false,"cat":"Politik","q":"Die beiden größten Fraktionen im Deutschen Bundestag heißen zurzeit …","a":["CDU/CSU und AfD.","Die Linke und Bündnis 90/Die Grünen.","Bündnis 90/Die Grünen und SPD.","Die Linke und CDU/CSU."],"c":0,"x":"Laut dem vorliegenden Fragenkatalog sind CDU/CSU und AfD zurzeit die beiden größten Fraktionen im Deutschen Bundestag. Eine Fraktion ist eine Gruppe von Abgeordneten, die politisch zusammenarbeitet.","en":{"q":"The two largest parliamentary groups in the German Bundestag are currently ...","a":["CDU/CSU and AfD.","The Left and Alliance 90/The Greens.","Alliance 90/The Greens and SPD.","The Left and CDU/CSU."],"x":"According to the present question catalog, CDU/CSU and AfD are currently the two largest parliamentary groups in the German Bundestag. A parliamentary group is a group of members of parliament who work together politically."}},{"id":"G74","n":74,"land":false,"cat":"Staat","q":"Wie heißt das Parlament für ganz Deutschland?","a":["Bundesversammlung","Volkskammer","Bundestag","Bundesgerichtshof"],"c":2,"x":"Das Parlament für ganz Deutschland heißt Deutscher Bundestag. Dort beraten und beschließen die Abgeordneten Bundesgesetze und kontrollieren die Bundesregierung.","en":{"q":"What is the parliament for all of Germany called?","a":["Federal Convention","People's Chamber","Bundestag","Federal Court of Justice"],"x":"The parliament for all of Germany is called the German Bundestag. There, members of parliament debate and pass federal laws and monitor the federal government."}},{"id":"G75","n":75,"land":false,"cat":"Politik","q":"Wie heißt Deutschlands heutiges Staatsoberhaupt?","a":["Frank-Walter Steinmeier","Bärbel Bas","Bodo Ramelow","Joachim Gauck"],"c":0,"x":"Laut dem vorliegenden Fragenkatalog ist Frank-Walter Steinmeier das Staatsoberhaupt Deutschlands. Das Staatsoberhaupt ist der Bundespräsident.","en":{"q":"What is the name of Germany's current head of state?","a":["Frank-Walter Steinmeier","Bärbel Bas","Bodo Ramelow","Joachim Gauck"],"x":"According to the present question catalog, Frank-Walter Steinmeier is Germany's head of state. The head of state is the Federal President."}},{"id":"G76","n":76,"land":false,"cat":"Politik","q":"Was bedeutet die Abkürzung CDU in Deutschland?","a":["Christliche Deutsche Union","Club Deutscher Unternehmer","Christlicher Deutscher Umweltschutz","Christlich Demokratische Union"],"c":3,"x":"CDU bedeutet Christlich Demokratische Union. Sie ist eine politische Partei in Deutschland.","en":{"q":"What does the abbreviation CDU stand for in Germany?","a":["Christian German Union","Club of German Entrepreneurs","Christian German Environmental Protection","Christian Democratic Union"],"x":"CDU stands for Christian Democratic Union. It is a political party in Germany."}},{"id":"G77","n":77,"land":false,"cat":"Staat","q":"Was ist die Bundeswehr?","a":["die deutsche Polizei","ein deutscher Hafen","eine deutsche Bürgerinitiative","die deutsche Armee"],"c":3,"x":"Die Bundeswehr sind die Streitkräfte Deutschlands. Sie gehören zum Bereich der staatlichen Verteidigung.","en":{"q":"What is the Bundeswehr?","a":["the German police","a German port","a German citizens' initiative","the German armed forces"],"x":"The Bundeswehr is Germany's armed forces. It is part of the state's defense sector."}},{"id":"G78","n":78,"land":false,"cat":"Politik","q":"Was bedeutet die Abkürzung SPD?","a":["Sozialistische Partei Deutschlands","Sozialpolitische Partei Deutschlands","Sozialdemokratische Partei Deutschlands","Sozialgerechte Partei Deutschlands"],"c":2,"x":"SPD bedeutet Sozialdemokratische Partei Deutschlands. Sie ist eine politische Partei in Deutschland.","en":{"q":"What does the abbreviation SPD stand for?","a":["Socialist Party of Germany","Social Policy Party of Germany","Social Democratic Party of Germany","Socially Just Party of Germany"],"x":"SPD stands for Social Democratic Party of Germany. It is a political party in Germany."}},{"id":"G79","n":79,"land":false,"cat":"Politik","q":"Was bedeutet die Abkürzung FDP in Deutschland?","a":["Friedliche Demonstrative Partei","Freie Deutschland Partei","Führende Demokratische Partei","Freie Demokratische Partei"],"c":3,"x":"FDP bedeutet Freie Demokratische Partei. Sie ist eine politische Partei in Deutschland.","en":{"q":"What does the abbreviation FDP stand for in Germany?","a":["Peaceful Demonstrative Party","Free Germany Party","Leading Democratic Party","Free Democratic Party"],"x":"FDP stands for Free Democratic Party. It is a political party in Germany."}},{"id":"G80","n":80,"land":false,"cat":"Recht","q":"Welches Gericht in Deutschland ist zuständig für die Auslegung des Grundgesetzes?","a":["Oberlandesgericht","Amtsgericht","Bundesverfassungsgericht","Verwaltungsgericht"],"c":2,"x":"Das Bundesverfassungsgericht ist für die Auslegung des Grundgesetzes zuständig. Es prüft zum Beispiel, ob Gesetze mit der Verfassung vereinbar sind.","en":{"q":"Which court in Germany is responsible for interpreting the Basic Law?","a":["Higher Regional Court","Local Court","Federal Constitutional Court","Administrative Court"],"x":"The Federal Constitutional Court is responsible for interpreting the Basic Law. For example, it examines whether laws are compatible with the constitution."}},{"id":"G81","n":81,"land":false,"cat":"Politik","q":"Wer wählt die Bundeskanzlerin / den Bundeskanzler in Deutschland?","a":["der Bundesrat","die Bundesversammlung","das Volk","der Bundestag"],"c":3,"x":"Die Bundeskanzlerin oder der Bundeskanzler wird vom Deutschen Bundestag gewählt. Das Volk wählt diese Person also nicht direkt.","en":{"q":"Who elects the Federal Chancellor in Germany?","a":["the Bundesrat","the Federal Convention","the people","the Bundestag"],"x":"The Federal Chancellor is elected by the German Bundestag. The people therefore do not elect this person directly."}},{"id":"G82","n":82,"land":false,"cat":"Politik","q":"Wer leitet das deutsche Bundeskabinett?","a":["die Bundestagspräsidentin / der Bundestagspräsident","die Bundespräsidentin / der Bundespräsident","die Bundesratspräsidentin / der Bundesratspräsident","die Bundeskanzlerin / der Bundeskanzler"],"c":3,"x":"Das Bundeskabinett wird von der Bundeskanzlerin oder dem Bundeskanzler geleitet. Zum Kabinett gehören die Bundesministerinnen und Bundesminister.","en":{"q":"Who heads the German federal cabinet?","a":["the President of the Bundestag","the Federal President","the President of the Bundesrat","the Federal Chancellor"],"x":"The federal cabinet is headed by the Federal Chancellor. The cabinet includes the federal ministers."}},{"id":"G83","n":83,"land":false,"cat":"Politik","q":"Wer wählt die deutsche Bundeskanzlerin / den deutschen Bundeskanzler?","a":["das Volk","die Bundesversammlung","der Bundestag","die Bundesregierung"],"c":2,"x":"Die Bundeskanzlerin oder der Bundeskanzler wird vom Bundestag gewählt. Die Abgeordneten stimmen über die vorgeschlagene Person ab.","en":{"q":"Who elects the German Federal Chancellor?","a":["the people","the Federal Convention","the Bundestag","the federal government"],"x":"The Federal Chancellor is elected by the Bundestag. The members of parliament vote on the proposed person."}},{"id":"G84","n":84,"land":false,"cat":"Politik","q":"Welche Hauptaufgabe hat die deutsche Bundespräsidentin / der deutsche Bundespräsident? Sie/Er …","a":["regiert das Land.","entwirft die Gesetze.","repräsentiert das Land.","überwacht die Einhaltung der Gesetze."],"c":2,"x":"Die Hauptaufgabe des Bundespräsidenten ist es, Deutschland zu repräsentieren. Das Amt hat vor allem staatliche und repräsentative Funktionen.","en":{"q":"What is the main duty of the German Federal President? He/She ...","a":["governs the country.","drafts laws.","represents the country.","monitors compliance with the laws."],"x":"The main duty of the Federal President is to represent Germany. The office primarily has state and representative functions."}},{"id":"G85","n":85,"land":false,"cat":"Bund und Länder","q":"Wer bildet den deutschen Bundesrat?","a":["die Abgeordneten des Bundestages","die Ministerinnen und Minister der Bundesregierung","die Regierungsvertreter der Bundesländer","die Parteimitglieder"],"c":2,"x":"Der Bundesrat besteht aus Mitgliedern der Regierungen der Bundesländer. Auf diese Weise wirken die Länder an politischen Entscheidungen des Bundes mit.","en":{"q":"Who makes up the German Bundesrat?","a":["the members of the Bundestag","the ministers of the federal government","the government representatives of the federal states","the party members"],"x":"The Bundesrat consists of members of the governments of the federal states. In this way, the states participate in political decisions at the federal level."}},{"id":"G86","n":86,"land":false,"cat":"Politik","q":"Wer wählt in Deutschland die Bundespräsidentin/den Bundespräsidenten?","a":["die Bundesversammlung","der Bundesrat","das Bundesparlament","das Bundesverfassungsgericht"],"c":0,"x":"Der Bundespräsident wird von der Bundesversammlung gewählt. Dieses besondere Gremium kommt nur zu diesem Zweck zusammen.","en":{"q":"Who elects the Federal President in Germany?","a":["the Federal Convention","the Bundesrat","the federal parliament","the Federal Constitutional Court"],"x":"The Federal President is elected by the Federal Convention. This special body meets only for this purpose."}},{"id":"G87","n":87,"land":false,"cat":"Politik","q":"Wer ist das Staatsoberhaupt der Bundesrepublik Deutschland?","a":["die Bundeskanzlerin / der Bundeskanzler","die Bundespräsidentin / der Bundespräsident","die Bundesratspräsidentin / der Bundesratspräsident","die Bundestagspräsidentin / der Bundestagspräsident"],"c":1,"x":"Das Staatsoberhaupt Deutschlands ist die Bundespräsidentin oder der Bundespräsident. Dieses Amt ist vom Amt der Bundeskanzlerin oder des Bundeskanzlers zu unterscheiden.","en":{"q":"Who is the head of state of the Federal Republic of Germany?","a":["the Federal Chancellor","the Federal President","the President of the Bundesrat","the President of the Bundestag"],"x":"Germany's head of state is the Federal President. This office is distinct from that of the Federal Chancellor."}},{"id":"G88","n":88,"land":false,"cat":"Politik","q":"Die parlamentarische Opposition im Deutschen Bundestag …","a":["kontrolliert die Regierung.","entscheidet, wer Bundesministerin / Bundesminister wird.","bestimmt, wer im Bundesrat sitzt.","schlägt die Regierungschefinnen / Regierungschefs der Länder vor."],"c":0,"x":"Eine wichtige Aufgabe der Opposition ist die Kontrolle der Regierung. Oppositionsparteien prüfen, kritisieren und hinterfragen die Arbeit der Regierungsmehrheit.","en":{"q":"The parliamentary opposition in the German Bundestag ...","a":["monitors the government.","decides who becomes a federal minister.","determines who sits in the Bundesrat.","proposes the heads of government of the federal states."],"x":"An important task of the opposition is to monitor the government. Opposition parties examine, criticize, and question the work of the governing majority."}},{"id":"G89","n":89,"land":false,"cat":"Politik","q":"Wie nennt man in Deutschland die Vereinigung von Abgeordneten einer Partei im Parlament?","a":["Verband","Ältestenrat","Fraktion","Opposition"],"c":2,"x":"Eine Gruppe von Abgeordneten derselben Partei oder politisch eng verbundener Parteien im Parlament nennt man Fraktion. Fraktionen organisieren die gemeinsame parlamentarische Arbeit.","en":{"q":"What is a group of members of one party in parliament called in Germany?","a":["association","Council of Elders","parliamentary group","opposition"],"x":"A group of members of parliament from the same party or from closely allied parties is called a parliamentary group. Parliamentary groups organize their joint parliamentary work."}},{"id":"G90","n":90,"land":false,"cat":"Bund und Länder","q":"Die deutschen Bundesländer wirken an der Gesetzgebung des Bundes mit durch …","a":["den Bundesrat.","die Bundesversammlung.","den Bundestag.","die Bundesregierung."],"c":0,"x":"Die Bundesländer wirken durch den Bundesrat an der Gesetzgebung des Bundes mit. Bei vielen Gesetzen hat der Bundesrat wichtige Mitwirkungsrechte.","en":{"q":"The German federal states participate in federal legislation through ...","a":["the Bundesrat.","the Federal Convention.","the Bundestag.","the federal government."],"x":"The federal states participate in federal legislation through the Bundesrat. For many laws, the Bundesrat has important participation rights."}},{"id":"G91","n":91,"land":false,"cat":"Bund und Länder","q":"In Deutschland kann ein Regierungswechsel in einem Bundesland Auswirkungen auf die Bundespolitik haben. Das Regieren wird …","a":["schwieriger, wenn sich dadurch die Mehrheit im Bundestag ändert.","leichter, wenn dadurch neue Parteien in den Bundesrat kommen.","schwieriger, wenn dadurch die Mehrheit im Bundesrat verändert wird.","leichter, wenn es sich um ein reiches Bundesland handelt."],"c":2,"x":"Ein Regierungswechsel in einem Bundesland kann die Mehrheitsverhältnisse im Bundesrat verändern. Dadurch kann es für die Bundesregierung schwieriger werden, bestimmte Gesetze durchzubringen.","en":{"q":"In Germany, a change of government in a federal state can affect federal politics. Governing becomes ...","a":["more difficult if this changes the majority in the Bundestag.","easier if new parties thereby enter the Bundesrat.","more difficult if this changes the majority in the Bundesrat.","easier if it is a wealthy federal state."],"x":"A change of government in a federal state can alter the balance of majorities in the Bundesrat. This can make it more difficult for the federal government to pass certain laws."}},{"id":"G92","n":92,"land":false,"cat":"Politik","q":"Was bedeutet die Abkürzung CSU in Deutschland?","a":["Christlich Sichere Union","Christlich Süddeutsche Union","Christlich Sozialer Unternehmerverband","Christlich Soziale Union"],"c":3,"x":"CSU bedeutet Christlich-Soziale Union. Sie ist eine politische Partei, die vor allem in Bayern aktiv ist.","en":{"q":"What does the abbreviation CSU stand for in Germany?","a":["Christian Secure Union","Christian South German Union","Christian Social Entrepreneurs' Association","Christian Social Union"],"x":"CSU stands for Christian Social Union. It is a political party that is mainly active in Bavaria."}},{"id":"G93","n":93,"land":false,"cat":"Politik","q":"Je mehr 'Zweitstimmen' eine Partei bei einer Bundestagswahl bekommt, desto …","a":["weniger Erststimmen kann sie haben.","mehr Direktkandidaten der Partei ziehen ins Parlament ein.","größer ist das Risiko, eine Koalition bilden zu müssen.","mehr Sitze erhält die Partei im Parlament."],"c":3,"x":"Die Zweitstimme ist besonders wichtig für die Verteilung der Sitze im Bundestag. Je mehr Zweitstimmen eine Partei erhält, desto größer ist grundsätzlich ihr Anteil an den Sitzen.","en":{"q":"The more 'second votes' a party receives in a Bundestag election, the ...","a":["fewer first votes it can have.","more direct candidates from the party enter parliament.","greater the risk that it will have to form a coalition.","more seats the party receives in parliament."],"x":"The second vote is particularly important for the distribution of seats in the Bundestag. In principle, the more second votes a party receives, the larger its share of seats."}},{"id":"G94","n":94,"land":false,"cat":"Politik","q":"Ab welchem Alter darf man in Deutschland an der Wahl zum Deutschen Bundestag teilnehmen?","a":["16","18","21","23"],"c":1,"x":"An der Bundestagswahl darf man in Deutschland ab 18 Jahren teilnehmen. Dafür muss man außerdem die weiteren gesetzlichen Voraussetzungen für das Wahlrecht erfüllen.","en":{"q":"From what age may a person participate in an election to the German Bundestag?","a":["16","18","21","23"],"x":"In Germany, a person may vote in a Bundestag election from the age of 18. They must also meet the other legal requirements for voting."}},{"id":"G95","n":95,"land":false,"cat":"Gesellschaft und Familie","q":"Was gilt für die meisten Kinder in Deutschland?","a":["Wahlpflicht","Schulpflicht","Schweigepflicht","Religionspflicht"],"c":1,"x":"Für die meisten Kinder in Deutschland gilt Schulpflicht. Das bedeutet, dass sie eine Schule besuchen müssen.","en":{"q":"What applies to most children in Germany?","a":["compulsory voting","compulsory schooling","duty of confidentiality","compulsory religion"],"x":"Compulsory schooling applies to most children in Germany. This means that they must attend school."}},{"id":"G96","n":96,"land":false,"cat":"Recht","q":"Wie kann jemand, der den Holocaust leugnet, bestraft werden?","a":["Kürzung sozialer Leistungen","bis zu 100 Sozialstunden","gar nicht, Holocaustleugnung ist erlaubt","mit Freiheitsstrafe bis zu fünf Jahren oder mit Geldstrafe"],"c":3,"x":"Holocaustleugnung kann in Deutschland strafbar sein. Laut diesem Fragenkatalog kann sie mit einer Geldstrafe oder mit Freiheitsstrafe bis zu fünf Jahren bestraft werden.","en":{"q":"How can someone who denies the Holocaust be punished?","a":["reduction of social benefits","up to 100 hours of community service","not at all, Holocaust denial is permitted","with imprisonment for up to five years or a fine"],"x":"Holocaust denial can be a criminal offense in Germany. According to this question catalog, it can be punished with a fine or imprisonment for up to five years."}},{"id":"G97","n":97,"land":false,"cat":"Wirtschaft","q":"Was bezahlt man in Deutschland automatisch, wenn man fest angestellt ist?","a":["Sozialversicherung","Sozialhilfe","Kindergeld","Wohngeld"],"c":0,"x":"Wer fest angestellt ist, zahlt normalerweise automatisch Beiträge zur Sozialversicherung. Diese Beiträge werden meist direkt vom Lohn oder Gehalt abgeführt.","en":{"q":"What do you automatically pay in Germany if you are permanently employed?","a":["social insurance","social assistance","child benefit","housing benefit"],"x":"People in permanent employment normally pay social insurance contributions automatically. These contributions are usually deducted directly from wages or salary."}},{"id":"G98","n":98,"land":false,"cat":"Politik","q":"Wenn Abgeordnete im Deutschen Bundestag ihre Fraktion wechseln, …","a":["dürfen sie nicht mehr an den Sitzungen des Parlaments teilnehmen.","kann die Regierung ihre Mehrheit verlieren.","muss die Bundespräsidentin / der Bundespräsident zuvor ihr/sein Einverständnis geben.","dürfen die Wählerinnen / Wähler dieser Abgeordneten noch einmal wählen."],"c":1,"x":"Wenn Abgeordnete ihre Fraktion wechseln, können sich die Mehrheitsverhältnisse im Bundestag ändern. Dadurch kann eine Regierung im Extremfall ihre parlamentarische Mehrheit verlieren.","en":{"q":"If members of the German Bundestag switch parliamentary groups, ...","a":["they may no longer take part in parliamentary sessions.","the government can lose its majority.","the Federal President must first give approval.","the voters of those members may vote again."],"x":"If members switch parliamentary groups, the balance of majorities in the Bundestag can change. In an extreme case, this can cause a government to lose its parliamentary majority."}},{"id":"G99","n":99,"land":false,"cat":"Wirtschaft","q":"Wer bezahlt in Deutschland die Sozialversicherungen?","a":["Arbeitgeberinnen / Arbeitgeber und Arbeitnehmerinnen / Arbeitnehmer","nur Arbeitnehmerinnen / Arbeitnehmer","alle Staatsangehörigen","nur Arbeitgeberinnen / Arbeitgeber"],"c":0,"x":"Die Sozialversicherungen werden in der Regel gemeinsam von Arbeitgebern und Arbeitnehmern finanziert. Beide Seiten zahlen Beiträge.","en":{"q":"Who pays for social insurance in Germany?","a":["employers and employees","employees only","all citizens","employers only"],"x":"Social insurance is generally financed jointly by employers and employees. Both sides pay contributions."}},{"id":"G100","n":100,"land":false,"cat":"Wirtschaft","q":"Was gehört nicht zur gesetzlichen Sozialversicherung?","a":["die Lebensversicherung","die gesetzliche Rentenversicherung","die Arbeitslosenversicherung","die Pflegeversicherung"],"c":0,"x":"Die Lebensversicherung gehört nicht zur gesetzlichen Sozialversicherung. Zur gesetzlichen Sozialversicherung gehören unter anderem Renten-, Arbeitslosen-, Kranken-, Pflege- und Unfallversicherung.","en":{"q":"Which is not part of statutory social insurance?","a":["life insurance","statutory pension insurance","unemployment insurance","long-term care insurance"],"x":"Life insurance is not part of statutory social insurance. Statutory social insurance includes, among other things, pension, unemployment, health, long-term care, and accident insurance."}},{"id":"G101","n":101,"land":false,"cat":"Wirtschaft","q":"Gewerkschaften sind Interessenverbände der …","a":["Jugendlichen.","Arbeitnehmerinnen und Arbeitnehmer.","Rentnerinnen und Rentner.","Arbeitgeberinnen und Arbeitgeber."],"c":1,"x":"Gewerkschaften vertreten die Interessen von Arbeitnehmerinnen und Arbeitnehmern. Sie setzen sich zum Beispiel für bessere Löhne, gute Arbeitsbedingungen und Rechte am Arbeitsplatz ein.","en":{"q":"Trade unions are interest groups representing …","a":["young people.","employees.","retirees.","employers."],"x":"Trade unions represent the interests of employees. For example, they advocate for better wages, good working conditions, and rights in the workplace."}},{"id":"G102","n":102,"land":false,"cat":"Gesellschaft und Familie","q":"Womit kann man in der Bundesrepublik Deutschland geehrt werden, wenn man auf politischem, wirtschaftlichem, kulturellem, geistigem oder sozialem Gebiet eine besondere Leistung erbracht hat? Mit dem …","a":["Bundesverdienstkreuz","Bundesadler","Vaterländischen Verdienstorden","Ehrentitel 'Held der Deutschen Demokratischen Republik'"],"c":0,"x":"Das Bundesverdienstkreuz ist eine wichtige staatliche Auszeichnung in Deutschland. Es wird für besondere Leistungen zum Beispiel in Politik, Wirtschaft, Kultur oder im sozialen Bereich verliehen.","en":{"q":"What can a person be honored with in the Federal Republic of Germany if they have made an outstanding contribution in the political, economic, cultural, intellectual, or social field? With the …","a":["Federal Cross of Merit","Federal Eagle","Patriotic Order of Merit","honorary title 'Hero of the German Democratic Republic'"],"x":"The Federal Cross of Merit is an important state award in Germany. It is awarded for outstanding achievements, for example in politics, business, culture, or the social sector."}},{"id":"G103","n":103,"land":false,"cat":"Politik","q":"Was wird in Deutschland als 'Ampelkoalition' bezeichnet? Die Zusammenarbeit …","a":["der Bundestagsfraktionen von CDU und CSU","von SPD, FDP und Bündnis 90/Die Grünen in einer Regierung","von CSU, Die LINKE und Bündnis 90/Die Grünen in einer Regierung","der Bundestagsfraktionen von CDU und SPD"],"c":1,"x":"Als Ampelkoalition bezeichnet man die Zusammenarbeit von SPD, FDP und Bündnis 90/Die Grünen. Der Name kommt von den Parteifarben Rot, Gelb und Grün, wie bei einer Ampel.","en":{"q":"What is referred to as a 'traffic light coalition' in Germany? The cooperation …","a":["between the CDU and CSU parliamentary groups in the Bundestag","between the SPD, FDP, and Alliance 90/The Greens in a government","between the CSU, The Left, and Alliance 90/The Greens in a government","between the CDU and SPD parliamentary groups in the Bundestag"],"x":"A traffic light coalition refers to cooperation between the SPD, FDP, and Alliance 90/The Greens. The name comes from the party colors red, yellow, and green, like a traffic light."}},{"id":"G104","n":104,"land":false,"cat":"Recht","q":"Eine Frau in Deutschland verliert ihre Arbeit. Was darf nicht der Grund für diese Entlassung sein?","a":["Die Frau ist lange krank und arbeitsunfähig.","Die Frau kam oft zu spät zur Arbeit.","Die Frau erledigt private Sachen während der Arbeitszeit.","Die Frau bekommt ein Kind und ihr Chef weiß das."],"c":3,"x":"Eine Frau darf nicht entlassen werden, nur weil sie ein Kind bekommt. Schwangere und Mütter stehen in Deutschland unter besonderem gesetzlichen Schutz.","en":{"q":"A woman in Germany loses her job. What must not be the reason for this dismissal?","a":["The woman is ill for a long time and unable to work.","The woman was often late for work.","The woman takes care of personal matters during working hours.","The woman is having a child and her boss knows about it."],"x":"A woman may not be dismissed simply because she is having a child. Pregnant women and mothers are protected by special legal provisions in Germany."}},{"id":"G105","n":105,"land":false,"cat":"Politik","q":"Was ist eine Aufgabe von Wahlhelferinnen / Wahlhelfern in Deutschland?","a":["Sie helfen alten Menschen bei der Stimmabgabe in der Wahlkabine.","Sie schreiben die Wahlbenachrichtigungen vor der Wahl.","Sie geben Zwischenergebnisse an die Medien weiter.","Sie zählen die Stimmen nach dem Ende der Wahl."],"c":3,"x":"Wahlhelferinnen und Wahlhelfer sorgen dafür, dass eine Wahl korrekt abläuft. Nach Ende der Wahl zählen sie unter anderem die abgegebenen Stimmen.","en":{"q":"What is one task of election workers in Germany?","a":["They help elderly people cast their vote in the voting booth.","They write the election notifications before the election.","They pass interim results on to the media.","They count the votes after the election has ended."],"x":"Election workers help ensure that an election is conducted correctly. After the election ends, one of their tasks is to count the votes cast."}},{"id":"G106","n":106,"land":false,"cat":"Politik","q":"In Deutschland helfen ehrenamtliche Wahlhelferinnen und Wahlhelfer bei den Wahlen. Was ist eine Aufgabe von Wahlhelferinnen / Wahlhelfern?","a":["Sie helfen Kindern und alten Menschen beim Wählen.","Sie schreiben Karten und Briefe mit der Angabe des Wahllokals.","Sie geben Zwischenergebnisse an Journalisten weiter.","Sie zählen die Stimmen nach dem Ende der Wahl."],"c":3,"x":"Wahlhelferinnen und Wahlhelfer unterstützen freiwillig die Durchführung der Wahl. Eine wichtige Aufgabe ist das Zählen der Stimmen nach Schließung der Wahllokale.","en":{"q":"In Germany, volunteer election workers help with elections. What is one task of election workers?","a":["They help children and elderly people vote.","They write cards and letters stating the polling station.","They pass interim results on to journalists.","They count the votes after the election has ended."],"x":"Election workers voluntarily support the conduct of the election. An important task is counting the votes after the polling stations close."}},{"id":"G107","n":107,"land":false,"cat":"Politik","q":"Für wie viele Jahre wird der Bundestag in Deutschland gewählt?","a":["2 Jahre","4 Jahre","6 Jahre","8 Jahre"],"c":1,"x":"Der Deutsche Bundestag wird grundsätzlich für vier Jahre gewählt. Danach findet normalerweise eine neue Bundestagswahl statt.","en":{"q":"For how many years is the Bundestag elected in Germany?","a":["2 years","4 years","6 years","8 years"],"x":"The German Bundestag is generally elected for four years. After that, a new federal election normally takes place."}},{"id":"G108","n":108,"land":false,"cat":"Politik","q":"Bei einer Bundestagswahl in Deutschland darf jede/jeder wählen, die/der …","a":["in der Bundesrepublik Deutschland wohnt und wählen möchte.","Bürgerin/Bürger der Bundesrepublik Deutschland ist und mindestens 18 Jahre alt ist.","seit mindestens 3 Jahren in der Bundesrepublik Deutschland lebt.","Bürgerin/Bürger der Bundesrepublik Deutschland ist und mindestens 21 Jahre alt ist."],"c":1,"x":"Bei einer Bundestagswahl dürfen deutsche Staatsbürgerinnen und Staatsbürger wählen, wenn sie das gesetzliche Wahlalter erreicht haben. Für die Bundestagswahl liegt es bei 18 Jahren.","en":{"q":"In a federal election in Germany, anyone may vote who …","a":["lives in the Federal Republic of Germany and wants to vote.","is a citizen of the Federal Republic of Germany and is at least 18 years old.","has lived in the Federal Republic of Germany for at least 3 years.","is a citizen of the Federal Republic of Germany and is at least 21 years old."],"x":"In a federal election, German citizens may vote if they have reached the legal voting age. For federal elections, this age is 18."}},{"id":"G109","n":109,"land":false,"cat":"Politik","q":"Wie oft gibt es normalerweise Bundestagswahlen in Deutschland?","a":["alle drei Jahre","alle vier Jahre","alle fünf Jahre","alle sechs Jahre"],"c":1,"x":"Bundestagswahlen finden normalerweise alle vier Jahre statt. In besonderen politischen Situationen kann es auch früher zu einer Neuwahl kommen.","en":{"q":"How often are federal elections normally held in Germany?","a":["every three years","every four years","every five years","every six years"],"x":"Federal elections normally take place every four years. In special political situations, an early election may also take place."}},{"id":"G110","n":110,"land":false,"cat":"Politik","q":"Für wie viele Jahre wird der Bundestag in Deutschland gewählt?","a":["2 Jahre","3 Jahre","4 Jahre","5 Jahre"],"c":2,"x":"Die Wahlperiode des Deutschen Bundestages beträgt grundsätzlich vier Jahre. In dieser Zeit arbeiten die gewählten Abgeordneten im Parlament.","en":{"q":"For how many years is the Bundestag elected in Germany?","a":["2 years","3 years","4 years","5 years"],"x":"The legislative term of the German Bundestag is generally four years. During this time, the elected members work in parliament."}},{"id":"G111","n":111,"land":false,"cat":"Recht","q":"Welche Handlungen mit Bezug auf den Staat Israel sind in Deutschland verboten?","a":["die Politik Israels öffentlich kritisieren","das Aufhängen einer israelischen Flagge auf dem Privatgrundstück","eine Diskussion über die Politik Israels","der öffentliche Aufruf zur Vernichtung Israels"],"c":3,"x":"Öffentliche Aufrufe zur Vernichtung Israels sind in Deutschland verboten. Kritik an der Politik Israels oder öffentliche Diskussionen darüber sind dagegen grundsätzlich von der Meinungsfreiheit geschützt.","en":{"q":"Which actions relating to the State of Israel are prohibited in Germany?","a":["publicly criticizing Israeli policy","displaying an Israeli flag on private property","holding a discussion about Israeli policy","publicly calling for the destruction of Israel"],"x":"Public calls for the destruction of Israel are prohibited in Germany. Criticism of Israeli policy or public discussions about it are, by contrast, generally protected by freedom of expression."}},{"id":"G112","n":112,"land":false,"cat":"Politik","q":"Die Wahlen in Deutschland sind …","a":["speziell.","geheim.","berufsbezogen.","geschlechtsabhängig."],"c":1,"x":"Wahlen in Deutschland sind geheim. Niemand muss sagen oder zeigen, welche Partei oder welche Person er gewählt hat.","en":{"q":"Elections in Germany are …","a":["special.","secret.","occupation-based.","gender-dependent."],"x":"Elections in Germany are secret. No one has to say or show which party or person they voted for."}},{"id":"G113","n":113,"land":false,"cat":"Politik","q":"Wahlen in Deutschland gewinnt die Partei, die …","a":["die meisten Stimmen bekommt.","die meisten Männer mehrheitlich gewählt haben.","die meisten Stimmen bei den Arbeiterinnen / Arbeitern bekommen hat.","die meisten Erststimmen für ihre Kanzlerkandidatin / ihren Kanzlerkandidaten erhalten hat."],"c":0,"x":"Bei Wahlen ist entscheidend, wie viele Stimmen die Parteien erhalten. Die Stimmen der Wählerinnen und Wähler bestimmen die Stärke der Parteien im Parlament.","en":{"q":"In Germany, an election is won by the party that …","a":["receives the most votes.","was chosen by the majority of male voters.","received the most votes from workers.","received the most first votes for its candidate for chancellor."],"x":"In elections, what matters is how many votes the parties receive. The votes of the electorate determine the strength of the parties in parliament."}},{"id":"G114","n":114,"land":false,"cat":"Politik","q":"An demokratischen Wahlen in Deutschland teilzunehmen ist …","a":["eine Pflicht.","ein Recht.","ein Zwang.","eine Last."],"c":1,"x":"An Wahlen teilzunehmen ist in Deutschland ein Recht. Niemand ist verpflichtet, wählen zu gehen.","en":{"q":"Participating in democratic elections in Germany is …","a":["a duty.","a right.","compulsory.","a burden."],"x":"Participating in elections is a right in Germany. No one is required to vote."}},{"id":"G115","n":115,"land":false,"cat":"Politik","q":"Was bedeutet \"aktives Wahlrecht\" in Deutschland?","a":["Man kann gewählt werden.","Man muss wählen gehen.","Man kann wählen.","Man muss zur Auszählung der Stimmen gehen."],"c":2,"x":"Aktives Wahlrecht bedeutet, dass eine Person selbst wählen darf. Davon zu unterscheiden ist das passive Wahlrecht, also das Recht, gewählt zu werden.","en":{"q":"What does 'active voting right' mean in Germany?","a":["You can be elected.","You have to vote.","You can vote.","You have to attend the counting of votes."],"x":"Active voting rights mean that a person is allowed to vote themselves. This is distinct from passive voting rights, which means the right to be elected."}},{"id":"G116","n":116,"land":false,"cat":"Politik","q":"Wenn Sie bei einer Bundestagswahl in Deutschland wählen dürfen, heißt das …","a":["aktive Wahlkampagne.","aktives Wahlverfahren.","aktiver Wahlkampf.","aktives Wahlrecht."],"c":3,"x":"Wer bei einer Wahl seine Stimme abgeben darf, hat aktives Wahlrecht. Das bedeutet einfach: Man darf wählen.","en":{"q":"If you are allowed to vote in a federal election in Germany, this is called …","a":["active election campaign.","active electoral procedure.","active campaigning.","active voting right."],"x":"Anyone who is allowed to cast a vote in an election has active voting rights. This simply means: you are allowed to vote."}},{"id":"G117","n":117,"land":false,"cat":"Politik","q":"Wie viel Prozent der Zweitstimmen müssen Parteien mindestens bekommen, um in den Deutschen Bundestag gewählt zu werden?","a":["3%","4%","5%","6%"],"c":2,"x":"Für den Einzug in den Bundestag gilt grundsätzlich die Fünf-Prozent-Hürde. Parteien müssen daher in der Regel mindestens fünf Prozent der Zweitstimmen erreichen.","en":{"q":"What minimum percentage of second votes must parties receive to be elected to the German Bundestag?","a":["3%","4%","5%","6%"],"x":"As a general rule, the five-percent threshold applies to entry into the Bundestag. Parties therefore generally need to receive at least five percent of the second votes."}},{"id":"G118","n":118,"land":false,"cat":"Gesellschaft und Familie","q":"Wer darf bei den rund 40 jüdischen Makkabi-Sportvereinen Mitglied werden?","a":["nur Deutsche","nur Israelis","nur religiöse Menschen","alle Menschen"],"c":3,"x":"In den Makkabi-Sportvereinen können grundsätzlich alle Menschen Mitglied werden. Sie sind nicht nur für jüdische oder israelische Personen offen.","en":{"q":"Who may become a member of the roughly 40 Jewish Makkabi sports clubs?","a":["only Germans","only Israelis","only religious people","all people"],"x":"In principle, anyone can become a member of Makkabi sports clubs. They are not open only to Jewish or Israeli people."}},{"id":"G119","n":119,"land":false,"cat":"Politik","q":"Wahlen in Deutschland sind frei. Was bedeutet das?","a":["Alle verurteilten Straftäterinnen / Straftäter dürfen nicht wählen.","Wenn ich wählen gehen möchte, muss meine Arbeitgeberin / mein Arbeitgeber mir frei geben.","Jede Person kann ohne Zwang entscheiden, ob sie wählen möchte und wen sie wählen möchte.","Ich kann frei entscheiden, wo ich wählen gehen möchte."],"c":2,"x":"Freie Wahlen bedeuten, dass jede Person ohne Druck oder Zwang entscheiden kann, ob und wen sie wählt. Niemand darf zu einer bestimmten Wahlentscheidung gezwungen werden.","en":{"q":"Elections in Germany are free. What does that mean?","a":["All convicted criminals are not allowed to vote.","If I want to vote, my employer has to give me time off.","Every person can decide without coercion whether they want to vote and whom they want to vote for.","I can freely decide where I want to vote."],"x":"Free elections mean that every person can decide without pressure or coercion whether and whom they vote for. No one may be forced to make a particular electoral choice."}},{"id":"G120","n":120,"land":false,"cat":"Politik","q":"Das Wahlsystem in Deutschland ist ein …","a":["Zensuswahlrecht.","Dreiklassenwahlrecht.","Mehrheits- und Verhältniswahlrecht.","allgemeines Männerwahlrecht."],"c":2,"x":"Das deutsche Wahlsystem verbindet Elemente der Mehrheitswahl und der Verhältniswahl. Dadurch spielen sowohl Direktkandidaten als auch die Stimmen für Parteien eine Rolle.","en":{"q":"The electoral system in Germany is a …","a":["census suffrage system.","three-class voting system.","mixed majority and proportional representation system.","universal male suffrage system."],"x":"The German electoral system combines elements of majority voting and proportional representation. As a result, both direct candidates and votes for parties play a role."}},{"id":"G121","n":121,"land":false,"cat":"Politik","q":"Eine Partei möchte in den Deutschen Bundestag. Sie muss aber einen Mindestanteil an Wählerstimmen haben. Das heißt …","a":["5%-Hürde.","Zulassungsgrenze.","Basiswert.","Richtlinie."],"c":0,"x":"Die Fünf-Prozent-Hürde ist eine Mindestgrenze für Parteien. Sie müssen grundsätzlich genug Stimmen erreichen, um in den Bundestag einzuziehen.","en":{"q":"A party wants to enter the German Bundestag. However, it must have a minimum share of the vote. This is called …","a":["the 5% threshold.","the admission threshold.","the base value.","the guideline."],"x":"The five-percent threshold is a minimum requirement for parties. As a general rule, they must receive enough votes to enter the Bundestag."}},{"id":"G122","n":122,"land":false,"cat":"Politik","q":"Welchem Grundsatz unterliegen Wahlen in Deutschland? Wahlen in Deutschland sind …","a":["frei, gleich, geheim.","offen, sicher, frei.","geschlossen, gleich, sicher.","sicher, offen, freiwillig."],"c":0,"x":"Wahlen in Deutschland müssen frei, gleich und geheim sein. Diese Grundsätze sollen faire und demokratische Wahlen sichern.","en":{"q":"What principle do elections in Germany follow? Elections in Germany are …","a":["free, equal, secret.","open, secure, free.","closed, equal, secure.","secure, open, voluntary."],"x":"Elections in Germany must be free, equal, and secret. These principles are intended to ensure fair and democratic elections."}},{"id":"G123","n":123,"land":false,"cat":"Politik","q":"Was ist in Deutschland die \"5%-Hürde\"?","a":["Abstimmungsregelung im Bundestag für kleine Parteien","Anwesenheitskontrolle im Bundestag für Abstimmungen","Mindestanteil an Wählerstimmen, um ins Parlament zu kommen","Anwesenheitskontrolle im Bundesrat für Abstimmungen"],"c":2,"x":"Die Fünf-Prozent-Hürde bezeichnet den Mindestanteil an Stimmen, den eine Partei grundsätzlich für den Einzug in ein Parlament erreichen muss.","en":{"q":"What is the '5% threshold' in Germany?","a":["a voting rule in the Bundestag for small parties","an attendance check in the Bundestag for votes","the minimum share of votes required to enter parliament","an attendance check in the Bundesrat for votes"],"x":"The five-percent threshold refers to the minimum share of votes that a party generally needs to enter a parliament."}},{"id":"G124","n":124,"land":false,"cat":"Politik","q":"Die Bundestagswahl in Deutschland ist die Wahl …","a":["der Bundeskanzlerin / des Bundeskanzlers.","der Parlamente der Länder.","des Parlaments für Deutschland.","der Bundespräsidentin / des Bundespräsidenten."],"c":2,"x":"Bei der Bundestagswahl wählen die Bürgerinnen und Bürger den Deutschen Bundestag. Der Bundestag ist das Parlament auf Bundesebene.","en":{"q":"The federal election in Germany is the election …","a":["of the Federal Chancellor.","of the state parliaments.","of Germany's federal parliament.","of the Federal President."],"x":"In the federal election, citizens elect the German Bundestag. The Bundestag is the parliament at the federal level."}},{"id":"G125","n":125,"land":false,"cat":"Politik","q":"In einer Demokratie ist eine Funktion von regelmäßigen Wahlen, …","a":["die Bürgerinnen und Bürger zu zwingen, ihre Stimme abzugeben.","nach dem Willen der Wählermehrheit den Wechsel der Regierung zu ermöglichen.","im Land bestehende Gesetze beizubehalten.","den Armen mehr Macht zu geben."],"c":1,"x":"Regelmäßige Wahlen ermöglichen einen friedlichen politischen Wechsel. Wenn sich die Mehrheiten ändern, kann dadurch auch eine andere Regierung entstehen.","en":{"q":"In a democracy, one function of regular elections is …","a":["to force citizens to cast their votes.","to make a change of government possible according to the will of the majority of voters.","to keep existing laws in the country unchanged.","to give poor people more power."],"x":"Regular elections make peaceful political change possible. If majorities change, this can also lead to a different government."}},{"id":"G126","n":126,"land":false,"cat":"Politik","q":"Was bekommen wahlberechtigte Bürgerinnen und Bürger in Deutschland vor einer Wahl?","a":["eine Wahlbenachrichtigung von der Gemeinde","eine Wahlerlaubnis von der Bundespräsidentin / von dem Bundespräsidenten","eine Benachrichtigung von der Bundesversammlung","eine Benachrichtigung vom Pfarramt"],"c":0,"x":"Vor einer Wahl erhalten Wahlberechtigte normalerweise eine Wahlbenachrichtigung von ihrer Gemeinde. Darin stehen wichtige Informationen wie das Wahllokal und der Wahltermin.","en":{"q":"What do eligible voters in Germany receive before an election?","a":["an election notification from the municipality","permission to vote from the Federal President","a notification from the Federal Convention","a notification from the parish office"],"x":"Before an election, eligible voters normally receive an election notification from their municipality. It contains important information such as the polling station and the election date."}},{"id":"G127","n":127,"land":false,"cat":"Politik","q":"Warum gibt es die 5%-Hürde im Wahlgesetz der Bundesrepublik Deutschland? Es gibt sie, weil …","a":["die Programme von vielen kleinen Parteien viele Gemeinsamkeiten haben.","die Bürgerinnen und Bürger bei vielen kleinen Parteien die Orientierung verlieren können.","viele kleine Parteien die Regierungsbildung erschweren.","die kleinen Parteien nicht so viel Geld haben, um die Politikerinnen und Politiker zu bezahlen."],"c":2,"x":"Die Fünf-Prozent-Hürde soll verhindern, dass sehr viele kleine Parteien den Bundestag stark zersplittern. Eine zu starke Zersplitterung kann die Bildung stabiler Mehrheiten erschweren.","en":{"q":"Why is there a 5% threshold in the electoral law of the Federal Republic of Germany? It exists because …","a":["the programs of many small parties have many similarities.","citizens can lose track when there are many small parties.","many small parties make it more difficult to form a government.","small parties do not have enough money to pay politicians."],"x":"The five-percent threshold is intended to prevent the Bundestag from becoming highly fragmented by a large number of small parties. Excessive fragmentation can make it more difficult to form stable majorities."}},{"id":"G128","n":128,"land":false,"cat":"Politik","q":"Parlamentsmitglieder, die von den Bürgerinnen und Bürgern gewählt werden, nennt man …","a":["Abgeordnete.","Kanzlerinnen / Kanzler.","Botschafterinnen / Botschafter.","Ministerpräsidentinnen / Ministerpräsidenten."],"c":0,"x":"Gewählte Mitglieder eines Parlaments nennt man Abgeordnete. Sie vertreten die Bürgerinnen und Bürger im Parlament.","en":{"q":"Members of parliament who are elected by citizens are called …","a":["members of parliament.","chancellors.","ambassadors.","state premiers."],"x":"Elected members of a parliament are called members of parliament. They represent the citizens in parliament."}},{"id":"G129","n":129,"land":false,"cat":"Politik","q":"Vom Volk gewählt wird in Deutschland …","a":["die Bundeskanzlerin / der Bundeskanzler.","die Ministerpräsidentin / der Ministerpräsident eines Bundeslandes.","der Bundestag.","die Bundespräsidentin / der Bundespräsident."],"c":2,"x":"Bei der Bundestagswahl wählen die Bürgerinnen und Bürger direkt den Bundestag. Der Bundeskanzler und der Bundespräsident werden nicht direkt vom Volk gewählt.","en":{"q":"In Germany, the people elect …","a":["the Federal Chancellor.","the state premier of a federal state.","the Bundestag.","the Federal President."],"x":"In the federal election, citizens directly elect the Bundestag. The Federal Chancellor and the Federal President are not directly elected by the people."}},{"id":"G130","n":130,"land":false,"cat":"Politik","q":"Welcher Stimmzettel wäre bei einer Bundestagswahl gültig?","a":["1","2","3","4"],"c":0,"x":"Ein Stimmzettel ist nur gültig, wenn die Kreuze nach den Wahlregeln eindeutig gesetzt sind. Bei der abgebildeten Aufgabe zeigt Stimmzettel 1 eine gültige Stimmabgabe.","en":{"q":"Which ballot paper would be valid in a federal election?","a":["1","2","3","4"],"x":"A ballot paper is valid only if the marks are clearly made in accordance with the election rules. In the illustrated example, ballot paper 1 shows a valid vote."},"img":"data:image/webp;base64,UklGRloMAQBXRUJQVlA4IE4MAQAQ+QKdASp5AnwCPmEokEYkIqGhKbVtqIAMCWNu+/Oxv4C5MZuyFfcX9F+t3EY8pnefHi8hoo5obuOppv9i1ZzmvK/9LsDZX9Qfzf8l6QPJveh8M/A/bf87P7/py+I/5PlrdC/+v/Df5z3v/7n/4f7n3If0P/ff9L8///T9hH6g/rP/qPhX/1/Vx/hP/Z6j/7J/x/3c96j/0fuj73f8Z6gv9T/63///+fak+hF+4frIf+797vh2/u//O/dz/0e9H///YA///tx9Kv1T/rX4++8P5d+pf3n+4f5r/Qf2f0z/JPn37l/a/8n/qv7X/+P+F9xH3v/heDXqH/k/6/1K/lX3F/Kf3T9yP7z+633b/a/91/h/9H/vf8V+7Hsv+c/sv+t/vn7lf5T5BfyP+X/3P+z/4z/d/3b9zvtC+c/6H+d/43fdbF/l/+T/hvYF9bvoH+t/vH+b/8v+G+Af4r/df5D/R/9f9//kn7Bf7//K/vj/nPsA/lv9R/0P98/dP/C////9fdv+2/83+j8oT77/u//F/mfyy+wP+X/1//bf4T/R/+X/If
