ldaten.","Sie arbeiten freiwillig und unbezahlt in Vereinen und Verbänden.","Sie arbeiten in der Bundesregierung.","Sie arbeiten in einem Krankenhaus und verdienen dabei Geld."],"c":1,"x":"Ehrenamtliche Arbeit ist freiwillig und wird normalerweise nicht bezahlt. Viele Menschen engagieren sich zum Beispiel in Vereinen, sozialen Projekten oder anderen Organisationen.","en":{"q":"Many people in Germany do volunteer work in their free time. What does that mean?","a":["They work as soldiers.","They work voluntarily and without pay in clubs and associations.","They work in the federal government.","They work in a hospital and earn money for it."],"x":"Volunteer work is done voluntarily and is normally unpaid. Many people get involved, for example, in clubs, social projects, or other organizations."}},{"id":"G133","n":133,"land":false,"cat":"Politik","q":"Was ist bei Bundestags- und Landtagswahlen in Deutschland erlaubt?","a":["Der Ehemann wählt für seine Frau mit.","Man kann durch Briefwahl seine Stimme abgeben.","Man kann am Wahltag telefonisch seine Stimme abgeben.","Kinder ab dem Alter von 14 Jahren dürfen wählen."],"c":1,"x":"Bei Bundestags- und Landtagswahlen ist Briefwahl erlaubt. So kann man seine Stimme auch abgeben, wenn man am Wahltag nicht ins Wahllokal gehen kann.","en":{"q":"What is allowed in federal and state parliament elections in Germany?","a":["A husband votes on behalf of his wife as well.","You can cast your vote by postal ballot.","You can cast your vote by telephone on election day.","Children aged 14 and over are allowed to vote."],"x":"Postal voting is allowed in federal and state parliament elections. This allows people to cast their vote even if they cannot go to the polling station on election day."}},{"id":"G134","n":134,"land":false,"cat":"Gesellschaft und Familie","q":"Man will die Buslinie abschaffen, mit der Sie immer zur Arbeit fahren. Was können Sie machen, um die Buslinie zu erhalten?","a":["Ich beteilige mich an einer Bürgerinitiative für die Erhaltung der Buslinie oder gründe selber eine Initiative.","Ich werde Mitglied in einem Sportverein und trainiere Radfahren.","Ich wende mich an das Finanzamt, weil ich als Steuerzahlerin / Steuerzahler ein Recht auf die Buslinie habe.","Ich schreibe einen Brief an das Forstamt der Gemeinde."],"c":0,"x":"Eine Bürgerinitiative ist eine Möglichkeit, sich gemeinsam mit anderen für ein konkretes Anliegen einzusetzen. So können Bürgerinnen und Bürger zum Beispiel gegen die Abschaffung einer Buslinie protestieren.","en":{"q":"The bus route you always use to get to work is going to be discontinued. What can you do to help keep the bus route?","a":["I take part in a citizens' initiative to preserve the bus route or start an initiative myself.","I join a sports club and train in cycling.","I contact the tax office because, as a taxpayer, I have a right to the bus route.","I write a letter to the municipality's forestry office."],"x":"A citizens' initiative is one way to work together with others for a specific cause. For example, citizens can protest against the discontinuation of a bus route."}},{"id":"G135","n":135,"land":false,"cat":"Wirtschaft","q":"Wen vertreten die Gewerkschaften in Deutschland?","a":["große Unternehmen","kleine Unternehmen","Selbstständige","Arbeitnehmerinnen und Arbeitnehmer"],"c":3,"x":"Gewerkschaften vertreten Arbeitnehmerinnen und Arbeitnehmer. Sie setzen sich zum Beispiel für Löhne, Arbeitszeiten und bessere Arbeitsbedingungen ein.","en":{"q":"Whom do trade unions represent in Germany?","a":["large companies","small companies","self-employed people","employees"],"x":"Trade unions represent employees. For example, they advocate for wages, working hours, and better working conditions."}},{"id":"G136","n":136,"land":false,"cat":"Recht","q":"Sie gehen in Deutschland zum Arbeitsgericht bei …","a":["falscher Nebenkostenabrechnung.","ungerechtfertigter Kündigung durch Ihre Chefin / Ihren Chef.","Problemen mit den Nachbarinnen / Nachbarn.","Schwierigkeiten nach einem Verkehrsunfall."],"c":1,"x":"Das Arbeitsgericht ist für Streitigkeiten zwischen Beschäftigten und Arbeitgebern zuständig. Dazu gehört zum Beispiel eine möglicherweise ungerechtfertigte Kündigung.","en":{"q":"In Germany, you go to the labor court in the case of …","a":["an incorrect utility cost statement.","an unjustified dismissal by your employer.","problems with neighbors.","difficulties after a traffic accident."],"x":"The labor court is responsible for disputes between employees and employers. This includes, for example, a potentially unjustified dismissal."}},{"id":"G137","n":137,"land":false,"cat":"Recht","q":"Welches Gericht ist in Deutschland bei Konflikten in der Arbeitswelt zuständig?","a":["das Familiengericht","das Strafgericht","das Arbeitsgericht","das Amtsgericht"],"c":2,"x":"Bei Konflikten aus dem Arbeitsverhältnis ist das Arbeitsgericht zuständig. Es entscheidet zum Beispiel über Kündigungen, Lohnfragen oder andere arbeitsrechtliche Streitigkeiten.","en":{"q":"Which court in Germany is responsible for conflicts in the workplace?","a":["the family court","the criminal court","the labor court","the local court"],"x":"The labor court is responsible for disputes arising from employment relationships. For example, it decides on dismissals, wage issues, or other employment-law disputes."}},{"id":"G138","n":138,"land":false,"cat":"Recht","q":"Was kann ich in Deutschland machen, wenn mir meine Arbeitgeberin / mein Arbeitgeber zu Unrecht gekündigt hat?","a":["weiterarbeiten und freundlich zur Chefin / zum Chef sein","ein Mahnverfahren gegen die Arbeitgeberin / den Arbeitgeber führen","Kündigungsschutzklage erheben","die Arbeitgeberin / den Arbeitgeber bei der Polizei anzeigen"],"c":2,"x":"Wer eine Kündigung für unrechtmäßig hält, kann eine Kündigungsschutzklage erheben. Damit prüft das Arbeitsgericht, ob die Kündigung rechtlich wirksam ist.","en":{"q":"What can I do in Germany if my employer has dismissed me unlawfully?","a":["continue working and be friendly to my employer","initiate a payment order procedure against the employer","file an unfair dismissal claim","report the employer to the police"],"x":"Anyone who considers a dismissal unlawful can file an unfair dismissal claim. The labor court then examines whether the dismissal is legally valid."}},{"id":"G139","n":139,"land":false,"cat":"Recht","q":"Wann kommt es in Deutschland zu einem Prozess vor Gericht? Wenn jemand …","a":["zu einer anderen Religion übertritt.","eine Straftat begangen hat und angeklagt wird.","eine andere Meinung als die der Regierung vertritt.","sein Auto falsch geparkt hat und es abgeschleppt wird."],"c":1,"x":"Ein Gerichtsprozess kann stattfinden, wenn jemand wegen einer Straftat angeklagt wird. Dann prüft das Gericht den Fall und entscheidet über Schuld und mögliche Strafe.","en":{"q":"When does a court trial take place in Germany? When someone …","a":["converts to another religion.","has committed a criminal offense and is charged.","holds a different opinion from the government.","parks their car incorrectly and it is towed away."],"x":"A court trial may take place when someone is charged with a criminal offense. The court then examines the case and decides on guilt and any possible punishment."}},{"id":"G140","n":140,"land":false,"cat":"Recht","q":"Was macht eine Schöffin / ein Schöffe in Deutschland? Sie/Er …","a":["entscheidet mit Richterinnen / Richtern über Schuld und Strafe.","gibt Bürgerinnen / Bürgern rechtlichen Rat.","stellt Urkunden aus.","verteidigt die Angeklagte / den Angeklagten."],"c":0,"x":"Schöffinnen und Schöffen sind ehrenamtliche Richterinnen und Richter. Sie entscheiden gemeinsam mit Berufsrichterinnen und Berufsrichtern über Schuld und Strafe.","en":{"q":"What does a lay judge do in Germany? They …","a":["decide together with professional judges on guilt and punishment.","give citizens legal advice.","issue official documents.","defend the accused."],"x":"Lay judges are honorary judges. Together with professional judges, they decide on guilt and punishment."}},{"id":"G141","n":141,"land":false,"cat":"Recht","q":"Wer berät in Deutschland Personen bei Rechtsfragen und vertritt sie vor Gericht?","a":["eine Rechtsanwältin / ein Rechtsanwalt","eine Richterin / ein Richter","eine Schöffin / ein Schöffe","eine Staatsanwältin / ein Staatsanwalt"],"c":0,"x":"Rechtsanwältinnen und Rechtsanwälte beraten Menschen bei rechtlichen Fragen. Sie können ihre Mandanten auch vor Gericht vertreten.","en":{"q":"Who in Germany advises people on legal matters and represents them in court?","a":["a lawyer","a judge","a lay judge","a public prosecutor"],"x":"Lawyers advise people on legal matters. They can also represent their clients in court."}},{"id":"G142","n":142,"land":false,"cat":"Recht","q":"Was ist die Hauptaufgabe einer Richterin / eines Richters in Deutschland? Eine Richterin / ein Richter …","a":["vertritt Bürgerinnen und Bürger vor einem Gericht.","arbeitet an einem Gericht und spricht Urteile.","ändert Gesetze.","betreut Jugendliche vor Gericht."],"c":1,"x":"Richterinnen und Richter arbeiten an Gerichten und entscheiden Rechtsfälle. Ihre wichtigste Aufgabe ist es, nach den geltenden Gesetzen Urteile zu sprechen.","en":{"q":"What is the main task of a judge in Germany? A judge …","a":["represents citizens before a court.","works at a court and delivers judgments.","changes laws.","looks after young people in court."],"x":"Judges work in courts and decide legal cases. Their most important task is to deliver judgments in accordance with the applicable laws."}},{"id":"G143","n":143,"land":false,"cat":"Staat","q":"Eine Richterin / ein Richter in Deutschland gehört zur …","a":["Judikative.","Exekutive.","Operative.","Legislative."],"c":0,"x":"Richterinnen und Richter gehören zur Judikative. Die Judikative ist die rechtsprechende Gewalt des Staates.","en":{"q":"A judge in Germany belongs to the …","a":["judiciary.","executive.","operations branch.","legislature."],"x":"Judges belong to the judiciary. The judiciary is the branch of government responsible for administering justice."}},{"id":"G144","n":144,"land":false,"cat":"Staat","q":"Eine Richterin / ein Richter gehört in Deutschland zur …","a":["vollziehenden Gewalt.","rechtsprechenden Gewalt.","planenden Gewalt.","gesetzgebenden Gewalt."],"c":1,"x":"Die rechtsprechende Gewalt nennt man Judikative. Richterinnen und Richter gehören zu diesem Teil der staatlichen Gewalt.","en":{"q":"A judge in Germany belongs to the …","a":["executive branch.","judicial branch.","planning branch.","legislative branch."],"x":"The judicial branch is called the judiciary. Judges belong to this branch of state power."}},{"id":"G145","n":145,"land":false,"cat":"Staat","q":"In Deutschland wird die Staatsgewalt geteilt. Für welche Staatsgewalt arbeitet eine Richterin / ein Richter? Für die …","a":["Judikative","Exekutive","Presse","Legislative"],"c":0,"x":"Deutschland teilt die Staatsgewalt in Legislative, Exekutive und Judikative. Richterinnen und Richter arbeiten für die Judikative, also die rechtsprechende Gewalt.","en":{"q":"In Germany, state power is divided. For which branch of state power does a judge work? For the …","a":["judiciary","executive","press","legislature"],"x":"Germany divides state power into the legislative, executive, and judicial branches. Judges work for the judiciary, which is the branch responsible for administering justice."}},{"id":"G146","n":146,"land":false,"cat":"Recht","q":"Wie nennt man in Deutschland ein Verfahren vor einem Gericht?","a":["Programm","Prozedur","Protokoll","Prozess"],"c":3,"x":"Ein Verfahren vor Gericht nennt man Prozess. In einem Prozess prüft das Gericht einen Streitfall oder eine Anklage.","en":{"q":"What is a proceeding before a court called in Germany?","a":["program","procedure","record","trial"],"x":"A proceeding before a court is called a trial. In a trial, the court examines a dispute or a criminal charge."}},{"id":"G147","n":147,"land":false,"cat":"Recht","q":"Was ist die Arbeit einer Richterin / eines Richters in Deutschland?","a":["Deutschland regieren","Recht sprechen","Pläne erstellen","Gesetze erlassen"],"c":1,"x":"Richterinnen und Richter sprechen Recht. Sie wenden Gesetze auf konkrete Fälle an und treffen gerichtliche Entscheidungen.","en":{"q":"What is the work of a judge in Germany?","a":["governing Germany","administering justice","creating plans","enacting laws"],"x":"Judges administer justice. They apply laws to specific cases and make judicial decisions."}},{"id":"G148","n":148,"land":false,"cat":"Recht","q":"Was ist eine Aufgabe der Polizei in Deutschland?","a":["das Land zu verteidigen","die Bürgerinnen und Bürger abzuhören","die Gesetze zu beschließen","die Einhaltung von Gesetzen zu überwachen"],"c":3,"x":"Die Polizei achtet darauf, dass Gesetze eingehalten werden, und schützt die öffentliche Sicherheit. Gesetze selbst werden von Parlamenten beschlossen.","en":{"q":"What is one task of the police in Germany?","a":["defending the country","wiretapping citizens","passing laws","monitoring compliance with laws"],"x":"The police ensure that laws are obeyed and protect public safety. Laws themselves are passed by parliaments."}},{"id":"G149","n":149,"land":false,"cat":"Recht","q":"Was ist ein Beispiel für antisemitisches Verhalten?","a":["ein jüdisches Fest besuchen","die israelische Regierung kritisieren","den Holocaust leugnen","gegen Juden Fußball spielen"],"c":2,"x":"Die Leugnung des Holocaust ist ein Beispiel für antisemitisches Verhalten und in Deutschland auch strafbar. Kritik an der israelischen Regierung ist dagegen nicht automatisch antisemitisch.","en":{"q":"What is an example of antisemitic behavior?","a":["attending a Jewish festival","criticizing the Israeli government","denying the Holocaust","playing football against Jewish people"],"x":"Holocaust denial is an example of antisemitic behavior and is also a criminal offense in Germany. Criticism of the Israeli government, by contrast, is not automatically antisemitic."}},{"id":"G150","n":150,"land":false,"cat":"Recht","q":"Eine Gerichtsschöffin / ein Gerichtsschöffe in Deutschland ist …","a":["die Stellvertreterin / der Stellvertreter des Stadtoberhaupts.","eine ehrenamtliche Richterin / ein ehrenamtlicher Richter.","ein Mitglied eines Gemeinderats.","eine Person, die Jura studiert hat."],"c":1,"x":"Eine Gerichtsschöffin oder ein Gerichtsschöffe ist eine ehrenamtliche Richterin oder ein ehrenamtlicher Richter. Dafür ist kein abgeschlossenes Jurastudium erforderlich.","en":{"q":"A lay judge in a German court is …","a":["the deputy of the head of a city.","an honorary judge.","a member of a municipal council.","a person who has studied law."],"x":"A lay judge at a court is an honorary judge. A completed university law degree is not required for this role."}},{"id":"G151","n":151,"land":false,"cat":"Geschichte","q":"Wer baute die Mauer in Berlin?","a":["Großbritannien","die DDR","die Bundesrepublik Deutschland","die USA"],"c":1,"x":"Die Berliner Mauer wurde von der DDR gebaut. Sie sollte verhindern, dass viele Menschen aus der DDR nach West-Berlin und in die Bundesrepublik flohen.","en":{"q":"Who built the Wall in Berlin?","a":["Great Britain","the GDR","the Federal Republic of Germany","the USA"],"x":"The Berlin Wall was built by the GDR. It was intended to prevent many people from fleeing from the GDR to West Berlin and the Federal Republic of Germany."}},{"id":"G152","n":152,"land":false,"cat":"Geschichte","q":"Wann waren die Nationalsozialisten mit Adolf Hitler in Deutschland an der Macht?","a":["1918 bis 1923","1932 bis 1950","1933 bis 1945","1945 bis 1989"],"c":2,"x":"Die Nationalsozialisten unter Adolf Hitler waren von 1933 bis 1945 an der Macht. In dieser Zeit war Deutschland eine Diktatur.","en":{"q":"When were the National Socialists under Adolf Hitler in power in Germany?","a":["1918 to 1923","1932 to 1950","1933 to 1945","1945 to 1989"],"x":"The National Socialists under Adolf Hitler were in power from 1933 to 1945. During this period, Germany was a dictatorship."}},{"id":"G153","n":153,"land":false,"cat":"Geschichte","q":"Was war am 8. Mai 1945?","a":["Tod Adolf Hitlers","Beginn des Berliner Mauerbaus","Wahl von Konrad Adenauer zum Bundeskanzler","Ende des Zweiten Weltkriegs in Europa"],"c":3,"x":"Am 8. Mai 1945 endete der Zweite Weltkrieg in Europa. Deutschland hatte militärisch kapituliert.","en":{"q":"What happened on May 8, 1945?","a":["Death of Adolf Hitler","Beginning of the construction of the Berlin Wall","Election of Konrad Adenauer as Federal Chancellor","End of the Second World War in Europe"],"x":"On May 8, 1945, the Second World War in Europe ended. Germany had surrendered militarily."}},{"id":"G154","n":154,"land":false,"cat":"Geschichte","q":"Wann war der Zweite Weltkrieg zu Ende?","a":["1933","1945","1949","1961"],"c":1,"x":"Der Zweite Weltkrieg endete 1945. In Europa war der Krieg im Mai 1945 vorbei.","en":{"q":"When did the Second World War end?","a":["1933","1945","1949","1961"],"x":"The Second World War ended in 1945. In Europe, the war was over in May 1945."}},{"id":"G155","n":155,"land":false,"cat":"Geschichte","q":"Wann waren die Nationalsozialisten in Deutschland an der Macht?","a":["1888 bis 1918","1921 bis 1934","1933 bis 1945","1949 bis 1963"],"c":2,"x":"Die Nationalsozialisten regierten Deutschland von 1933 bis 1945. Diese Zeit endete mit der Niederlage Deutschlands im Zweiten Weltkrieg.","en":{"q":"When were the National Socialists in power in Germany?","a":["1888 to 1918","1921 to 1934","1933 to 1945","1949 to 1963"],"x":"The National Socialists ruled Germany from 1933 to 1945. This period ended with Germany's defeat in the Second World War."}},{"id":"G156","n":156,"land":false,"cat":"Geschichte","q":"In welchem Jahr wurde Hitler Reichskanzler?","a":["1923","1927","1933","1936"],"c":2,"x":"Adolf Hitler wurde 1933 Reichskanzler. Kurz danach bauten die Nationalsozialisten die Demokratie ab und errichteten eine Diktatur.","en":{"q":"In which year did Hitler become Reich Chancellor?","a":["1923","1927","1933","1936"],"x":"Adolf Hitler became Reich Chancellor in 1933. Shortly afterward, the National Socialists dismantled democracy and established a dictatorship."}},{"id":"G157","n":157,"land":false,"cat":"Geschichte","q":"Die Nationalsozialisten mit Adolf Hitler errichteten 1933 in Deutschland …","a":["eine Diktatur.","einen demokratischen Staat.","eine Monarchie.","ein Fürstentum."],"c":0,"x":"1933 errichteten die Nationalsozialisten in Deutschland eine Diktatur. Politische Gegner wurden verfolgt und demokratische Rechte stark eingeschränkt.","en":{"q":"In 1933, the National Socialists under Adolf Hitler established in Germany …","a":["a dictatorship.","a democratic state.","a monarchy.","a principality."],"x":"In 1933, the National Socialists established a dictatorship in Germany. Political opponents were persecuted and democratic rights were severely restricted."}},{"id":"G158","n":158,"land":false,"cat":"Geschichte","q":"Das \"Dritte Reich\" war eine …","a":["Diktatur.","Demokratie.","Monarchie.","Räterepublik."],"c":0,"x":"Das sogenannte Dritte Reich war eine Diktatur. Freie Wahlen und politische Freiheit gab es nicht.","en":{"q":"The \"Third Reich\" was a …","a":["dictatorship.","democracy.","monarchy.","council republic."],"x":"The so-called Third Reich was a dictatorship. There were no free elections or political freedom."}},{"id":"G159","n":159,"land":false,"cat":"Geschichte","q":"Was gab es in Deutschland nicht während der Zeit des Nationalsozialismus?","a":["freie Wahlen","Pressezensur","willkürliche Verhaftungen","Verfolgung von Juden"],"c":0,"x":"Während des Nationalsozialismus gab es keine freien Wahlen. Dagegen gab es Zensur, Verhaftungen und die systematische Verfolgung von Jüdinnen und Juden.","en":{"q":"What did not exist in Germany during the National Socialist era?","a":["free elections","press censorship","arbitrary arrests","persecution of Jews"],"x":"During the National Socialist era, there were no free elections. By contrast, there was censorship, arrests, and the systematic persecution of Jewish people."}},{"id":"G160","n":160,"land":false,"cat":"Geschichte","q":"Welcher Krieg dauerte von 1939 bis 1945?","a":["der Erste Weltkrieg","der Zweite Weltkrieg","der Vietnamkrieg","der Golfkrieg"],"c":1,"x":"Der Zweite Weltkrieg dauerte von 1939 bis 1945. Er begann in Europa mit dem deutschen Angriff auf Polen.","en":{"q":"Which war lasted from 1939 to 1945?","a":["the First World War","the Second World War","the Vietnam War","the Gulf War"],"x":"The Second World War lasted from 1939 to 1945. In Europe, it began with Germany's attack on Poland."}},{"id":"G161","n":161,"land":false,"cat":"Geschichte","q":"Was kennzeichnete den NS-Staat? Eine Politik …","a":["des staatlichen Rassismus","der Meinungsfreiheit","der allgemeinen Religionsfreiheit","der Entwicklung der Demokratie"],"c":0,"x":"Der NS-Staat war durch staatlichen Rassismus geprägt. Menschen wurden aufgrund ihrer Herkunft oder angeblichen Rasse verfolgt und entrechtet.","en":{"q":"What characterized the Nazi state? A policy of …","a":["state-sponsored racism","freedom of expression","general freedom of religion","the development of democracy"],"x":"The Nazi state was characterized by state-sponsored racism. People were persecuted and deprived of their rights because of their origin or alleged race."}},{"id":"G162","n":162,"land":false,"cat":"Geschichte","q":"Claus Schenk Graf von Stauffenberg wurde bekannt durch …","a":["eine Goldmedaille bei den Olympischen Spielen 1936.","den Bau des Reichstagsgebäudes.","den Aufbau der Wehrmacht.","das Attentat auf Hitler am 20. Juli 1944."],"c":3,"x":"Claus Schenk Graf von Stauffenberg wurde durch das Attentat auf Hitler am 20. Juli 1944 bekannt. Der Versuch, Hitler zu töten und das NS-Regime zu stürzen, scheiterte.","en":{"q":"Claus Schenk Graf von Stauffenberg became known for …","a":["winning a gold medal at the 1936 Olympic Games.","the construction of the Reichstag building.","the buildup of the Wehrmacht.","the assassination attempt on Hitler on July 20, 1944."],"x":"Claus Schenk Graf von Stauffenberg became known for the assassination attempt on Hitler on July 20, 1944. The attempt to kill Hitler and overthrow the Nazi regime failed."}},{"id":"G163","n":163,"land":false,"cat":"Geschichte","q":"In welchem Jahr zerstörten die Nationalsozialisten Synagogen und jüdische Geschäfte in Deutschland?","a":["1925","1930","1938","1945"],"c":2,"x":"1938 zerstörten Nationalsozialisten und ihre Anhänger viele Synagogen und jüdische Geschäfte. Diese Gewalt war Teil der zunehmenden Verfolgung der jüdischen Bevölkerung.","en":{"q":"In which year did the National Socialists destroy synagogues and Jewish-owned businesses in Germany?","a":["1925","1930","1938","1945"],"x":"In 1938, National Socialists and their supporters destroyed many synagogues and Jewish-owned businesses. This violence was part of the increasing persecution of the Jewish population."}},{"id":"G164","n":164,"land":false,"cat":"Geschichte","q":"Was passierte am 9. November 1938 in Deutschland?","a":["Mit dem Angriff auf Polen beginnt der Zweite Weltkrieg.","Die Nationalsozialisten verlieren eine Wahl und lösen den Reichstag auf.","Jüdische Geschäfte und Synagogen werden durch Nationalsozialisten und ihre Anhänger zerstört.","Hitler wird Reichspräsident und lässt alle Parteien verbieten."],"c":2,"x":"Am 9. November 1938 wurden in Deutschland Synagogen und jüdische Geschäfte zerstört. Viele Jüdinnen und Juden wurden misshandelt, verhaftet oder getötet.","en":{"q":"What happened in Germany on November 9, 1938?","a":["The Second World War begins with the attack on Poland.","The National Socialists lose an election and dissolve the Reichstag.","Jewish-owned businesses and synagogues are destroyed by National Socialists and their supporters.","Hitler becomes Reich President and has all parties banned."],"x":"On November 9, 1938, synagogues and Jewish-owned businesses were destroyed in Germany. Many Jewish people were abused, arrested, or killed."}},{"id":"G165","n":165,"land":false,"cat":"Geschichte","q":"Wie hieß der erste Bundeskanzler der Bundesrepublik Deutschland?","a":["Konrad Adenauer","Kurt Georg Kiesinger","Helmut Schmidt","Willy Brandt"],"c":0,"x":"Konrad Adenauer war der erste Bundeskanzler der Bundesrepublik Deutschland. Er regierte von 1949 bis 1963.","en":{"q":"What was the name of the first Federal Chancellor of the Federal Republic of Germany?","a":["Konrad Adenauer","Kurt Georg Kiesinger","Helmut Schmidt","Willy Brandt"],"x":"Konrad Adenauer was the first Federal Chancellor of the Federal Republic of Germany. He governed from 1949 to 1963."}},{"id":"G166","n":166,"land":false,"cat":"Geschichte","q":"Bei welchen Demonstrationen in Deutschland riefen die Menschen \"Wir sind das Volk\"?","a":["beim Arbeiteraufstand 1953 in der DDR","bei den Demonstrationen 1968 in der Bundesrepublik Deutschland","bei den Anti-Atomkraft-Demonstrationen 1985 in der Bundesrepublik Deutschland","bei den Montagsdemonstrationen 1989 in der DDR"],"c":3,"x":"Der Ruf „Wir sind das Volk“ wurde besonders bei den Montagsdemonstrationen 1989 in der DDR bekannt. Die Menschen forderten politische Veränderungen und mehr Freiheit.","en":{"q":"At which demonstrations in Germany did people chant \"We are the people\"?","a":["during the workers' uprising in the GDR in 1953","during the 1968 demonstrations in the Federal Republic of Germany","during the anti-nuclear demonstrations in the Federal Republic of Germany in 1985","during the Monday demonstrations in the GDR in 1989"],"x":"The slogan \"We are the people\" became particularly well known during the Monday demonstrations in the GDR in 1989. People demanded political change and greater freedom."}},{"id":"G167","n":167,"land":false,"cat":"Geschichte","q":"Welche Länder wurden nach dem Zweiten Weltkrieg in Deutschland als \"Alliierte Besatzungsmächte\" bezeichnet?","a":["Sowjetunion, Großbritannien, Polen, Schweden","Frankreich, Sowjetunion, Italien, Japan","USA, Sowjetunion, Spanien, Portugal","USA, Sowjetunion, Großbritannien, Frankreich"],"c":3,"x":"Nach dem Zweiten Weltkrieg waren die USA, die Sowjetunion, Großbritannien und Frankreich Besatzungsmächte in Deutschland. Sie teilten Deutschland in vier Besatzungszonen.","en":{"q":"Which countries were referred to as the \"Allied occupying powers\" in Germany after the Second World War?","a":["Soviet Union, Great Britain, Poland, Sweden","France, Soviet Union, Italy, Japan","USA, Soviet Union, Spain, Portugal","USA, Soviet Union, Great Britain, France"],"x":"After the Second World War, the USA, the Soviet Union, Great Britain, and France were occupying powers in Germany. They divided Germany into four occupation zones."}},{"id":"G168","n":168,"land":false,"cat":"Geschichte","q":"Welches Land war keine \"Alliierte Besatzungsmacht\" in Deutschland?","a":["USA","Sowjetunion","Frankreich","Japan"],"c":3,"x":"Japan war keine Besatzungsmacht in Deutschland. Die vier Besatzungsmächte waren die USA, die Sowjetunion, Großbritannien und Frankreich.","en":{"q":"Which country was not an \"Allied occupying power\" in Germany?","a":["USA","Soviet Union","France","Japan"],"x":"Japan was not an occupying power in Germany. The four occupying powers were the USA, the Soviet Union, Great Britain, and France."}},{"id":"G169","n":169,"land":false,"cat":"Geschichte","q":"Wann wurde die Bundesrepublik Deutschland gegründet?","a":["1939","1945","1949","1951"],"c":2,"x":"Die Bundesrepublik Deutschland wurde 1949 gegründet. Sie entstand aus den westlichen Besatzungszonen.","en":{"q":"When was the Federal Republic of Germany founded?","a":["1939","1945","1949","1951"],"x":"The Federal Republic of Germany was founded in 1949. It emerged from the western occupation zones."}},{"id":"G170","n":170,"land":false,"cat":"Geschichte","q":"Was gab es während der Zeit des Nationalsozialismus in Deutschland?","a":["das Verbot von Parteien","das Recht zur freien Entfaltung der Persönlichkeit","Pressefreiheit","den Schutz der Menschenwürde"],"c":0,"x":"Im Nationalsozialismus wurden andere Parteien verboten. Die NSDAP sollte die einzige politische Macht im Staat sein.","en":{"q":"What existed in Germany during the National Socialist era?","a":["the banning of political parties","the right to free development of one's personality","freedom of the press","the protection of human dignity"],"x":"Under National Socialism, other political parties were banned. The Nazi Party was intended to be the only political power in the state."}},{"id":"G171","n":171,"land":false,"cat":"Wirtschaft","q":"Soziale Marktwirtschaft bedeutet, die Wirtschaft …","a":["steuert sich allein nach Angebot und Nachfrage.","wird vom Staat geplant und gesteuert, Angebot und Nachfrage werden nicht berücksichtigt.","richtet sich nach der Nachfrage im Ausland.","richtet sich nach Angebot und Nachfrage, aber der Staat sorgt für einen sozialen Ausgleich."],"c":3,"x":"Bei der sozialen Marktwirtschaft wirken Angebot und Nachfrage, aber der Staat sorgt zusätzlich für sozialen Ausgleich. Dazu gehören zum Beispiel soziale Sicherungssysteme.","en":{"q":"A social market economy means that the economy …","a":["is governed solely by supply and demand.","is planned and controlled by the state, with supply and demand not taken into account.","is guided by demand abroad.","is guided by supply and demand, but the state ensures social balance."],"x":"In a social market economy, supply and demand operate, but the state also ensures social balance. This includes, for example, social security systems."}},{"id":"G172","n":172,"land":false,"cat":"Geschichte","q":"In welcher Besatzungszone wurde die DDR gegründet? In der …","a":["amerikanischen Besatzungszone","französischen Besatzungszone","britischen Besatzungszone","sowjetischen Besatzungszone"],"c":3,"x":"Die DDR wurde in der sowjetischen Besatzungszone gegründet. Sie entstand 1949 im Osten Deutschlands.","en":{"q":"In which occupation zone was the GDR founded? In the …","a":["American occupation zone","French occupation zone","British occupation zone","Soviet occupation zone"],"x":"The GDR was founded in the Soviet occupation zone. It was established in eastern Germany in 1949."}},{"id":"G173","n":173,"land":false,"cat":"Europa und Welt","q":"Die Bundesrepublik Deutschland ist ein Gründungsmitglied …","a":["des Nordatlantikpakts (NATO).","der Vereinten Nationen (VN).","der Europäischen Union (EU).","des Warschauer Pakts."],"c":2,"x":"Die Bundesrepublik Deutschland gehört zu den Gründungsmitgliedern der Europäischen Gemeinschaften, aus denen später die Europäische Union entstand. Bei der NATO und den Vereinten Nationen war sie kein Gründungsmitglied.","en":{"q":"The Federal Republic of Germany is a founding member of …","a":["the North Atlantic Treaty Organization (NATO).","the United Nations (UN).","the European Union (EU).","the Warsaw Pact."],"x":"The Federal Republic of Germany is among the founding members of the European Communities, from which the European Union later emerged. It was not a founding member of NATO or the United Nations."}},{"id":"G174","n":174,"land":false,"cat":"Geschichte","q":"Wann wurde die DDR gegründet?","a":["1947","1949","1953","1956"],"c":1,"x":"Die DDR wurde 1949 gegründet. Sie entstand im Gebiet der sowjetischen Besatzungszone.","en":{"q":"When was the GDR founded?","a":["1947","1949","1953","1956"],"x":"The GDR was founded in 1949. It was established in the territory of the Soviet occupation zone."}},{"id":"G175","n":175,"land":false,"cat":"Geschichte","q":"Wie viele Besatzungszonen gab es in Deutschland nach dem Zweiten Weltkrieg?","a":["3","4","5","6"],"c":1,"x":"Nach dem Zweiten Weltkrieg wurde Deutschland in vier Besatzungszonen geteilt. Sie wurden von den USA, der Sowjetunion, Großbritannien und Frankreich verwaltet.","en":{"q":"How many occupation zones were there in Germany after the Second World War?","a":["3","4","5","6"],"x":"After the Second World War, Germany was divided into four occupation zones. They were administered by the USA, the Soviet Union, Great Britain, and France."}},{"id":"G176","n":176,"land":false,"cat":"Geschichte","q":"Wie waren die Besatzungszonen Deutschlands nach 1945 verteilt?","a":["1=Großbritannien, 2=Sowjetunion, 3=Frankreich, 4=USA","1=Sowjetunion, 2=Großbritannien, 3=USA, 4=Frankreich","1=Großbritannien, 2=Sowjetunion, 3=USA, 4=Frankreich","1=Großbritannien, 2=USA, 3=Sowjetunion, 4=Frankreich"],"c":2,"x":"Nach 1945 war Deutschland in vier Besatzungszonen aufgeteilt. Die richtige Zuordnung auf der Karte ist Großbritannien, Sowjetunion, USA und Frankreich entsprechend den markierten Gebieten.","en":{"q":"How were Germany's occupation zones distributed after 1945?","a":["1=Great Britain, 2=Soviet Union, 3=France, 4=USA","1=Soviet Union, 2=Great Britain, 3=USA, 4=France","1=Great Britain, 2=Soviet Union, 3=USA, 4=France","1=Great Britain, 2=USA, 3=Soviet Union, 4=France"],"x":"After 1945, Germany was divided into four occupation zones. The correct assignment on the map is Great Britain, Soviet Union, USA, and France according to the marked areas."},"img":"data:image/webp;base64,UklGRpqiAABXRUJQVlA4II6iAACQ1wGdASqKAs8DPmEuk0ekIiGpI9fY0SAMCWNu9+X+/tp8ROAEnJ5bPPKu7pGC112PoAeZvPzQzo80CWU+sv8Z93/LnyZ5L9O/jf8J+0v+E/br5zON+uLyB9x/wn+f/sn7ffe5/P7xvh/+H9N3wTeYfr3+1/wX+h/6/+g/////+///H/7v+Q9xn9S/z//b/y377fQD+qH+r/wf+S/7P+h//////D//h/dT3Nf2//r/kz8Af6N/eP/X/lv3/+ZX/i/sv7kf7V/tf2y/4/yBfz//H/9v8//mb/5v/59wj/D/7z/8f8T4Bf5p/hv/D+f/xs/uP/yvkh/s//E/cP/nf//6Cf6L/lf/b/of9Z///+r9AH/j//PsAf9D/8f8j4Qf4B+//u/+W/3P/d/1n2O+GP5v+r/uJ6A+JzzJ+u/5X/Vf373dcqfZnqX/Hftn+p/uv+I/8P+S+fP9f/v/8N4q/K//D/yfsBfif83/0P93/xvuDfWf9ftmdU/wf/V/yPsBesXzH/df1//U/+3/MfEJ8z/t/QX9L/vH/T/tfwAfyP+W/73+3flZ8n/5H/jfnb6Iv1n/Q/+f/eflz9gP8b/o3+z/tn+B/93+d////0/G3+k/4X+U/y/7Re0H8//xX/T/xn+a/Zn7Av41/PP9p/df8R/8v9P/////91v/D/Pb5xfs5/2fzh+hr9RP9Z+fH+rFkE5tP2H0FRbMAd0/YfQVFswB3T9h9BUWzAHdP2H0FRbMAd0/Yf f dem Landwege."],"c":3,"x":"Während der Berlin-Blockade 1948 und 1949 sperrte die Sowjetunion die Land- und Wasserwege nach West-Berlin. Deshalb versorgten die Westalliierten die Stadt mit Flugzeugen über die Luftbrücke.","en":{"q":"From June 1948 to May 1949, the citizens of West Berlin were supplied by an airlift. What circumstance made this necessary?","a":["For France, supplying the population of West Berlin by airplane was less expensive.","The American soldiers were afraid of attacks during overland transport.","For Great Britain, supplying West Berlin via the airlift was faster.","The Soviet Union cut off all overland traffic."],"x":"During the Berlin Blockade of 1948 and 1949, the Soviet Union blocked the land and water routes to West Berlin. Therefore, the Western Allies supplied the city by aircraft through the airlift."}},{"id":"G179","n":179,"land":false,"cat":"Geschichte","q":"Wie endete der Zweite Weltkrieg in Europa offiziell?","a":["mit dem Tod Adolf Hitlers","durch die bedingungslose Kapitulation Deutschlands","mit dem Rückzug der Deutschen aus den besetzten Gebieten","durch eine Revolution in Deutschland"],"c":1,"x":"Der Zweite Weltkrieg in Europa endete offiziell mit der bedingungslosen Kapitulation Deutschlands. Damit gab die deutsche Wehrmacht den Kampf auf.","en":{"q":"How did the Second World War in Europe officially end?","a":["with the death of Adolf Hitler","with Germany's unconditional surrender","with the withdrawal of German forces from the occupied territories","through a revolution in Germany"],"x":"The Second World War in Europe officially ended with Germany's unconditional surrender. This meant that the German Wehrmacht ceased fighting."}},{"id":"G180","n":180,"land":false,"cat":"Geschichte","q":"Der erste Bundeskanzler der Bundesrepublik Deutschland war …","a":["Ludwig Erhard.","Willy Brandt.","Konrad Adenauer.","Gerhard Schröder."],"c":2,"x":"Der erste Bundeskanzler der Bundesrepublik Deutschland war Konrad Adenauer. Er trat sein Amt 1949 an.","en":{"q":"The first Federal Chancellor of the Federal Republic of Germany was …","a":["Ludwig Erhard.","Willy Brandt.","Konrad Adenauer.","Gerhard Schröder."],"x":"The first Federal Chancellor of the Federal Republic of Germany was Konrad Adenauer. He took office in 1949."}},{"id":"G181","n":181,"land":false,"cat":"Geschichte","q":"Was wollte Willy Brandt mit seinem Kniefall 1970 im ehemaligen jüdischen Ghetto in Warschau ausdrücken?","a":["Er hat sich den ehemaligen Alliierten unterworfen.","Er bat Polen und die polnischen Juden um Vergebung.","Er zeigte seine Demut vor dem Warschauer Pakt.","Er sprach ein Gebet am Grab des Unbekannten Soldaten."],"c":1,"x":"Willy Brandts Kniefall in Warschau 1970 war ein Zeichen der Demut und des Gedenkens an die Opfer des Nationalsozialismus. Er wurde als Bitte um Vergebung und als wichtiges Symbol der Versöhnung verstanden.","en":{"q":"What did Willy Brandt intend to express with his kneeling gesture in 1970 at the former Jewish ghetto in Warsaw?","a":["He submitted to the former Allies.","He asked Poland and Polish Jews for forgiveness.","He showed his humility before the Warsaw Pact.","He said a prayer at the Tomb of the Unknown Soldier."],"x":"Willy Brandt's kneeling gesture in Warsaw in 1970 was a sign of humility and remembrance for the victims of National Socialism. It was understood as a plea for forgiveness and an important symbol of reconciliation."}},{"id":"G182","n":182,"land":false,"cat":"Religion und Kultur","q":"Wie heißt das jüdische Gebetshaus?","a":["Basilika","Moschee","Synagoge","Kirche"],"c":2,"x":"Das jüdische Gebetshaus heißt Synagoge. Dort finden Gottesdienste, Gebete und andere religiöse Veranstaltungen statt.","en":{"q":"What is the Jewish house of worship called?","a":["basilica","mosque","synagogue","church"],"x":"The Jewish house of worship is called a synagogue. Religious services, prayers, and other religious events take place there."}},{"id":"G183","n":183,"land":false,"cat":"Geschichte","q":"Wann war in der Bundesrepublik Deutschland das \"Wirtschaftswunder\"?","a":["40er Jahre","50er Jahre","70er Jahre","80er Jahre"],"c":1,"x":"Das deutsche Wirtschaftswunder wird vor allem mit den 1950er Jahren verbunden. In dieser Zeit wuchs die Wirtschaft der Bundesrepublik sehr schnell.","en":{"q":"When did the \"economic miracle\" take place in the Federal Republic of Germany?","a":["1940s","1950s","1970s","1980s"],"x":"The German economic miracle is associated mainly with the 1950s. During this period, the economy of the Federal Republic grew very rapidly."}},{"id":"G184","n":184,"land":false,"cat":"Geschichte","q":"Auf welcher rechtlichen Grundlage wurde der Staat Israel gegründet?","a":["eine Resolution der Vereinten Nationen","ein Beschluss des Zionistenkongresses","ein Vorschlag der Bundesregierung","ein Vorschlag der UdSSR"],"c":0,"x":"Die Gründung des Staates Israel stand im Zusammenhang mit einer Resolution der Vereinten Nationen von 1947, die einen Teilungsplan für das damalige britische Mandatsgebiet Palästina vorsah.","en":{"q":"On what legal basis was the State of Israel founded?","a":["a resolution of the United Nations","a decision of the Zionist Congress","a proposal by the Federal Government","a proposal by the USSR"],"x":"The founding of the State of Israel was connected to a 1947 United Nations resolution that provided for a partition plan for the then British Mandate territory of Palestine."}},{"id":"G185","n":185,"land":false,"cat":"Geschichte","q":"Wofür stand der Ausdruck \"Eiserner Vorhang\"? Für die Abschottung …","a":["des Warschauer Pakts gegen den Westen","Norddeutschlands gegen Süddeutschland","Nazi-Deutschlands gegen die Alliierten","Europas gegen die USA"],"c":0,"x":"Der Ausdruck „Eiserner Vorhang“ bezeichnete die politische und militärische Trennung zwischen dem kommunistischen Osten Europas und dem Westen während des Kalten Krieges.","en":{"q":"What did the term \"Iron Curtain\" refer to? The isolation of …","a":["the Warsaw Pact from the West","northern Germany from southern Germany","Nazi Germany from the Allies","Europe from the USA"],"x":"The term \"Iron Curtain\" referred to the political and military division between the communist East of Europe and the West during the Cold War."}},{"id":"G186","n":186,"land":false,"cat":"Geschichte","q":"Im Jahr 1953 gab es in der DDR einen Aufstand, an den lange Zeit in der Bundesrepublik Deutschland ein Feiertag erinnerte. Wann war das?","a":["1. Mai","17. Juni","20. Juli","9. November"],"c":1,"x":"Am 17. Juni 1953 kam es in der DDR zu einem großen Aufstand gegen die Regierung. In der Bundesrepublik erinnerte lange Zeit ein Feiertag an dieses Datum.","en":{"q":"In 1953, there was an uprising in the GDR that was commemorated for many years by a public holiday in the Federal Republic of Germany. When was it?","a":["May 1","June 17","July 20","November 9"],"x":"On June 17, 1953, a major uprising against the government took place in the GDR. For many years, a public holiday in the Federal Republic commemorated this date."}},{"id":"G187","n":187,"land":false,"cat":"Geschichte","q":"Welcher deutsche Staat hatte eine schwarz-rot-goldene Flagge mit Hammer, Zirkel und Ährenkranz?","a":["Preußen","Bundesrepublik Deutschland","\"Drittes Reich\"","DDR"],"c":3,"x":"Die DDR hatte eine schwarz-rot-goldene Flagge mit Hammer, Zirkel und Ährenkranz. Diese Symbole standen für Arbeiter, Intellektuelle und Bauern.","en":{"q":"Which German state had a black-red-gold flag with a hammer, compass, and wreath of grain?","a":["Prussia","Federal Republic of Germany","\"Third Reich\"","GDR"],"x":"The GDR had a black-red-gold flag with a hammer, compass, and wreath of grain. These symbols represented workers, intellectuals, and farmers."},"img":"data:image/webp;base64,UklGRiYxAABXRUJQVlA4IBoxAACQswCdASpGAl8BPmEwlEekIyIhI7n5cIAMCU3cLqohBHf8h3W3kfFfl77Ntl/wf9r/XH9p95/a72J5VPQ3/O/wfuB/z/+39hf9V/zP/V9wD9Q/2I9zP/U9Sf92/4nqG/qv+R/aj3lP9z+yHuf/v/qAf1L/P//jsHf3T9gv91PTc/eD4Rf7L/z ":"GDR stands for German Democratic Republic. It existed from 1949 to 1990."}},{"id":"G191","n":191,"land":false,"cat":"Geschichte","q":"Wann wurde die Mauer in Berlin für alle geöffnet?","a":["1987","1989","1992","1995"],"c":1,"x":"Die Berliner Mauer wurde am 9. November 1989 geöffnet. Danach konnten Menschen aus der DDR die Grenze nach West-Berlin frei überqueren.","en":{"q":"When was the Wall in Berlin opened to everyone?","a":["1987","1989","1992","1995"],"x":"The Berlin Wall was opened on November 9, 1989. After that, people from the GDR could freely cross the border into West Berlin."}},{"id":"G192","n":192,"land":false,"cat":"Geschichte","q":"Welches heutige deutsche Bundesland gehörte früher zum Gebiet der DDR?","a":["Brandenburg","Bayern","Saarland","Hessen"],"c":0,"x":"Brandenburg gehörte zum Gebiet der DDR. Nach der deutschen Wiedervereinigung 1990 wurde es wieder ein Bundesland.","en":{"q":"Which present-day German federal state formerly belonged to the territory of the GDR?","a":["Brandenburg","Bavaria","Saarland","Hesse"],"x":"Brandenburg belonged to the territory of the GDR. After German reunification in 1990, it once again became a federal state."}},{"id":"G193","n":193,"land":false,"cat":"Geschichte","q":"Von 1961 bis 1989 war Berlin …","a":["ohne Bürgermeister.","ein eigener Staat.","durch eine Mauer geteilt.","nur mit dem Flugzeug erreichbar."],"c":2,"x":"Von 1961 bis 1989 war Berlin durch die Mauer geteilt. West-Berlin und Ost-Berlin gehörten zu unterschiedlichen politischen Systemen.","en":{"q":"From 1961 to 1989, Berlin was …","a":["without a mayor.","an independent state.","divided by a wall.","reachable only by airplane."],"x":"From 1961 to 1989, Berlin was divided by the Wall. West Berlin and East Berlin belonged to different political systems."}},{"id":"G194","n":194,"land":false,"cat":"Geschichte","q":"Am 3. Oktober feiert man in Deutschland den Tag der Deutschen …","a":["Einheit.","Nation.","Bundesländer.","Städte."],"c":0,"x":"Am 3. Oktober feiert Deutschland den Tag der Deutschen Einheit. Er erinnert an die Wiedervereinigung von Bundesrepublik und DDR im Jahr 1990.","en":{"q":"On October 3, Germany celebrates the Day of German …","a":["Unity.","Nation.","Federal States.","Cities."],"x":"On October 3, Germany celebrates the Day of German Unity. It commemorates the reunification of the Federal Republic of Germany and the GDR in 1990."}},{"id":"G195","n":195,"land":false,"cat":"Geschichte","q":"Welches heutige deutsche Bundesland gehörte früher zum Gebiet der DDR?","a":["Hessen","Sachsen-Anhalt","Nordrhein-Westfalen","Saarland"],"c":1,"x":"Sachsen-Anhalt lag früher im Gebiet der DDR. Seit 1990 ist es eines der 16 Bundesländer Deutschlands.","en":{"q":"Which present-day German federal state formerly belonged to the territory of the GDR?","a":["Hesse","Saxony-Anhalt","North Rhine-Westphalia","Saarland"],"x":"Saxony-Anhalt was formerly part of the territory of the GDR. Since 1990, it has been one of Germany's 16 federal states."}},{"id":"G196","n":196,"land":false,"cat":"Geschichte","q":"Warum nennt man die Zeit im Herbst 1989 in der DDR \"Die Wende\"? In dieser Zeit veränderte sich die DDR politisch …","a":["von einer Diktatur zur Demokratie.","von einer liberalen Marktwirtschaft zum Sozialismus.","von einer Monarchie zur Sozialdemokratie.","von einem religiösen Staat zu einem kommunistischen Staat."],"c":0,"x":"Mit der „Wende“ meint man die politischen Veränderungen in der DDR im Herbst 1989. Die Diktatur verlor ihre Macht und der Weg zu freien Wahlen und Demokratie begann.","en":{"q":"Why is the period in the autumn of 1989 in the GDR called \"Die Wende\" (the turning point)? During this period, the GDR changed politically …","a":["from a dictatorship to a democracy.","from a liberal market economy to socialism.","from a monarchy to social democracy.","from a religious state to a communist state."],"x":"The term \"Die Wende\" refers to the political changes in the GDR in the autumn of 1989. The dictatorship lost its power, and the path toward free elections and democracy began."}},{"id":"G197","n":197,"land":false,"cat":"Geschichte","q":"Welches heutige deutsche Bundesland gehörte früher zum Gebiet der DDR?","a":["Thüringen","Hessen","Bayern","Bremen"],"c":0,"x":"Thüringen gehörte zum Gebiet der DDR. Nach der Wiedervereinigung wurde Thüringen wieder ein Bundesland.","en":{"q":"Which present-day German federal state formerly belonged to the territory of the GDR?","a":["Thuringia","Hesse","Bavaria","Bremen"],"x":"Thuringia belonged to the territory of the GDR. After reunification, Thuringia once again became a federal state."}},{"id":"G198","n":198,"land":false,"cat":"Geschichte","q":"Welches heutige deutsche Bundesland gehörte früher zum Gebiet der DDR?","a":["Bayern","Niedersachsen","Sachsen","Baden-Württemberg"],"c":2,"x":"Sachsen gehörte früher zur DDR. Seit der deutschen Einheit 1990 ist Sachsen wieder ein Bundesland.","en":{"q":"Which present-day German federal state formerly belonged to the territory of the GDR?","a":["Bavaria","Lower Saxony","Saxony","Baden-Württemberg"],"x":"Saxony formerly belonged to the GDR. Since German reunification in 1990, Saxony has once again been a federal state."}},{"id":"G199","n":199,"land":false,"cat":"Geschichte","q":"Mit der Abkürzung \"Stasi\" meinte man in der DDR …","a":["das Parlament.","das Ministerium für Staatssicherheit.","eine regierende Partei.","das Ministerium für Volksbildung."],"c":1,"x":"„Stasi“ war die Kurzform für das Ministerium für Staatssicherheit der DDR. Es überwachte viele Menschen und ging gegen politische Gegner vor.","en":{"q":"In the GDR, the abbreviation \"Stasi\" referred to …","a":["the parliament.","the Ministry for State Security.","a governing political party.","the Ministry of National Education."],"x":"\"Stasi\" was the short form for the GDR's Ministry for State Security. It monitored many people and acted against political opponents."}},{"id":"G200","n":200,"land":false,"cat":"Geschichte","q":"Welches heutige deutsche Bundesland gehörte früher zum Gebiet der DDR?","a":["Hessen","Schleswig-Holstein","Mecklenburg-Vorpommern","Saarland"],"c":2,"x":"Mecklenburg-Vorpommern gehörte zum Gebiet der DDR. Seit 1990 ist es wieder ein Bundesland der Bundesrepublik Deutschland.","en":{"q":"Which present-day German federal state formerly belonged to the territory of the GDR?","a":["Hesse","Schleswig-Holstein","Mecklenburg-Western Pomerania","Saarland"],"x":"Mecklenburg-Western Pomerania belonged to the territory of the GDR. Since 1990, it has once again been a federal state of the Federal Republic of Germany."}},{"id":"G201","n":201,"land":false,"cat":"Geschichte","q":"Welche der folgenden Auflistungen enthält nur Bundesländer, die zum Gebiet der früheren DDR gehörten?","a":["Niedersachsen, Nordrhein-Westfalen, Hessen, Schleswig-Holstein, Brandenburg","Mecklenburg-Vorpommern, Brandenburg, Sachsen, Sachsen-Anhalt, Thüringen","Bayern, Baden-Württemberg, Rheinland-Pfalz, Thüringen, Sachsen","Sachsen, Thüringen, Hessen, Niedersachsen, Brandenburg"],"c":1,"x":"Zur früheren DDR gehörten die heutigen Bundesländer Mecklenburg-Vorpommern, Brandenburg, Sachsen, Sachsen-Anhalt und Thüringen. Diese fünf Länder werden oft als die neuen Bundesländer bezeichnet.","en":{"q":"Which of the following lists contains only federal states that belonged to the territory of the former GDR?","a":["Lower Saxony, North Rhine-Westphalia, Hesse, Schleswig-Holstein, Brandenburg","Mecklenburg-Western Pomerania, Brandenburg, Saxony, Saxony-Anhalt, Thuringia","Bavaria, Baden-Württemberg, Rhineland-Palatinate, Thuringia, Saxony","Saxony, Thuringia, Hesse, Lower Saxony, Brandenburg"],"x":"The present-day federal states of Mecklenburg-Western Pomerania, Brandenburg, Saxony, Saxony-Anhalt, and Thuringia belonged to the former GDR. These five states are often referred to as the new federal states."}},{"id":"G202","n":202,"land":false,"cat":"Geschichte","q":"Zu wem gehörte die DDR im \"Kalten Krieg\"?","a":["zu den Westmächten","zum Warschauer Pakt","zur NATO","zu den blockfreien Staaten"],"c":1,"x":"Die DDR gehörte im Kalten Krieg zum Ostblock und war Mitglied des Warschauer Pakts. Dieser Militärbund wurde von der Sowjetunion geführt.","en":{"q":"Which side did the GDR belong to during the \"Cold War\"?","a":["the Western powers","the Warsaw Pact","NATO","the non-aligned states"],"x":"During the Cold War, the GDR belonged to the Eastern Bloc and was a member of the Warsaw Pact. This military alliance was led by the Soviet Union."}},{"id":"G203","n":203,"land":false,"cat":"Geschichte","q":"Wie hieß das Wirtschaftssystem der DDR?","a":["Marktwirtschaft","Planwirtschaft","Angebot und Nachfrage","Kapitalismus"],"c":1,"x":"Die DDR hatte eine Planwirtschaft. Der Staat plante dabei, was und wie viel produziert wurde und bestimmte viele Preise.","en":{"q":"What was the economic system of the GDR called?","a":["market economy","planned economy","supply and demand","capitalism"],"x":"The GDR had a planned economy. The state planned what and how much was produced and set many prices."}},{"id":"G204","n":204,"land":false,"cat":"Geschichte","q":"Wie wurden die Bundesrepublik Deutschland und die DDR zu einem Staat?","a":["Die Bundesrepublik hat die DDR besetzt.","Die heutigen fünf östlichen Bundesländer sind der Bundesrepublik Deutschland beigetreten.","Die westlichen Bundesländer sind der DDR beigetreten.","Die DDR hat die Bundesrepublik Deutschland besetzt."],"c":1,"x":"1990 trat die DDR der Bundesrepublik Deutschland bei. Die fünf heutigen östlichen Bundesländer wurden damit Teil der Bundesrepublik.","en":{"q":"How did the Federal Republic of Germany and the GDR become one state?","a":["The Federal Republic occupied the GDR.","The five present-day eastern federal states joined the Federal Republic of Germany.","The western federal states joined the GDR.","The GDR occupied the Federal Republic of Germany."],"x":"In 1990, the GDR joined the Federal Republic of Germany. The five present-day eastern federal states thereby became part of the Federal Republic."}},{"id":"G205","n":205,"land":false,"cat":"Geschichte","q":"Mit dem Beitritt der DDR zur Bundesrepublik Deutschland gehören die neuen Bundesländer nun auch …","a":["zur Europäischen Union.","zum Warschauer Pakt.","zur OPEC.","zur Europäischen Verteidigungsgemeinschaft."],"c":0,"x":"Mit der deutschen Wiedervereinigung wurden die neuen Bundesländer automatisch Teil der Europäischen Gemeinschaft und damit später der Europäischen Union.","en":{"q":"With the accession of the GDR to the Federal Republic of Germany, the new federal states now also belong …","a":["to the European Union.","to the Warsaw Pact.","to OPEC.","to the European Defence Community."],"x":"With German reunification, the new federal states automatically became part of the European Community and later of the European Union."}},{"id":"G206","n":206,"land":false,"cat":"Geschichte","q":"Woran erinnern die sogenannten \"Stolpersteine\" in Deutschland?","a":["an berühmte deutsche Politikerinnen und Politiker","an die Opfer des Nationalsozialismus","an Verkehrstote","an bekannte jüdische Musiker"],"c":1,"x":"Stolpersteine erinnern an Menschen, die vom Nationalsozialismus verfolgt und ermordet wurden. Sie liegen meist vor den früheren Wohnorten der Opfer.","en":{"q":"What do the so-called \"Stumbling Stones\" in Germany commemorate?","a":["famous German politicians","the victims of National Socialism","road traffic fatalities","well-known Jewish musicians"],"x":"Stumbling Stones commemorate people who were persecuted and murdered by the National Socialist regime. They are usually placed in front of the victims' former homes."}},{"id":"G207","n":207,"land":false,"cat":"Geschichte","q":"In welchem Militärbündnis war die DDR Mitglied?","a":["in der NATO","im Rheinbund","im Warschauer Pakt","im Europabündnis"],"c":2,"x":"Die DDR war Mitglied im Warschauer Pakt. Dieser war das Militärbündnis der sozialistischen Staaten in Osteuropa.","en":{"q":"Which military alliance was the GDR a member of?","a":["NATO","the Confederation of the Rhine","the Warsaw Pact","the European Alliance"],"x":"The GDR was a member of the Warsaw Pact. It was the military alliance of the socialist states in Eastern Europe."}},{"id":"G208","n":208,"land":false,"cat":"Geschichte","q":"Was war die \"Stasi\"?","a":["der Geheimdienst im \"Dritten Reich\"","eine berühmte deutsche Gedenkstätte","der Geheimdienst der DDR","ein deutscher Sportverein während des Zweiten Weltkrieges"],"c":2,"x":"Die Stasi war der Staatssicherheitsdienst der DDR. Sie überwachte viele Menschen und sammelte Informationen über tatsächliche oder vermutete Gegner des Staates.","en":{"q":"What was the \"Stasi\"?","a":["the secret service in the \"Third Reich\"","a famous German memorial site","the secret service of the GDR","a German sports club during the Second World War"],"x":"The Stasi was the State Security Service of the GDR. It monitored many people and collected information about actual or suspected opponents of the state."}},{"id":"G209","n":209,"land":false,"cat":"Geschichte","q":"Welches war das Wappen der Deutschen Demokratischen Republik?","a":["Bild 1","Bild 2","Bild 3","Bild 4"],"c":3,"x":"Das Wappen der DDR zeigte Hammer und Zirkel in einem Ährenkranz. Es stand für Arbeiter, Intellektuelle und Bauern.","en":{"q":"Which was the coat of arms of the German Democratic Republic?","a":["Image 1","Image 2","Image 3","Image 4"],"x":"The coat of arms of the GDR showed a hammer and compass surrounded by a wreath of grain. It represented workers, intellectuals, and farmers."},"img":"data:image/webp;base64,UklGRnSLAABXRUJQVlA4IGiLAAAQbQGdASoAAgACPmEqkUakIiIhJxe7mIAMCWJI3WnLZfNZvMl2UPiG+CH3d6zldfID2gfoX+y9Bn8p/ufXEegB5KcuOt6f7xN+sA5f63fcX7btmZH9d/if8N+2vtj8b9kPkn8B+q/8D83H9LuK7P+mb4F+b/+H/ivyU+g/+t/6X+F90f9Q/yH/S/yv7//QF+q3+//vH+k9s79yPc//iv+j+YHwD/pP+O/9v+f94f/jf+D/Q+5b+//63/0/7P/AfID/Tv8l/4/a4/8v/z9yr/Ff8T/w/9j4Cv5t/hf+37R//V/cX/pfJr/Z/+B+4H/D+Rj ressed the uprising."}},{"id":"G211","n":211,"land":false,"cat":"Geschichte","q":"Welcher Politiker steht für die \"Ostverträge\"?","a":["Helmut Kohl","Willy Brandt","Michail Gorbatschow","Ludwig Erhard"],"c":1,"x":"Willy Brandt steht besonders für die Ostverträge. Seine Regierung wollte die Beziehungen zu den Staaten Osteuropas verbessern und politische Spannungen abbauen.","en":{"q":"Which politician is associated with the \"Eastern Treaties\"?","a":["Helmut Kohl","Willy Brandt","Mikhail Gorbachev","Ludwig Erhard"],"x":"Willy Brandt is particularly associated with the Eastern Treaties. His government wanted to improve relations with the countries of Eastern Europe and reduce political tensions."}},{"id":"G212","n":212,"land":false,"cat":"Staat","q":"Wie heißt Deutschland mit vollem Namen?","a":["Bundesstaat Deutschland","Bundesländer Deutschland","Bundesrepublik Deutschland","Bundesbezirk Deutschland"],"c":2,"x":"Der vollständige Staatsname lautet Bundesrepublik Deutschland. Deutschland ist ein Bundesstaat mit 16 Bundesländern.","en":{"q":"What is Germany's full official name?","a":["Federal State of Germany","Federal States of Germany","Federal Republic of Germany","Federal District of Germany"],"x":"The full official name is the Federal Republic of Germany. Germany is a federal state with 16 federal states."}},{"id":"G213","n":213,"land":false,"cat":"Staat","q":"Wie viele Einwohner hat Deutschland?","a":["70 Millionen","78 Millionen","84 Millionen","90 Millionen"],"c":2,"x":"Deutschland hat ungefähr 84 Millionen Einwohner. Die genaue Zahl verändert sich mit der Zeit, aber für den Test gilt diese Größenordnung.","en":{"q":"How many inhabitants does Germany have?","a":["70 million","78 million","84 million","90 million"],"x":"Germany has approximately 84 million inhabitants. The exact number changes over time, but this approximate figure applies for the test."}},{"id":"G214","n":214,"land":false,"cat":"Staat","q":"Welche Farben hat die deutsche Flagge?","a":["schwarz-rot-gold","rot-weiß-schwarz","schwarz-rot-grün","schwarz-gelb-rot"],"c":0,"x":"Die deutsche Flagge hat die Farben Schwarz, Rot und Gold. Die drei Farben verlaufen in waagerechten Streifen von oben nach unten.","en":{"q":"What colors are on the German flag?","a":["black-red-gold","red-white-black","black-red-green","black-yellow-red"],"x":"The German flag has the colors black, red, and gold. The three colors appear in horizontal stripes from top to bottom."}},{"id":"G215","n":215,"land":false,"cat":"Geschichte","q":"Wer wird als \"Kanzler der Deutschen Einheit\" bezeichnet?","a":["Gerhard Schröder","Helmut Kohl","Konrad Adenauer","Helmut Schmidt"],"c":1,"x":"Helmut Kohl wird oft als Kanzler der Deutschen Einheit bezeichnet. Während seiner Amtszeit wurde Deutschland 1990 wiedervereinigt.","en":{"q":"Who is referred to as the \"Chancellor of German Unity\"?","a":["Gerhard Schröder","Helmut Kohl","Konrad Adenauer","Helmut Schmidt"],"x":"Helmut Kohl is often referred to as the Chancellor of German Unity. Germany was reunified in 1990 during his term in office."}},{"id":"G216","n":216,"land":false,"cat":"Politik","q":"Welches Symbol ist im Plenarsaal des Deutschen Bundestages zu sehen?","a":["der Bundesadler","die Fahne der Stadt Berlin","der Reichsadler","die Reichskrone"],"c":0,"x":"Im Plenarsaal des Deutschen Bundestages ist der Bundesadler zu sehen. Er ist ein wichtiges Staatssymbol der Bundesrepublik Deutschland.","en":{"q":"Which symbol can be seen in the plenary chamber of the German Bundestag?","a":["the Federal Eagle","the flag of the city of Berlin","the Imperial Eagle","the Imperial Crown"],"x":"The Federal Eagle can be seen in the plenary chamber of the German Bundestag. It is an important state symbol of the Federal Republic of Germany."}},{"id":"G217","n":217,"land":false,"cat":"Geschichte","q":"In welchem Zeitraum gab es die Deutsche Demokratische Republik (DDR)?","a":["1919 bis 1927","1933 bis 1945","1945 bis 1961","1949 bis 1990"],"c":3,"x":"Die DDR bestand von 1949 bis 1990. Mit der deutschen Wiedervereinigung am 3. Oktober 1990 hörte sie auf zu existieren.","en":{"q":"During which period did the German Democratic Republic (GDR) exist?","a":["1919 to 1927","1933 to 1945","1945 to 1961","1949 to 1990"],"x":"The GDR existed from 1949 to 1990. It ceased to exist with German reunification on October 3, 1990."}},{"id":"G218","n":218,"land":false,"cat":"Geschichte","q":"Wie viele Bundesländer kamen bei der Wiedervereinigung 1990 zur Bundesrepublik Deutschland hinzu?","a":["4","5","6","7"],"c":1,"x":"Bei der Wiedervereinigung kamen fünf Bundesländer zur Bundesrepublik hinzu: Brandenburg, Mecklenburg-Vorpommern, Sachsen, Sachsen-Anhalt und Thüringen.","en":{"q":"How many federal states were added to the Federal Republic of Germany during reunification in 1990?","a":["4","5","6","7"],"x":"During reunification, five federal states were added to the Federal Republic: Brandenburg, Mecklenburg-Western Pomerania, Saxony, Saxony-Anhalt, and Thuringia."}},{"id":"G219","n":219,"land":false,"cat":"Geschichte","q":"Die Bundesrepublik Deutschland hat die Grenzen von heute seit …","a":["1933","1949","1971","1990"],"c":3,"x":"Seit der Wiedervereinigung 1990 hat Deutschland seine heutigen Grenzen. Damals wurden die DDR und die Bundesrepublik zu einem Staat.","en":{"q":"The Federal Republic of Germany has had its present borders since …","a":["1933","1949","1971","1990"],"x":"Germany has had its present borders since reunification in 1990. At that time, the GDR and the Federal Republic became one state."}},{"id":"G220","n":220,"land":false,"cat":"Geschichte","q":"Der 27. Januar ist in Deutschland ein offizieller Gedenktag. Woran erinnert dieser Tag?","a":["an das Ende des Zweiten Weltkrieges","an die Verabschiedung des Grundgesetzes","an die Wiedervereinigung Deutschlands","an die Opfer des Nationalsozialismus (Tag der Befreiung des Vernichtungslagers Auschwitz)"],"c":3,"x":"Der 27. Januar erinnert an die Opfer des Nationalsozialismus. An diesem Tag wurde 1945 das Konzentrations- und Vernichtungslager Auschwitz befreit.","en":{"q":"January 27 is an official day of remembrance in Germany. What does this day commemorate?","a":["the end of the Second World War","the adoption of the Basic Law","the reunification of Germany","the victims of National Socialism (day of the liberation of the Auschwitz extermination camp)"],"x":"January 27 commemorates the victims of National Socialism. On this day in 1945, the Auschwitz concentration and extermination camp was liberated."}},{"id":"G221","n":221,"land":false,"cat":"Europa und Welt","q":"Deutschland ist Mitglied des Schengener Abkommens. Was bedeutet das?","a":["Deutsche können in viele Länder Europas ohne Passkontrolle reisen.","Alle Menschen können ohne Personenkontrolle in Deutschland einreisen.","Deutsche können ohne Passkontrolle in jedes Land reisen.","Deutsche können in jedem Land mit dem Euro bezahlen."],"c":0,"x":"Das Schengener Abkommen ermöglicht Reisen zwischen vielen europäischen Staaten ohne regelmäßige Passkontrollen an den Binnengrenzen. Deshalb können Deutsche in viele europäische Länder ohne Passkontrolle reisen.","en":{"q":"Germany is a member of the Schengen Agreement. What does that mean?","a":["Germans can travel to many European countries without passport checks.","All people can enter Germany without identity checks.","Germans can travel to every country without passport checks.","Germans can pay with the euro in every country."],"x":"The Schengen Agreement allows travel between many European countries without routine passport checks at internal borders. Therefore, Germans can travel to many European countries without passport checks."}},{"id":"G222","n":222,"land":false,"cat":"Europa und Welt","q":"Welches Land ist ein Nachbarland von Deutschland?","a":["Ungarn","Portugal","Spanien","Schweiz"],"c":3,"x":"Die Schweiz grenzt direkt an Deutschland. Sie liegt südlich von Deutschland.","en":{"q":"Which country shares a border with Germany?","a":["Hungary","Portugal","Spain","Switzerland"],"x":"Switzerland shares a direct border with Germany. It lies south of Germany."}},{"id":"G223","n":223,"land":false,"cat":"Europa und Welt","q":"Welches Land ist ein Nachbarland von Deutschland?","a":["Rumänien","Bulgarien","Polen","Griechenland"],"c":2,"x":"Polen ist ein direktes Nachbarland von Deutschland. Es liegt östlich von Deutschland.","en":{"q":"Which country shares a border with Germany?","a":["Romania","Bulgaria","Poland","Greece"],"x":"Poland is a direct neighboring country of Germany. It lies east of Germany."}},{"id":"G224","n":224,"land":false,"cat":"Europa und Welt","q":"Was bedeutet die Abkürzung EU?","a":["Europäische Unternehmen","Europäische Union","Einheitliche Union","Euro Union"],"c":1,"x":"EU bedeutet Europäische Union. In ihr arbeiten europäische Staaten politisch und wirtschaftlich zusammen.","en":{"q":"What does the abbreviation EU stand for?","a":["European Enterprises","European Union","Unified Union","Euro Union"],"x":"EU stands for European Union. European states cooperate politically and economically within it."}},{"id":"G225","n":225,"land":false,"cat":"Europa und Welt","q":"In welchem anderen Land gibt es eine große deutschsprachige Bevölkerung?","a":["Tschechien","Norwegen","Spanien","Österreich"],"c":3,"x":"In Österreich spricht der größte Teil der Bevölkerung Deutsch. Deshalb gibt es dort eine große deutschsprachige Bevölkerung.","en":{"q":"In which other country is there a large German-speaking population?","a":["Czech Republic","Norway","Spain","Austria"],"x":"Most of the population in Austria speaks German. Therefore, it has a large German-speaking population."}},{"id":"G226","n":226,"land":false,"cat":"Europa und Welt","q":"Welche ist die Flagge der Europäischen Union?","a":["Bild 1","Bild 2","Bild 3","Bild 4"],"c":1,"x":"Die Flagge der Europäischen Union ist blau und zeigt zwölf goldene Sterne im Kreis. Die zwölf Sterne stehen symbolisch für Einheit und Zusammenhalt.","
