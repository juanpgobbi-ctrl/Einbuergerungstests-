<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#24594f"><meta name="mobile-web-app-capable" content="yes"><meta name="application-name" content="Einbürgerung">
<title>Einbürgerungstest Trainer</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: calm single reading column; compact progress ring + one-line status above, one roomy question sheet below. Pine ink on cool sage paper, soft coral only for errors. */
:root{
  --bg:#e9eeeb; --bg-2:#dfe6e2; --surface:#fbfcfb; --surface-2:#eef3f0; --fg:#18231f; --muted:#5d6b65; --line:#d3ddd8;
  --accent:#24594f; --accent-soft:#d9e8e3; --accent-fg:#ffffff;
  --ok:#2c7a54; --ok-bg:#e1f1e8; --bad:#b4483c; --bad-bg:#f8e5e1; --warn:#8b6418; --warn-bg:#f6ecd5;
  --shadow:0 1px 2px rgba(24,35,31,.05),0 8px 28px rgba(24,35,31,.07);
  --ui:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --read:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --bg-2:#0c1210; --surface:#18211e; --surface-2:#1f2a26; --fg:#e4ece8; --muted:#97a69f; --line:#2b3833;
  --accent:#86c4b3; --accent-soft:#213a33; --accent-fg:#0d1513;
  --ok:#6fcf9b; --ok-bg:#183126; --bad:#f09486; --bad-bg:#3a201c; --warn:#e3bc68; --warn-bg:#342a14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --bg-2:#0c1210; --surface:#18211e; --surface-2:#1f2a26; --fg:#e4ece8; --muted:#97a69f; --line:#2b3833;
  --accent:#86c4b3; --accent-soft:#213a33; --accent-fg:#0d1513;
  --ok:#6fcf9b; --ok-bg:#183126; --bad:#f09486; --bad-bg:#3a201c; --warn:#e3bc68; --warn-bg:#342a14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}
img{max-width:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--ui);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:grid;gap:18px}

/* top */
.top{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:68px;height:68px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--line);stroke-width:7}
.ring .val{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 15px var(--ui)}
.ttl{min-width:0;display:grid;gap:4px}
h1{font:600 19px/1.2 var(--read);margin:0;letter-spacing:-.005em}
.line{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.line b{color:var(--fg);font-weight:600}
.sync{font-size:12.5px;color:var(--bad);background:var(--bad-bg);padding:8px 10px;border-radius:8px;display:block}

.tabs{display:flex;gap:4px;background:var(--bg-2);padding:4px;border-radius:12px;flex-wrap:wrap}
.tab{flex:1 1 auto;font:600 13.5px var(--ui);padding:9px 12px;border-radius:9px;border:0;background:transparent;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.tab:hover{color:var(--fg)}
.tab[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tab .cnt{font-weight:500;margin-left:5px;font-size:12px;opacity:.7}

/* question sheet */
.card{background:var(--surface);border-radius:18px;padding:26px 26px 22px;display:grid;gap:20px;box-shadow:var(--shadow)}
.card.enter{animation:enter .28s ease both}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.chip{font:600 11.5px var(--ui);padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--fg);letter-spacing:.02em}
.chip.land{background:var(--accent-soft);color:var(--accent)}
.dots{display:inline-flex;gap:3px;align-items:center;margin-left:auto}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--warn-bg);box-shadow:inset 0 0 0 1.5px var(--warn)}
.dots span{font-size:12px;color:var(--warn);font-weight:600;margin-left:4px}
.qtext{font:600 22px/1.42 var(--read);margin:0;text-wrap:pretty;letter-spacing:-.005em}
.qen{font:400 14.5px/1.5 var(--read);font-style:italic;color:var(--muted);margin:-10px 0 0}
.fig{background:#fff;border-radius:12px;padding:12px;display:grid;justify-items:center;gap:4px;border:1px solid var(--line)}
.fig img{max-height:380px;width:auto;object-fit:contain}
.fig small{color:#5d6b65;font-size:11px}
.answers{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.ans{width:100%;text-align:left;display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;font:500 16px/1.45 var(--ui);color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;transition:border-color .12s,background .12s,transform .08s}
.ans:hover:not(:disabled){border-color:var(--accent);background:var(--surface-2)}
.ans:active:not(:disabled){transform:scale(.995)}
.ans:focus-visible,.tab:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ans .k{font:600 12.5px var(--ui);width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.ans .en{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:2px}
.ans.right{border-color:var(--ok);background:var(--ok-bg)}
.ans.right .k{background:var(--ok);color:var(--surface)}
.ans.wrong{border-color:var(--bad);background:var(--bad-bg)}
.ans.wrong .k{background:var(--bad);color:var(--surface)}
.ans.dim{opacity:.55}
.ans:disabled{cursor:default}
.feedback{border-radius:12px;padding:14px 16px;display:grid;gap:6px;font-size:14.5px;animation:enter .2s ease both}
.feedback.ok{background:var(--ok-bg)} .feedback.bad{background:var(--bad-bg)}
.feedback strong{font-size:15px;color:var(--ok)} .feedback.bad strong{color:var(--bad)}
.feedback .ex{font:400 15px/1.55 var(--read)}
.feedback .src{font-size:11px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.btn{font:600 14.5px var(--ui);padding:11px 20px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.hint{font-size:12px;color:var(--muted)}
.opts{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding-inline:4px}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.opts input{accent-color:var(--accent)}
details{background:var(--surface);border-radius:14px;padding:14px 18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
summary{cursor:pointer;font-weight:600;font-size:14px}
details p{color:var(--muted);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
td.num{white-space:nowrap;text-align:right}
.tblwrap{overflow-x:auto;margin-top:10px}
.empty{text-align:center;padding:30px 12px;display:grid;gap:12px;justify-items:center}
.result{font:600 38px var(--read);margin:0}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font:600 13px var(--ui);padding:9px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
@media (max-width:540px){
  .card{padding:20px 18px 18px;border-radius:16px}
  .qtext{font-size:19.5px}
  .ans{font-size:15.5px;padding:12px}
  #next{width:100%}
  .row .hint.kbd{display:none}
}
@media (prefers-reduced-motion:reduce){.card.enter,.feedback{animation:none}.ring .val,.ans,.tab{transition:none}}
</style>

</head><body>

<script type="application/json" id="qdata">[{"id":"G1","n":1,"land":false,"cat":"Recht","q":"In Deutschland dürfen Menschen offen etwas gegen die Regierung sagen, weil …","a":["hier Religionsfreiheit gilt.","die Menschen Steuern zahlen.","die Menschen das Wahlrecht haben.","hier Meinungsfreiheit gilt."],"c":3,"x":"In Deutschland gilt die Meinungsfreiheit. Deshalb darf man die Regierung kritisieren und seine Meinung offen sagen, solange man dabei die geltenden Gesetze beachtet.","en":{"q":"In Germany, people are allowed to openly say something against the government because …","a":["there is freedom of religion here.","people pay taxes.","people have the right to vote.","there is freedom of expression here."],"x":"Freedom of expression applies in Germany. Therefore, people are allowed to criticize the government and openly express their opinions, as long as they comply with the applicable laws."}},{"id":"G2","n":2,"land":false,"cat":"Gesellschaft und Familie","q":"In Deutschland können Eltern bis zum 14. Lebensjahr ihres Kindes entscheiden, ob es in der Schule am …","a":["Geschichtsunterricht teilnimmt.","Religionsunterricht teilnimmt.","Politikunterricht teilnimmt.","Sprachunterricht teilnimmt."],"c":1,"x":"Bis zum 14. Lebensjahr können Eltern entscheiden, ob ihr Kind am Religionsunterricht teilnimmt. Danach kann das Kind diese Entscheidung selbst treffen.","en":{"q":"In Germany, until their child reaches the age of 14, parents can decide whether the child participates in … at school.","a":["history lessons","religious education","politics lessons","language lessons"],"x":"Until the age of 14, parents can decide whether their child participates in religious education. After that, the child can make this decision independently."}},{"id":"G3","n":3,"land":false,"cat":"Staat","q":"Deutschland ist ein Rechtsstaat. Was ist damit gemeint?","a":["Alle Einwohnerinnen / Einwohner und der Staat müssen sich an die Gesetze halten.","Der Staat muss sich nicht an die Gesetze halten.","Nur Deutsche müssen die Gesetze befolgen.","Die Gerichte machen die Gesetze."],"c":0,"x":"Ein Rechtsstaat bedeutet, dass sich sowohl die Menschen als auch der Staat an die Gesetze halten müssen. Auch staatliche Behörden dürfen nicht einfach gegen das Gesetz handeln.","en":{"q":"Germany is a state governed by the rule of law. What does that mean?","a":["All residents and the state must obey the laws.","The state does not have to obey the laws.","Only Germans must obey the laws.","The courts make the laws."],"x":"A state governed by the rule of law means that both the people and the state must obey the laws. Government authorities are also not allowed to simply act against the law."}},{"id":"G4","n":4,"land":false,"cat":"Recht","q":"Welches Recht gehört zu den Grundrechten in Deutschland?","a":["Waffenbesitz","Faustrecht","Meinungsfreiheit","Selbstjustiz"],"c":2,"x":"Die Meinungsfreiheit ist ein Grundrecht in Deutschland. Sie schützt das Recht, die eigene Meinung frei zu äußern und zu verbreiten.","en":{"q":"Which right is one of the fundamental rights in Germany?","a":["ownership of weapons","the law of the fist","freedom of expression","vigilante justice"],"x":"Freedom of expression is a fundamental right in Germany. It protects the right to freely express and disseminate one's own opinion."}},{"id":"G5","n":5,"land":false,"cat":"Politik","q":"Wahlen in Deutschland sind frei. Was bedeutet das?","a":["Man darf Geld annehmen, wenn man dafür eine bestimmte Kandidatin / einen bestimmten Kandidaten wählt.","Nur Personen, die noch nie im Gefängnis waren, dürfen wählen.","Die Wählerin / der Wähler darf bei der Wahl weder beeinflusst noch zu einer bestimmten Stimmabgabe gezwungen werden und keine Nachteile durch die Wahl haben.","Alle wahlberechtigten Personen müssen wählen."],"c":2,"x":"Freie Wahlen bedeuten, dass niemand zu einer bestimmten Wahlentscheidung gezwungen werden darf. Wählerinnen und Wähler sollen ohne Druck und ohne Nachteile selbst entscheiden.","en":{"q":"Elections in Germany are free. What does that mean?","a":["You may accept money if you vote for a particular candidate in return.","Only people who have never been in prison are allowed to vote.","Voters must neither be influenced nor forced to cast a particular vote, and they must not suffer any disadvantages because of their vote.","All eligible voters are required to vote."],"x":"Free elections mean that no one may be forced to make a particular electoral choice. Voters should be able to decide for themselves without pressure and without disadvantages."}},{"id":"G6","n":6,"land":false,"cat":"Staat","q":"Wie heißt die deutsche Verfassung?","a":["Volksgesetz","Bundesgesetz","Deutsches Gesetz","Grundgesetz"],"c":3,"x":"Die Verfassung Deutschlands heißt Grundgesetz. Darin stehen wichtige Regeln für den Staat und die Grundrechte der Menschen.","en":{"q":"What is the German constitution called?","a":["People's Law","Federal Law","German Law","Basic Law"],"x":"Germany's constitution is called the Basic Law. It contains important rules for the state and the fundamental rights of the people."}},{"id":"G7","n":7,"land":false,"cat":"Recht","q":"Welches Recht gehört zu den Grundrechten, die nach der deutschen Verfassung garantiert werden? Das Recht auf …","a":["Glaubens- und Gewissensfreiheit","Unterhaltung","Bildung und Arbeit","Wohnung"],"c":0,"x":"Die Glaubens- und Gewissensfreiheit ist ein Grundrecht. Jeder Mensch darf seinen Glauben selbst wählen und nach seinem Gewissen handeln, soweit die Gesetze beachtet werden.","en":{"q":"Which right is one of the fundamental rights guaranteed by the German constitution? The right to …","a":["freedom of faith and conscience","entertainment","education and work","housing"],"x":"Freedom of faith and conscience is a fundamental right. Everyone may choose their own faith and act according to their conscience, as long as the laws are observed."}},{"id":"G8","n":8,"land":false,"cat":"Recht","q":"Was steht nicht im Grundgesetz von Deutschland?","a":["Die Würde des Menschen ist unantastbar.","Alle sollen gleich viel Geld haben.","Jeder Mensch darf seine Meinung sagen.","Alle sind vor dem Gesetz gleich."],"c":1,"x":"Im Grundgesetz steht nicht, dass alle Menschen gleich viel Geld haben sollen. Das Grundgesetz schützt aber zum Beispiel die Menschenwürde, die Meinungsfreiheit und die Gleichheit vor dem Gesetz.","en":{"q":"What is not stated in Germany's Basic Law?","a":["Human dignity is inviolable.","Everyone should have the same amount of money.","Everyone may express their opinion.","Everyone is equal before the law."],"x":"The Basic Law does not state that everyone should have the same amount of money. However, the Basic Law protects, for example, human dignity, freedom of expression, and equality before the law."}},{"id":"G9","n":9,"land":false,"cat":"Recht","q":"Welches Grundrecht gilt in Deutschland nur für Ausländerinnen / Ausländer? Das Grundrecht auf …","a":["Schutz der Familie","Menschenwürde","Asyl","Meinungsfreiheit"],"c":2,"x":"Das Asylrecht schützt Menschen, die Schutz vor politischer Verfolgung suchen. Dieses Grundrecht betrifft Ausländerinnen und Ausländer, die in Deutschland Schutz beantragen.","en":{"q":"Which fundamental right in Germany applies only to foreign nationals? The fundamental right to …","a":["protection of the family","human dignity","asylum","freedom of expression"],"x":"The right of asylum protects people seeking protection from political persecution. This fundamental right concerns foreign nationals who apply for protection in Germany."}},{"id":"G10","n":10,"land":false,"cat":"Recht","q":"Was ist mit dem deutschen Grundgesetz vereinbar?","a":["die Prügelstrafe","die Folter","die Todesstrafe","die Geldstrafe"],"c":3,"x":"Eine Geldstrafe ist mit dem Grundgesetz vereinbar. Folter und Todesstrafe sind dagegen nicht mit der deutschen Rechtsordnung vereinbar.","en":{"q":"What is compatible with the German Basic Law?","a":["corporal punishment","torture","the death penalty","a fine"],"x":"A fine is compatible with the Basic Law. Torture and the death penalty, by contrast, are not compatible with the German legal system."}},{"id":"G11","n":11,"land":false,"cat":"Staat","q":"Wie wird die Verfassung der Bundesrepublik Deutschland genannt?","a":["Grundgesetz","Bundesverfassung","Gesetzbuch","Verfassungsvertrag"],"c":0,"x":"Die Verfassung der Bundesrepublik Deutschland heißt Grundgesetz. Es ist die wichtigste rechtliche Grundlage des deutschen Staates.","en":{"q":"What is the constitution of the Federal Republic of Germany called?","a":["Basic Law","Federal Constitution","Code of Laws","Constitutional Treaty"],"x":"The constitution of the Federal Republic of Germany is called the Basic Law. It is the most important legal foundation of the German state."}},{"id":"G12","n":12,"land":false,"cat":"Recht","q":"Eine Partei im Deutschen Bundestag will die Pressefreiheit abschaffen. Ist das möglich?","a":["Ja, wenn mehr als die Hälfte der Abgeordneten im Bundestag dafür sind.","Ja, aber dazu müssen zwei Drittel der Abgeordneten im Bundestag dafür sein.","Nein, denn die Pressefreiheit ist ein Grundrecht. Sie kann nicht abgeschafft werden.","Nein, denn nur der Bundesrat kann die Pressefreiheit abschaffen."],"c":2,"x":"Die Pressefreiheit ist ein Grundrecht und schützt freie Berichterstattung. Eine Partei kann sie deshalb nicht einfach durch eine parlamentarische Mehrheit abschaffen.","en":{"q":"A party in the German Bundestag wants to abolish freedom of the press. Is that possible?","a":["Yes, if more than half of the members of the Bundestag are in favor.","Yes, but two thirds of the members of the Bundestag must be in favor.","No, because freedom of the press is a fundamental right. It cannot be abolished.","No, because only the Bundesrat can abolish freedom of the press."],"x":"Freedom of the press is a fundamental right and protects independent reporting. A party therefore cannot simply abolish it through a parliamentary majority."}},{"id":"G13","n":13,"land":false,"cat":"Politik","q":"Im Parlament steht der Begriff 'Opposition' für …","a":["die regierenden Parteien.","die Fraktion mit den meisten Abgeordneten.","alle Parteien, die bei der letzten Wahl die 5%-Hürde erreichen konnten.","alle Abgeordneten, die nicht zu der Regierungspartei / den Regierungsparteien gehören."],"c":3,"x":"Zur Opposition gehören die Abgeordneten und Parteien im Parlament, die nicht die Regierung tragen. Sie kontrollieren die Regierung und vertreten andere politische Positionen.","en":{"q":"In parliament, the term 'opposition' refers to …","a":["the governing parties.","the parliamentary group with the most members.","all parties that were able to reach the 5% threshold in the last election.","all members of parliament who do not belong to the governing party or governing parties."],"x":"The opposition consists of the members of parliament and parties that do not support the government. They scrutinize the government and represent different political positions."}},{"id":"G14","n":14,"land":false,"cat":"Recht","q":"Meinungsfreiheit in Deutschland heißt, dass ich …","a":["Passanten auf der Straße beschimpfen darf.","meine Meinung im Internet äußern kann.","Nazi-, Hamas- oder Islamischer Staat-Symbole öffentlich tragen darf.","meine Meinung nur dann äußern darf, solange ich der Regierung nicht widerspreche."],"c":1,"x":"Meinungsfreiheit bedeutet, dass man seine Meinung auch im Internet äußern darf. Sie hat aber gesetzliche Grenzen, zum Beispiel beim Schutz der persönlichen Ehre.","en":{"q":"Freedom of expression in Germany means that I …","a":["may insult passers-by on the street.","can express my opinion on the internet.","may publicly wear Nazi, Hamas, or Islamic State symbols.","may express my opinion only as long as I do not contradict the government."],"x":"Freedom of expression means that people may also express their opinions on the internet. However, it has legal limits, for example to protect personal honor."}},{"id":"G15","n":15,"land":false,"cat":"Recht","q":"Was verbietet das deutsche Grundgesetz?","a":["Militärdienst","Zwangsarbeit","freie Berufswahl","Arbeit im Ausland"],"c":1,"x":"Das Grundgesetz verbietet Zwangsarbeit grundsätzlich. Niemand soll gegen seinen Willen zu einer bestimmten Arbeit gezwungen werden.","en":{"q":"What does the German Basic Law prohibit?","a":["military service","forced labor","freedom to choose an occupation","working abroad"],"x":"The Basic Law generally prohibits forced labor. No one should be forced against their will to perform a particular kind of work."}},{"id":"G16","n":16,"land":false,"cat":"Recht","q":"Wann ist die Meinungsfreiheit in Deutschland eingeschränkt?","a":["bei der öffentlichen Verbreitung falscher Behauptungen über einzelne Personen","bei Meinungsäußerungen über die Bundesregierung","bei Diskussionen über Religionen","bei Kritik am Staat"],"c":0,"x":"Meinungsfreiheit hat Grenzen, wenn Rechte anderer Menschen verletzt werden. Falsche Behauptungen über einzelne Personen können zum Beispiel deren persönliche Ehre verletzen.","en":{"q":"When is freedom of expression restricted in Germany?","a":["when false claims about individuals are publicly spread","when opinions are expressed about the federal government","during discussions about religions","when criticizing the state"],"x":"Freedom of expression has limits when the rights of other people are violated. False claims about individuals can, for example, harm their personal honor."}},{"id":"G17","n":17,"land":false,"cat":"Recht","q":"Die deutschen Gesetze verbieten …","a":["Meinungsfreiheit der Einwohnerinnen und Einwohner.","Petitionen der Bürgerinnen und Bürger.","Versammlungsfreiheit der Einwohnerinnen und Einwohner.","Ungleichbehandlung der Bürgerinnen und Bürger durch den Staat."],"c":3,"x":"Der Staat darf Bürgerinnen und Bürger nicht willkürlich ungleich behandeln. Der Grundsatz der Gleichheit vor dem Gesetz schützt vor ungerechtfertigter staatlicher Ungleichbehandlung.","en":{"q":"German laws prohibit …","a":["freedom of expression for residents.","petitions by citizens.","freedom of assembly for residents.","unequal treatment of citizens by the state."],"x":"The state may not arbitrarily treat citizens unequally. The principle of equality before the law protects people from unjustified unequal treatment by the state."}},{"id":"G18","n":18,"land":false,"cat":"Recht","q":"Welches Grundrecht ist in Artikel 1 des Grundgesetzes der Bundesrepublik Deutschland garantiert?","a":["die Unantastbarkeit der Menschenwürde","das Recht auf Leben","Religionsfreiheit","Meinungsfreiheit"],"c":0,"x":"Artikel 1 des Grundgesetzes schützt die Menschenwürde. Der Staat muss die Würde jedes Menschen achten und schützen.","en":{"q":"Which fundamental right is guaranteed in Article 1 of the Basic Law of the Federal Republic of Germany?","a":["the inviolability of human dignity","the right to life","freedom of religion","freedom of expression"],"x":"Article 1 of the Basic Law protects human dignity. The state must respect and protect the dignity of every person."}},{"id":"G19","n":19,"land":false,"cat":"Recht","q":"Was versteht man unter dem Recht der 'Freizügigkeit' in Deutschland?","a":["Man darf sich seinen Wohnort selbst aussuchen.","Man kann seinen Beruf wechseln.","Man darf sich für eine andere Religion entscheiden.","Man darf sich in der Öffentlichkeit nur leicht bekleidet bewegen."],"c":0,"x":"Freizügigkeit bedeutet, dass man seinen Wohnort innerhalb Deutschlands grundsätzlich selbst wählen kann. Der Begriff hat hier nichts mit Kleidung, Religion oder einem Berufswechsel zu tun.","en":{"q":"What is meant by the right to 'freedom of movement' in Germany?","a":["You may choose your own place of residence.","You can change your occupation.","You may choose a different religion.","You may appear in public wearing only light clothing."],"x":"Freedom of movement means that, in principle, you may choose your own place of residence within Germany. In this context, the term has nothing to do with clothing, religion, or changing occupations."}},{"id":"G20","n":20,"land":false,"cat":"Politik","q":"Eine Partei in Deutschland verfolgt das Ziel, eine Diktatur zu errichten. Sie ist dann …","a":["tolerant.","rechtsstaatlich orientiert.","gesetzestreu.","verfassungswidrig."],"c":3,"x":"Eine Partei, die eine Diktatur errichten und die demokratische Ordnung beseitigen will, handelt gegen die Verfassung. Deshalb gilt ein solches Ziel als verfassungswidrig.","en":{"q":"A political party in Germany aims to establish a dictatorship. It is therefore …","a":["tolerant.","oriented toward the rule of law.","law-abiding.","unconstitutional."],"x":"A party that seeks to establish a dictatorship and abolish the democratic order acts against the constitution. Such an aim is therefore considered unconstitutional."}},{"id":"G21","n":21,"land":false,"cat":"Staat","q":"Welches ist das Wappen der Bundesrepublik Deutschland?","a":["Bild 1","Bild 2","Bild 3","Bild 4"],"c":0,"x":"Das richtige Bild ist Bild 1. Das Wappen der Bundesrepublik Deutschland zeigt den Bundesadler.","en":{"q":"Which is the coat of arms of the Federal Republic of Germany?","a":["Image 1","Image 2","Image 3","Image 4"],"x":"The correct image is Image 1. The coat of arms of the Federal Republic of Germany shows the Federal Eagle."},"img":"data:image/webp;base64,UklGRnSLAABXRUJQVlA4IGiLAAAQbQGdASoAAgACPmEqkUakIiIhJxe7mIAMCWJI3WnLZfNZvMl2UPiG+CH3d6zldfID2gfoX+y9Bn8p/ufXEegB5KcuOt6f7xN+sA5f63fcX7btmZH9d/if8N+2vtj8b9kPkn8B+q/8D83H9LuK7P+mb4F+b/+H/ivyU+g/+t/6X+F90f9Q/yH/S/yv7//QF+q3+//vH+k9s79yPc//iv+j+YHwD/pP+O/9v+f94f/jf+D/Q+5b+//63/0/7P/AfID/Tv8l/4/a4/8v/z9yr/Ff8T/w/9j4Cv5t/hf+37R//V/cX/pfJr/Z/+B+4H/D+Rj+m/53/8/7L/lfAB/7PUA/6///9gD1N/Rf6p/iu1f/D/4H/Hf8v+1enP478+/df7n/lv9t/ePmg/Zsi/Xv/q+hH8m+3P6H+5/vT8Z/4v/W/bX6J/Gf/H/yPsC/lP83/zH9h/JH5H/j/9R2vGp/7L/o/632BfYD57/pf7//l//l/iPf99u/0f91/y3sJ9Zv9V9yv2Afy3+jf6D+9/vL/iP//9df5v/Qf5nydvrH+x/4P+e/Ln7Af4//Pv85/cv8d/2/8J////H+Nn8v/y/8R/of/J/rP/B70/ oyed people are …","a":["employed in small family businesses.","working voluntarily for a federal state.","self-employed with their own company.","employed by a company or public authority."],"x":"Most employed people in Germany work as employees for a company or public authority. Self-employed people make up only part of the workforce by comparison."}},{"id":"G24","n":24,"land":false,"cat":"Bund und Länder","q":"Wie viele Bundesländer hat die Bundesrepublik Deutschland?","a":["14","15","16","17"],"c":2,"x":"Deutschland besteht aus 16 Bundesländern. Dazu gehören zum Beispiel Bayern, Brandenburg, Nordrhein-Westfalen und Sachsen.","en":{"q":"How many federal states does the Federal Republic of Germany have?","a":["14","15","16","17"],"x":"Germany consists of 16 federal states. These include, for example, Bavaria, Brandenburg, North Rhine-Westphalia, and Saxony."}},{"id":"G25","n":25,"land":false,"cat":"Bund und Länder","q":"Was ist kein Bundesland der Bundesrepublik Deutschland?","a":["Elsass-Lothringen","Nordrhein-Westfalen","Mecklenburg-Vorpommern","Sachsen-Anhalt"],"c":0,"x":"Elsass-Lothringen ist kein deutsches Bundesland. Nordrhein-Westfalen, Mecklenburg-Vorpommern und Sachsen-Anhalt gehören dagegen zu den 16 Bundesländern.","en":{"q":"Which is not a federal state of the Federal Republic of Germany?","a":["Alsace-Lorraine","North Rhine-Westphalia","Mecklenburg-Western Pomerania","Saxony-Anhalt"],"x":"Alsace-Lorraine is not a German federal state. North Rhine-Westphalia, Mecklenburg-Western Pomerania, and Saxony-Anhalt, by contrast, are among the 16 federal states."}},{"id":"G26","n":26,"land":false,"cat":"Staat","q":"Deutschland ist …","a":["eine kommunistische Republik.","ein demokratischer und sozialer Bundesstaat.","eine kapitalistische und soziale Monarchie.","ein sozialer und sozialistischer Bundesstaat."],"c":1,"x":"Deutschland ist ein demokratischer und sozialer Bundesstaat. Demokratie, Sozialstaat und Bundesstaat gehören zu den grundlegenden Prinzipien der staatlichen Ordnung.","en":{"q":"Germany is …","a":["a communist republic.","a democratic and social federal state.","a capitalist and social monarchy.","a social and socialist federal state."],"x":"Germany is a democratic and social federal state. Democracy, the welfare-state principle, and federalism are among the fundamental principles of the state order."}},{"id":"G27","n":27,"land":false,"cat":"Staat","q":"Deutschland ist …","a":["ein sozialistischer Staat.","ein Bundesstaat.","eine Diktatur.","eine Monarchie."],"c":1,"x":"Deutschland ist ein Bundesstaat. Das bedeutet, dass der Bund und die 16 Bundesländer eigene staatliche Aufgaben und Zuständigkeiten haben.","en":{"q":"Germany is …","a":["a socialist state.","a federal state.","a dictatorship.","a monarchy."],"x":"Germany is a federal state. This means that the federation and the 16 federal states have their own governmental tasks and responsibilities."}},{"id":"G28","n":28,"land":false,"cat":"Politik","q":"Wer wählt in Deutschland die Abgeordneten zum Bundestag?","a":["das Militär","die Wirtschaft","das wahlberechtigte Volk","die Verwaltung"],"c":2,"x":"Die Abgeordneten des Deutschen Bundestages werden vom wahlberechtigten Volk gewählt. Die Bürgerinnen und Bürger bestimmen also durch Wahlen, wer sie im Bundestag vertritt.","en":{"q":"Who elects the members of the Bundestag in Germany?","a":["the military","the business sector","the electorate","the administration"],"x":"The members of the German Bundestag are elected by eligible voters. Through elections, citizens decide who represents them in the Bundestag."}},{"id":"G29","n":29,"land":false,"cat":"Staat","q":"Welches Tier ist das Wappentier der Bundesrepublik Deutschland?","a":["Löwe","Adler","Bär","Pferd"],"c":1,"x":"Der Adler ist das Wappentier der Bundesrepublik Deutschland. Er wird deshalb auch Bundesadler genannt.","en":{"q":"Which animal is the heraldic animal of the Federal Republic of Germany?","a":["lion","eagle","bear","horse"],"x":"The eagle is the heraldic animal of the Federal Republic of Germany. It is therefore also called the Federal Eagle."}},{"id":"G30","n":30,"land":false,"cat":"Politik","q":"Was ist kein Merkmal unserer Demokratie?","a":["regelmäßige Wahlen","Pressezensur","Meinungsfreiheit","verschiedene Parteien"],"c":1,"x":"Pressezensur ist kein Merkmal einer Demokratie. Zu einer Demokratie gehören dagegen freie Meinungsäußerung, verschiedene Parteien und regelmäßige Wahlen.","en":{"q":"What is not a feature of our democracy?","a":["regular elections","press censorship","freedom of expression","different political parties"],"x":"Press censorship is not a feature of a democracy. Freedom of expression, different political parties, and regular elections are, by contrast, features of a democracy."}},{"id":"G31","n":31,"land":false,"cat":"Politik","q":"Die Zusammenarbeit von Parteien zur Bildung einer Regierung nennt man in Deutschland …","a":["Einheit.","Koalition.","Ministerium.","Fraktion."],"c":1,"x":"Wenn mehrere Parteien zusammen eine Regierung bilden oder tragen, nennt man diese Zusammenarbeit Koalition. Die beteiligten Parteien einigen sich dabei auf gemeinsame politische Ziele.","en":{"q":"The cooperation of political parties to form a government is called a … in Germany.","a":["unity.","coalition.","ministry.","parliamentary group."],"x":"When several parties jointly form or support a government, this cooperation is called a coalition. The participating parties agree on common political goals."}},{"id":"G32","n":32,"land":false,"cat":"Staat","q":"Was ist keine staatliche Gewalt in Deutschland?","a":["Gesetzgebung","Regierung","Presse","Rechtsprechung"],"c":2,"x":"Die Presse ist keine staatliche Gewalt. Zu den staatlichen Gewalten gehören Gesetzgebung, ausführende Gewalt und Rechtsprechung.","en":{"q":"Which is not a branch of state power in Germany?","a":["legislature","government","press","judiciary"],"x":"The press is not a branch of state power. The branches of state power are the legislature, the executive, and the judiciary."}},{"id":"G33","n":33,"land":false,"cat":"Religion und Kultur","q":"Welche Aussage ist richtig? In Deutschland …","a":["sind Staat und Religionsgemeinschaften voneinander getrennt.","bilden die Religionsgemeinschaften den Staat.","ist der Staat abhängig von den Religionsgemeinschaften.","bilden Staat und Religionsgemeinschaften eine Einheit."],"c":0,"x":"Staat und Religionsgemeinschaften sind in Deutschland nicht identisch. Der Staat ist religiös neutral und schützt zugleich die Freiheit des Glaubens.","en":{"q":"Which statement is correct? In Germany …","a":["the state and religious communities are separate from one another.","religious communities form the state.","the state is dependent on religious communities.","the state and religious communities form a single unit."],"x":"The state and religious communities are not identical in Germany. The state is religiously neutral while also protecting freedom of religion."}},{"id":"G34","n":34,"land":false,"cat":"Staat","q":"Was ist Deutschland nicht?","a":["eine Demokratie","ein Rechtsstaat","eine Monarchie","ein Sozialstaat"],"c":2,"x":"Deutschland ist keine Monarchie. Es ist eine demokratische Republik, ein Rechtsstaat und ein Sozialstaat.","en":{"q":"What is Germany not?","a":["a democracy","a state governed by the rule of law","a monarchy","a welfare state"],"x":"Germany is not a monarchy. It is a democratic republic, a state governed by the rule of law, and a welfare state."}},{"id":"G35","n":35,"land":false,"cat":"Wirtschaft","q":"Womit finanziert der deutsche Staat die Sozialversicherung?","a":["Kirchensteuer","Sozialabgaben","Spendengeldern","Vereinsbeiträgen"],"c":1,"x":"Die Sozialversicherung wird durch Sozialabgaben finanziert. Diese Beiträge dienen der Finanzierung der sozialen Sicherungssysteme und sind keine Kirchensteuer oder Spenden.","en":{"q":"How does the German state finance social insurance?","a":["church tax","social security contributions","donations","membership fees"],"x":"Social insurance is financed through social security contributions. These contributions fund the social security systems and are neither church taxes nor donations."}},{"id":"G36","n":36,"land":false,"cat":"Wirtschaft","q":"Welche Maßnahme schafft in Deutschland soziale Sicherheit?","a":["die Krankenversicherung","die Autoversicherung","die Gebäudeversicherung","die Haftpflichtversicherung"],"c":0,"x":"Die Krankenversicherung gehört zur sozialen Absicherung. Sie hilft dabei, die finanziellen Folgen von Krankheit und medizinischer Behandlung abzusichern.","en":{"q":"Which measure provides social security in Germany?","a":["health insurance","car insurance","building insurance","liability insurance"],"x":"Health insurance is part of social protection. It helps cover the financial consequences of illness and medical treatment."}},{"id":"G37","n":37,"land":false,"cat":"Bund und Länder","q":"Wie werden die Regierungschefinnen / Regierungschefs der meisten Bundesländer in Deutschland genannt?","a":["Erste Ministerin / Erster Minister","Premierministerin / Premierminister","Senatorin / Senator","Ministerpräsidentin / Ministerpräsident"],"c":3,"x":"Die Regierungschefin oder der Regierungschef heißt in den meisten Bundesländern Ministerpräsidentin oder Ministerpräsident. In einigen Stadtstaaten werden andere Amtsbezeichnungen verwendet.","en":{"q":"What are the heads of government of most federal states in Germany called?","a":["First Minister","Prime Minister","Senator","Minister-President"],"x":"In most federal states, the head of government is called the Minister-President. In some city-states, different official titles are used."}},{"id":"G38","n":38,"land":false,"cat":"Staat","q":"Die Bundesrepublik Deutschland ist ein demokratischer und sozialer …","a":["Staatenverbund.","Bundesstaat.","Staatenbund.","Zentralstaat."],"c":1,"x":"Die Bundesrepublik Deutschland ist ein demokratischer und sozialer Bundesstaat. Die Bundesländer besitzen eigene Aufgaben und wirken zugleich im gemeinsamen Bundesstaat mit.","en":{"q":"The Federal Republic of Germany is a democratic and social …","a":["union of states.","federal state.","confederation.","centralized state."],"x":"The Federal Republic of Germany is a democratic and social federal state. The federal states have their own responsibilities while also participating in the common federal state."}},{"id":"G39","n":39,"land":false,"cat":"Bund und Länder","q":"Was hat jedes deutsche Bundesland?","a":["eine eigene Außenministerin / einen eigenen Außenminister","eine eigene Währung","eine eigene Armee","eine eigene Regierung"],"c":3,"x":"Jedes deutsche Bundesland hat eine eigene Landesregierung. Eine eigene Währung, eine eigene Armee oder ein eigenes Außenministerium hat dagegen nicht jedes Bundesland.","en":{"q":"What does every German federal state have?","a":["its own foreign minister","its own currency","its own army","its own government"],"x":"Every German federal state has its own state government. By contrast, not every federal state has its own currency, army, or foreign ministry."}},{"id":"G40","n":40,"land":false,"cat":"Religion und Kultur","q":"Mit welchen Worten beginnt die deutsche Nationalhymne?","a":["Völker, hört die Signale …","Einigkeit und Recht und Freiheit …","Freude schöner Götterfunken …","Deutschland einig Vaterland …"],"c":1,"x":"Die deutsche Nationalhymne beginnt mit den Worten „Einigkeit und Recht und Freiheit“. Diese Worte stehen am Anfang der heute verwendeten Strophe.","en":{"q":"With which words does the German national anthem begin?","a":["Peoples, hear the signals …","Unity and justice and freedom …","Joy, beautiful spark of divinity …","Germany, united fatherland …"],"x":"The German national anthem begins with the words 'Unity and justice and freedom'. These words are at the beginning of the stanza used today."}},{"id":"G41","n":41,"land":false,"cat":"Politik","q":"Warum gibt es in einer Demokratie mehr als eine Partei?","a":["weil dadurch die unterschiedlichen Meinungen der Bürgerinnen und Bürger vertreten werden","damit Bestechung in der Politik begrenzt wird","um politische Demonstrationen zu verhindern","um wirtschaftlichen Wettbewerb anzuregen"],"c":0,"x":"In einer Demokratie gibt es verschiedene Parteien, damit unterschiedliche politische Meinungen vertreten werden können. Bürgerinnen und Bürger können dadurch zwischen verschiedenen politischen Angeboten wählen.","en":{"q":"Why is there more than one political party in a democracy?","a":["because this allows the different opinions of citizens to be represented","to limit bribery in politics","to prevent political demonstrations","to encourage economic competition"],"x":"In a democracy, there are different political parties so that different political opinions can be represented. Citizens can therefore choose between different political options."}},{"id":"G42","n":42,"land":false,"cat":"Staat","q":"Wer beschließt in Deutschland ein neues Gesetz?","a":["die Regierung","das Parlament","die Gerichte","die Polizei"],"c":1,"x":"Neue Gesetze werden vom Parlament beraten und beschlossen. Gerichte wenden Gesetze an, und die Polizei sorgt für die Durchsetzung geltenden Rechts.","en":{"q":"Who passes a new law in Germany?","a":["the government","parliament","the courts","the police"],"x":"New laws are debated and passed by parliament. Courts apply laws, and the police help enforce the law in force."}},{"id":"G43","n":43,"land":false,"cat":"Politik","q":"Wann kann in Deutschland eine Partei verboten werden?","a":["wenn ihr Wahlkampf zu teuer ist","wenn sie gegen die Verfassung kämpft","wenn sie Kritik am Staatsoberhaupt äußert","wenn ihr Programm eine neue Richtung vorschlägt"],"c":1,"x":"Eine Partei kann verboten werden, wenn sie gegen die verfassungsmäßige demokratische Ordnung kämpft. Kritik an politischen Personen oder neue politische Vorschläge allein sind kein Grund für ein Parteiverbot.","en":{"q":"When can a political party be banned in Germany?","a":["if its election campaign is too expensive","if it fights against the constitution","if it criticizes the head of state","if its program proposes a new direction"],"x":"A political party can be banned if it fights against the constitutional democratic order. Criticism of political figures or new political proposals alone are not grounds for banning a party."}},{"id":"G44","n":44,"land":false,"cat":"Politik","q":"Wen kann man als Bürgerin / Bürger in Deutschland nicht direkt wählen?","a":["Abgeordnete des EU-Parlaments","Die Bundespräsidentin / den Bundespräsidenten","Landtagsabgeordnete","Bundestagsabgeordnete"],"c":1,"x":"Die Bundespräsidentin oder der Bundespräsident wird nicht direkt von den Bürgerinnen und Bürgern gewählt. Die Wahl erfolgt durch die Bundesversammlung.","en":{"q":"As a citizen in Germany, whom can you not elect directly?","a":["members of the European Parliament","the Federal President","members of a state parliament","members of the Bundestag"],"x":"The Federal President is not elected directly by the citizens. The election is carried out by the Federal Convention."}},{"id":"G45","n":45,"land":false,"cat":"Wirtschaft","q":"Zu welcher Versicherung gehört die Pflegeversicherung?","a":["Sozialversicherung","Unfallversicherung","Hausratsversicherung","Haftpflicht- und Feuerversicherung"],"c":0,"x":"Die Pflegeversicherung gehört zur Sozialversicherung. Sie hilft bei finanziellen Belastungen, wenn ein Mensch pflegebedürftig wird.","en":{"q":"Which insurance system does long-term care insurance belong to?","a":["social insurance","accident insurance","household contents insurance","liability and fire insurance"],"x":"Long-term care insurance is part of social insurance. It helps with financial burdens when a person becomes in need of care."}},{"id":"G46","n":46,"land":false,"cat":"Staat","q":"Der deutsche Staat hat viele Aufgaben. Welche Aufgabe gehört dazu?","a":["Er baut Straßen und Schulen.","Er verkauft Lebensmittel und Kleidung.","Er versorgt alle Einwohnerinnen und Einwohner kostenlos mit Zeitungen.","Er produziert Autos und Busse."],"c":0,"x":"Der Bau und die Finanzierung öffentlicher Infrastruktur wie Straßen und Schulen gehören zu den Aufgaben des Staates. Der Staat übernimmt damit wichtige Aufgaben für die Allgemeinheit.","en":{"q":"The German state has many responsibilities. Which one is among them?","a":["It builds roads and schools.","It sells food and clothing.","It provides all residents with newspapers free of charge.","It produces cars and buses."],"x":"Building and financing public infrastructure such as roads and schools are among the responsibilities of the state. In this way, the state performs important tasks for the general public."}},{"id":"G47","n":47,"land":false,"cat":"Staat","q":"Der deutsche Staat hat viele Aufgaben. Welche Aufgabe gehört nicht dazu?","a":["Er bezahlt für alle Staatsangehörigen Urlaubsreisen.","Er zahlt Kindergeld.","Er unterstützt Museen.","Er fördert Sportlerinnen und Sportler."],"c":0,"x":"Der Staat bezahlt nicht allen Staatsangehörigen ihre Urlaubsreisen. Leistungen wie Kindergeld sowie die Unterstützung von Kultur und Sport können dagegen staatliche Aufgaben sein.","en":{"q":"The German state has many responsibilities. Which one is not among them?","a":["It pays for vacation trips for all citizens.","It pays child benefit.","It supports museums.","It supports athletes."],"x":"The state does not pay for vacation trips for all citizens. Benefits such as child benefit, as well as support for culture and sports, can, by contrast, be state responsibilities."}},{"id":"G48","n":48,"land":false,"cat":"Staat","q":"Welches Organ gehört nicht zu den Verfassungsorganen Deutschlands?","a":["der Bundesrat","die Bundespräsidentin / der Bundespräsident","die Bürgerversammlung","die Regierung"],"c":2,"x":"Eine Bürgerversammlung gehört nicht zu den Verfassungsorganen Deutschlands. Zu den Verfassungsorganen gehören unter anderem Bundestag, Bundesrat, Bundespräsident, Bundesregierung und Bundesverfassungsgericht.","en":{"q":"Which body is not one of Germany's constitutional organs?","a":["the Bundesrat","the Federal President","the citizens' assembly","the government"],"x":"A citizens' assembly is not one of Germany's constitutional organs. Constitutional organs include, among others, the Bundestag, Bundesrat, Federal President, Federal Government, and Federal Constitutional Court."}},{"id":"G49","n":49,"land":false,"cat":"Bund und Länder","q":"Wer bestimmt in Deutschland die Schulpolitik?","a":["die Lehrer und Lehrerinnen","die Bundesländer","das Familienministerium","die Universitäten"],"c":1,"x":"Für die Schulpolitik sind in Deutschland vor allem die Bundesländer zuständig. Deshalb können sich Regeln und Schulsysteme zwischen den Ländern unterscheiden.","en":{"q":"Who determines school policy in Germany?","a":["teachers","the federal states","the Family Ministry","universities"],"x":"In Germany, school policy is primarily the responsibility of the federal states. Therefore, rules and school systems can differ from one state to another."}},{"id":"G50","n":50,"land":false,"cat":"Wirtschaft","q":"Die Wirtschaftsform in Deutschland nennt man …","a":["freie Zentralwirtschaft.","soziale Marktwirtschaft.","gelenkte Zentralwirtschaft.","Planwirtschaft."],"c":1,"x":"Die Wirtschaftsordnung Deutschlands heißt soziale Marktwirtschaft. Sie verbindet eine marktwirtschaftliche Ordnung mit sozialer Absicherung.","en":{"q":"The economic system in Germany is called …","a":["free centrally planned economy.","social market economy.","directed centrally planned economy.","planned economy."],"x":"Germany's economic system is called the social market economy. It combines a market-based economic order with social protection."}},{"id":"G51","n":51,"land":false,"cat":"Recht","q":"Zu einem demokratischen Rechtsstaat gehört es nicht, dass …","a":["Menschen sich kritisch über die Regierung äußern können.","Bürger friedlich demonstrieren gehen dürfen.","Menschen von einer Privatpolizei ohne Grund verhaftet werden.","jemand ein Verbrechen begeht und deshalb verhaftet wird."],"c":2,"x":"In einem demokratischen Rechtsstaat dürfen Menschen die Regierung kritisieren und friedlich demonstrieren. Eine private Polizei darf Menschen aber nicht ohne gesetzlichen Grund verhaften. Verhaftungen müssen auf Gesetzen beruhen.","en":{"q":"It is not part of a democratic constitutional state that ...","a":["people can express criticism of the government.","citizens are allowed to take part in peaceful demonstrations.","people are arrested by a private police force without cause.","someone commits a crime and is therefore arrested."],"x":"In a democratic constitutional state, people are allowed to criticize the government and demonstrate peacefully. However, a private police force may not arrest people without a legal basis. Arrests must be based on laws."}},{"id":"G52","n":52,"land":false,"cat":"Staat","q":"Was bedeutet 'Volkssouveränität'? Alle Staatsgewalt geht vom ...","a":["Volke aus.","Bundestag aus.","preußischen König aus.","Bundesverfassungsgericht aus."],"c":0,"x":"Volkssouveränität bedeutet: Die politische Macht kommt vom Volk. Die Bürgerinnen und Bürger bestimmen durch Wahlen mit, wer politische Entscheidungen trifft.","en":{"q":"What does 'popular sovereignty' mean? All state authority derives from the ...","a":["people.","Bundestag.","Prussian king.","Federal Constitutional Court."],"x":"Popular sovereignty means that political power comes from the people. Through elections, citizens help decide who makes political decisions."}},{"id":"G53","n":53,"land":false,"cat":"Staat","q":"Was bedeutet 'Rechtsstaat' in Deutschland?","a":["Der Staat hat Recht.","Es gibt nur rechte Parteien.","Die Bürgerinnen und Bürger entscheiden über Gesetze.","Der Staat muss die Gesetze einhalten."],"c":3,"x":"Ein Rechtsstaat bedeutet, dass auch der Staat an die Gesetze gebunden ist. Behörden und Regierung dürfen nicht einfach machen, was sie wollen.","en":{"q":"What does 'constitutional state' mean in Germany?","a":["The state is always right.","There are only right-wing parties.","Citizens decide on laws.","The state must comply with the laws."],"x":"A constitutional state means that the state itself is also bound by the law. Authorities and the government cannot simply do whatever they want."}},{"id":"G54","n":54,"land":false,"cat":"Staat","q":"Was ist keine staatliche Gewalt in Deutschland?","a":["Legislative","Judikative","Exekutive","Direktive"],"c":3,"x":"In Deutschland gibt es drei staatliche Gewalten: Legislative, Exekutive und Judikative. Eine 'Direktive' gehört nicht zu dieser Gewaltenteilung.","en":{"q":"Which is not a branch of state power in Germany?","a":["Legislature","Judiciary","Executive","Directive"],"x":"Germany has three branches of state power: the legislature, executive, and judiciary. A 'directive' is not part of this separation of powers."}},{"id":"G55","n":55,"land":false,"cat":"Staat","q":"Was zeigt dieses Bild?","a":["den Bundestagssitz in Berlin","das Bundesverfassungsgericht in Karlsruhe","das Bundesratsgebäude in Berlin","das Bundeskanzleramt in Berlin"],"c":0,"x":"Das Bild zeigt den Sitz des Deutschen Bundestages in Berlin. Der Bundestag ist das Parlament auf Bundesebene und tagt im Reichstagsgebäude.","en":{"q":"What does this picture show?","a":["the seat of the Bundestag in Berlin","the Federal Constitutional Court in Karlsruhe","the Bundesrat building in Berlin","the Federal Chancellery in Berlin"],"x":"The picture shows the seat of the German Bundestag in Berlin. The Bundestag is the federal parliament and meets in the Reichstag building."},"img":"data:image/webp;base64,UklGRvgZAQBXRUJQVlA4IOwZAQDw8QKdASpdAz4CPmEqkkYkIqIhKVT7kIAMCWpu1EAYpcl/T5yLsQNny2z3vNX9F/3fQ+sny4tMu2v/df7F+4/9c8cWQfMP27+7/sx/b/2u+Xzjfq48mfbv8v/mf7h+233s/ze4/43/d+Vdzn/uv7//lf/r/kP/////uJ/Zf+B/d/9d+uH0W/LP+h/v/7+/QF/Pf6H/qv7n/l/2L+mP+f/6/+Q/fb5Lf1P/Wf93/N/8v/9fIL+V/2H/pf4j9/f9x9S/+t/73+Y/f/5Rf53/Zf+f/Q/7L///QN/aP8L/8
