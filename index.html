G/6eknZ9PIjyXfpa9D6eV5bhWeAAAAAAAAAAAAAAAAA="},{"id":"G227","n":227,"land":false,"cat":"Europa und Welt","q":"Welches Land ist ein Nachbarland von Deutschland?","a":["Finnland","Dänemark","Norwegen","Schweden"],"c":1,"x":"Dänemark ist ein Nachbarland von Deutschland. Es grenzt im Norden an Schleswig-Holstein.","en":{"q":"Which country shares a border with Germany?","a":["Finland","Denmark","Norway","Sweden"],"x":"Denmark is a neighboring country of Germany. It borders Schleswig-Holstein to the north."}},{"id":"G228","n":228,"land":false,"cat":"Geschichte","q":"Wie wird der Beitritt der DDR zur Bundesrepublik Deutschland im Jahr 1990 allgemein genannt?","a":["NATO-Osterweiterung","EU-Osterweiterung","Deutsche Wiedervereinigung","Europäische Gemeinschaft"],"c":2,"x":"Der Beitritt der DDR zur Bundesrepublik Deutschland im Jahr 1990 wird allgemein Deutsche Wiedervereinigung genannt. Seitdem gibt es wieder einen gemeinsamen deutschen Staat.","en":{"q":"What is the GDR's accession to the Federal Republic of Germany in 1990 commonly called?","a":["NATO's eastward expansion","EU eastward enlargement","German reunification","European Community"],"x":"The GDR's accession to the Federal Republic of Germany in 1990 is commonly called German reunification. Since then, there has once again been a single German state."}},{"id":"G229","n":229,"land":false,"cat":"Europa und Welt","q":"Welches Land ist ein Nachbarland von Deutschland?","a":["Spanien","Bulgarien","Norwegen","Luxemburg"],"c":3,"x":"Luxemburg grenzt im Westen an Deutschland. Es ist eines der kleineren Nachbarländer Deutschlands.","en":{"q":"Which country shares a border with Germany?","a":["Spain","Bulgaria","Norway","Luxembourg"],"x":"Luxembourg borders Germany to the west. It is one of Germany's smaller neighboring countries."}},{"id":"G230","n":230,"land":false,"cat":"Europa und Welt","q":"Das Europäische Parlament wird regelmäßig gewählt, nämlich alle …","a":["5 Jahre.","6 Jahre.","7 Jahre.","8 Jahre."],"c":0,"x":"Das Europäische Parlament wird alle fünf Jahre gewählt. Bürgerinnen und Bürger der EU wählen dabei ihre Abgeordneten.","en":{"q":"The European Parliament is elected regularly, namely every …","a":["5 years.","6 years.","7 years.","8 years."],"x":"The European Parliament is elected every five years. Citizens of the EU elect their representatives."}},{"id":"G231","n":231,"land":false,"cat":"Europa und Welt","q":"Was bedeutet der Begriff \"europäische Integration\"?","a":["Damit sind amerikanische Einwanderinnen und Einwanderer in Europa gemeint.","Der Begriff meint den Einwanderungsstopp nach Europa.","Damit sind europäische Auswanderinnen und Auswanderer in den USA gemeint.","Der Begriff meint den Zusammenschluss europäischer Staaten zur EU."],"c":3,"x":"Europäische Integration bedeutet, dass europäische Staaten immer enger zusammenarbeiten. Ein wichtiges Ergebnis dieser Entwicklung ist die Europäische Union.","en":{"q":"What does the term \"European integration\" mean?","a":["It refers to American immigrants in Europe.","The term means stopping immigration to Europe.","It refers to European emigrants in the USA.","The term means the unification of European states into the EU."],"x":"European integration means that European states cooperate more and more closely. An important result of this development is the European Union."}},{"id":"G232","n":232,"land":false,"cat":"Europa und Welt","q":"Wer wird bei der Europawahl gewählt?","a":["die Europäische Kommission","die Länder, die in die EU eintreten dürfen","die Abgeordneten des Europäischen Parlaments","die europäische Verfassung"],"c":2,"x":"Bei der Europawahl werden die Abgeordneten des Europäischen Parlaments gewählt. Sie vertreten die Bürgerinnen und Bürger der EU.","en":{"q":"Who is elected in the European elections?","a":["the European Commission","the countries that are allowed to join the EU","the Members of the European Parliament","the European constitution"],"x":"In the European elections, the Members of the European Parliament are elected. They represent the citizens of the EU."}},{"id":"G233","n":233,"land":false,"cat":"Europa und Welt","q":"Welches Land ist ein Nachbarland von Deutschland?","a":["Tschechien","Bulgarien","Griechenland","Portugal"],"c":0,"x":"Tschechien ist ein Nachbarland von Deutschland. Es grenzt unter anderem an Bayern und Sachsen.","en":{"q":"Which country shares a border with Germany?","a":["Czech Republic","Bulgaria","Greece","Portugal"],"x":"The Czech Republic is a neighboring country of Germany. It borders, among other places, Bavaria and Saxony."}},{"id":"G234","n":234,"land":false,"cat":"Europa und Welt","q":"Wo ist ein Sitz des Europäischen Parlaments?","a":["London","Paris","Berlin","Straßburg"],"c":3,"x":"Ein Sitz des Europäischen Parlaments ist in Straßburg. Dort finden regelmäßig Plenarsitzungen statt.","en":{"q":"Where is one of the seats of the European Parliament?","a":["London","Paris","Berlin","Strasbourg"],"x":"One of the seats of the European Parliament is in Strasbourg. Regular plenary sessions are held there."}},{"id":"G235","n":235,"land":false,"cat":"Geschichte","q":"Der damalige französische Staatspräsident François Mitterrand und der damalige deutsche Bundeskanzler Helmut Kohl gedenken in Verdun gemeinsam der Toten beider Weltkriege. Welches Ziel der Europäischen Union wird bei diesem Treffen deutlich?","a":["Freundschaft zwischen England und Deutschland","Reisefreiheit in alle Länder der EU","Frieden und Sicherheit in den Ländern der EU","einheitliche Feiertage in den Ländern der EU"],"c":2,"x":"Das gemeinsame Gedenken von François Mitterrand und Helmut Kohl in Verdun steht für Versöhnung. Es zeigt das Ziel, Frieden und Sicherheit in Europa dauerhaft zu sichern.","en":{"q":"The then French President François Mitterrand and the then German Chancellor Helmut Kohl jointly commemorate the dead of both world wars in Verdun. Which goal of the European Union is illustrated by this meeting?","a":["friendship between England and Germany","freedom to travel in all EU countries","peace and security in the countries of the EU","uniform public holidays in the countries of the EU"],"x":"The joint commemoration by François Mitterrand and Helmut Kohl in Verdun stands for reconciliation. It illustrates the goal of securing lasting peace and security in Europe."}},{"id":"G236","n":236,"land":false,"cat":"Europa und Welt","q":"Wie viele Mitgliedstaaten hat die EU heute?","a":["21","23","25","27"],"c":3,"x":"Die Europäische Union hat 27 Mitgliedstaaten. Diese Staaten arbeiten in vielen politischen und wirtschaftlichen Bereichen zusammen.","en":{"q":"How many member states does the EU have today?","a":["21","23","25","27"],"x":"The European Union has 27 member states. These states cooperate in many political and economic areas."}},{"id":"G237","n":237,"land":false,"cat":"Europa und Welt","q":"Was war der Inhalt der \"Römischen Verträge\"?","a":["Beitritt Deutschlands zur NATO","Gründung der Europäischen Wirtschaftsgemeinschaft (EWG)","Verpflichtung Deutschlands zu Reparationsleistungen","Festlegung der Oder-Neiße-Linie als Ostgrenze"],"c":1,"x":"Die Römischen Verträge von 1957 gründeten unter anderem die Europäische Wirtschaftsgemeinschaft, kurz EWG. Sie war ein wichtiger Schritt auf dem Weg zur heutigen Europäischen Union.","en":{"q":"What was the content of the \"Treaties of Rome\"?","a":["Germany's accession to NATO","the establishment of the European Economic Community (EEC)","Germany's obligation to pay reparations","the establishment of the Oder-Neisse line as the eastern border"],"x":"The Treaties of Rome of 1957 established, among other things, the European Economic Community, abbreviated EEC. It was an important step toward today's European Union."}},{"id":"G238","n":238,"land":false,"cat":"Europa und Welt","q":"An welchen Orten arbeitet das Europäische Parlament?","a":["Paris, London und Den Haag","Straßburg, Luxemburg und Brüssel","Rom, Bern und Wien","Bonn, Zürich und Mailand"],"c":1,"x":"Das Europäische Parlament arbeitet an mehreren Orten: in Straßburg, Brüssel und Luxemburg. Die wichtigsten Plenarsitzungen finden in Straßburg statt.","en":{"q":"In which places does the European Parliament work?","a":["Paris, London and The Hague","Strasbourg, Luxembourg and Brussels","Rome, Bern and Vienna","Bonn, Zurich and Milan"],"x":"The European Parliament works in several places: Strasbourg, Brussels, and Luxembourg. The most important plenary sessions take place in Strasbourg."}},{"id":"G239","n":239,"land":false,"cat":"Europa und Welt","q":"Durch welche Verträge schloss sich die Bundesrepublik Deutschland mit anderen Staaten zur Europäischen Wirtschaftsgemeinschaft zusammen?","a":["durch die \"Hamburger Verträge\"","durch die \"Römischen Verträge\"","durch die \"Pariser Verträge\"","durch die \"Londoner Verträge\""],"c":1,"x":"Die Bundesrepublik Deutschland schloss sich durch die Römischen Verträge mit anderen Staaten zur Europäischen Wirtschaftsgemeinschaft zusammen. Die Verträge wurden 1957 unterzeichnet.","en":{"q":"Through which treaties did the Federal Republic of Germany join with other states to form the European Economic Community?","a":["the \"Hamburg Treaties\"","the \"Treaties of Rome\"","the \"Paris Treaties\"","the \"London Treaties\""],"x":"The Federal Republic of Germany joined with other states to form the European Economic Community through the Treaties of Rome. The treaties were signed in 1957."}},{"id":"G240","n":240,"land":false,"cat":"Europa und Welt","q":"Seit wann bezahlt man in Deutschland mit dem Euro in bar?","a":["1995","1998","2002","2005"],"c":2,"x":"Euro-Banknoten und Euro-Münzen gibt es in Deutschland seit 2002. Vorher wurde mit der Deutschen Mark bezahlt.","en":{"q":"Since when has cash in euros been used in Germany?","a":["1995","1998","2002","2005"],"x":"Euro banknotes and coins have been used in Germany since 2002. Before that, the Deutsche Mark was used."}},{"id":"G241","n":241,"land":false,"cat":"Gesellschaft und Familie","q":"Frau Seger bekommt ein Kind. Was muss sie tun, um Elterngeld zu erhalten?","a":["Sie muss an ihre Krankenkasse schreiben.","Sie muss einen Antrag bei der Elterngeldstelle stellen.","Sie muss nichts tun, denn sie bekommt automatisch Elterngeld.","Sie muss das Arbeitsamt um Erlaubnis bitten."],"c":1,"x":"Elterngeld wird nicht automatisch ausgezahlt. Eltern müssen dafür einen Antrag bei der zuständigen Elterngeldstelle stellen.","en":{"q":"Ms. Seger has a child. What must she do to receive parental allowance?","a":["She must write to her health insurance provider.","She must submit an application to the parental allowance office.","She does not need to do anything because she receives parental allowance automatically.","She must ask the employment office for permission."],"x":"Parental allowance is not paid automatically. Parents must submit an application to the responsible parental allowance office."}},{"id":"G242","n":242,"land":false,"cat":"Gesellschaft und Familie","q":"Wer entscheidet, ob ein Kind in Deutschland in den Kindergarten geht?","a":["der Staat","die Bundesländer","die Eltern / die Erziehungsberechtigten","die Schulen"],"c":2,"x":"Ob ein Kind in den Kindergarten geht, entscheiden grundsätzlich die Eltern oder Erziehungsberechtigten. Der Staat schreibt den Kindergartenbesuch normalerweise nicht allgemein vor.","en":{"q":"Who decides whether a child in Germany attends kindergarten?","a":["the state","the federal states","the parents / legal guardians","the schools"],"x":"As a rule, the parents or legal guardians decide whether a child attends kindergarten. The state does not generally require kindergarten attendance."}},{"id":"G243","n":243,"land":false,"cat":"Recht","q":"Maik und Sybille wollen mit Freunden an ihrem deutschen Wohnort eine Demonstration auf der Straße abhalten. Was müssen sie vorher tun?","a":["Sie müssen die Demonstration anmelden.","Sie müssen nichts tun. Man darf in Deutschland jederzeit überall demonstrieren.","Sie können gar nichts tun, denn Demonstrationen sind in Deutschland grundsätzlich verboten.","Maik und Sybille müssen einen neuen Verein gründen, weil nur Vereine demonstrieren dürfen."],"c":0,"x":"Eine Demonstration auf der Straße muss vorher bei der zuständigen Behörde angemeldet werden. Demonstrationen sind erlaubt, aber es gelten gesetzliche Regeln.","en":{"q":"Maik and Sybille want to hold a street demonstration with friends where they live in Germany. What must they do beforehand?","a":["They must register the demonstration.","They do not need to do anything. In Germany, people may demonstrate anytime and anywhere.","They cannot do anything because demonstrations are generally prohibited in Germany.","Maik and Sybille must form a new association because only associations are allowed to demonstrate."],"x":"A street demonstration must be registered in advance with the responsible authority. Demonstrations are permitted, but legal rules apply."}},{"id":"G244","n":244,"land":false,"cat":"Bildung und Arbeit","q":"Welchen Schulabschluss braucht man normalerweise, um an einer Universität in Deutschland ein Studium zu beginnen?","a":["das Abitur","ein Diplom","die Prokura","eine Gesellenprüfung"],"c":0,"x":"Für ein Studium an einer Universität braucht man normalerweise das Abitur oder eine vergleichbare Hochschulzugangsberechtigung. Das Abitur erlaubt den Zugang zu vielen Studiengängen.","en":{"q":"What school-leaving qualification do you normally need to begin studying at a university in Germany?","a":["the Abitur","a diploma","commercial power of attorney","a journeyman's examination"],"x":"To study at a university, you normally need the Abitur or a comparable higher education entrance qualification. The Abitur gives access to many degree programs."}},{"id":"G245","n":245,"land":false,"cat":"Gesellschaft und Familie","q":"Wer darf in Deutschland nicht als Paar zusammenleben?","a":["Hans (20 Jahre) und Marie (19 Jahre)","Tom (20 Jahre) und Klaus (45 Jahre)","Sofie (35 Jahre) und Lisa (40 Jahre)","Anne (13 Jahre) und Tim (25 Jahre)"],"c":3,"x":"Eine 13-jährige Person ist noch ein Kind und kann nicht wie eine erwachsene Person mit einem 25-Jährigen als Paar zusammenleben. Minderjährige werden durch besondere Gesetze geschützt.","en":{"q":"Who is not allowed to live together as a couple in Germany?","a":["Hans (20 years old) and Marie (19 years old)","Tom (20 years old) and Klaus (45 years old)","Sofie (35 years old) and Lisa (40 years old)","Anne (13 years old) and Tim (25 years old)"],"x":"A 13-year-old is still a child and cannot live together as a couple with a 25-year-old in the same way as an adult. Minors are protected by special laws."}},{"id":"G246","n":246,"land":false,"cat":"Gesellschaft und Familie","q":"Ab welchem Alter ist man in Deutschland volljährig?","a":["16","18","19","21"],"c":1,"x":"In Deutschland ist man ab 18 Jahren volljährig. Ab diesem Alter kann man rechtlich grundsätzlich selbstständig handeln und Entscheidungen treffen.","en":{"q":"At what age does a person become an adult in Germany?","a":["16","18","19","21"],"x":"In Germany, a person becomes an adult at age 18. From this age, a person can generally act independently and make decisions in legal matters."}},{"id":"G247","n":247,"land":false,"cat":"Gesellschaft und Familie","q":"Eine Frau ist schwanger. Sie ist kurz vor und nach der Geburt ihres Kindes vom Gesetz besonders beschützt. Wie heißt dieser Schutz?","a":["Elternzeit","Mutterschutz","Geburtsvorbereitung","Wochenbett"],"c":1,"x":"Der gesetzliche Schutz für schwangere Frauen kurz vor und nach der Geburt heißt Mutterschutz. Er schützt unter anderem die Gesundheit von Mutter und Kind am Arbeitsplatz.","en":{"q":"A woman is pregnant. Shortly before and after the birth of her child, she is given special protection by law. What is this protection called?","a":["parental leave","maternity protection","childbirth preparation","postpartum period"],"x":"The legal protection for pregnant women shortly before and after childbirth is called maternity protection. Among other things, it protects the health of the mother and child in the workplace."}},{"id":"G248","n":248,"land":false,"cat":"Gesellschaft und Familie","q":"Die Erziehung der Kinder ist in Deutschland ist vor allem Aufgabe …","a":["des Staates.","der Eltern.","der Großeltern.","der Schulen"],"c":1,"x":"Die Erziehung von Kindern ist vor allem Aufgabe der Eltern. Der Staat und die Schulen unterstützen, aber die Hauptverantwortung liegt bei den Erziehungsberechtigten.","en":{"q":"Raising children in Germany is primarily the responsibility of …","a":["the state.","the parents.","the grandparents.","the schools"],"x":"Raising children is primarily the responsibility of the parents. The state and schools provide support, but the main responsibility lies with the legal guardians."}},{"id":"G249","n":249,"land":false,"cat":"Gesellschaft und Familie","q":"Wer ist in Deutschland hauptsächlich verantwortlich für die Kindererziehung?","a":["der Staat","die Eltern","die Verwandten","die Schulen"],"c":1,"x":"Für die Kindererziehung sind in Deutschland hauptsächlich die Eltern verantwortlich. Sie entscheiden viele wichtige Fragen im Alltag und in der Entwicklung des Kindes.","en":{"q":"Who is mainly responsible for raising children in Germany?","a":["the state","the parents","the relatives","the schools"],"x":"In Germany, parents are mainly responsible for raising their children. They decide many important questions concerning the child's everyday life and development."}},{"id":"G250","n":250,"land":false,"cat":"Bildung und Arbeit","q":"In Deutschland hat man die besten Chancen auf einen gut bezahlten Arbeitsplatz, wenn man …","a":["katholisch ist.","gut ausgebildet ist.","eine Frau ist.","Mitglied einer Partei ist."],"c":1,"x":"Gute Ausbildung und berufliche Qualifikation verbessern die Chancen auf einen gut bezahlten Arbeitsplatz. Religion, Geschlecht oder Parteimitgliedschaft dürfen dafür keine Voraussetzung sein.","en":{"q":"In Germany, you have the best chances of getting a well-paid job if you …","a":["are Catholic.","are well educated and trained.","are a woman.","are a member of a political party."],"x":"Good education and professional qualifications improve the chances of getting a well-paid job. Religion, gender, or party membership must not be a requirement for this."}},{"id":"G251","n":251,"land":false,"cat":"Gesellschaft und Familie","q":"Wenn man in Deutschland ein Kind schlägt, …","a":["geht das niemanden etwas an.","geht das nur die Familie etwas an.","kann man dafür nicht bestraft werden.","kann man dafür bestraft werden."],"c":3,"x":"Kinder haben in Deutschland ein Recht auf eine gewaltfreie Erziehung. Wer ein Kind schlägt, kann deshalb rechtliche Konsequenzen bekommen und bestraft werden.","en":{"q":"If you hit a child in Germany, …","a":["it is nobody else's business.","it is only the family's business.","you cannot be punished for it.","you can be punished for it."],"x":"Children in Germany have the right to a violence-free upbringing. Anyone who hits a child can therefore face legal consequences and be punished."}},{"id":"G252","n":252,"land":false,"cat":"Gesellschaft und Familie","q":"In Deutschland …","a":["darf man zur gleichen Zeit nur mit einer Partnerin / einem Partner verheiratet sein.","kann man mehrere Ehepartnerinnen / Ehepartner gleichzeitig haben.","darf man nicht wieder heiraten, wenn man einmal verheiratet war.","darf eine Frau nicht wieder heiraten, wenn ihr Mann gestorben ist."],"c":0,"x":"In Deutschland darf eine Person immer nur mit einer Ehepartnerin oder einem Ehepartner gleichzeitig verheiratet sein. Mehrere Ehen zur selben Zeit sind nicht erlaubt.","en":{"q":"In Germany …","a":["you may only be married to one partner at a time.","you can have several spouses at the same time.","you may not marry again once you have been married.","a woman may not marry again if her husband has died."],"x":"In Germany, a person may only be married to one spouse at a time. Multiple marriages at the same time are not permitted."}},{"id":"G253","n":253,"land":false,"cat":"Staat","q":"Wo müssen Sie sich anmelden, wenn Sie in Deutschland umziehen?","a":["beim Einwohnermeldeamt","beim Standesamt","beim Ordnungsamt","beim Gewerbeamt"],"c":0,"x":"Nach einem Umzug muss man seine neue Adresse beim Einwohnermeldeamt anmelden. Dort wird der neue Wohnsitz offiziell registriert.","en":{"q":"Where do you have to register when you move within Germany?","a":["at the residents' registration office","at the registry office","at the public order office","at the trade office"],"x":"After moving, you must register your new address at the residents' registration office. Your new place of residence is officially recorded there."}},{"id":"G254","n":254,"land":false,"cat":"Gesellschaft und Familie","q":"In Deutschland dürfen Ehepaare sich scheiden lassen. Meistens müssen sie dazu das \"Trennungsjahr\" einhalten. Was bedeutet das?","a":["Der Scheidungsprozess dauert ein Jahr.","Die Ehegatten sind ein Jahr verheiratet, dann ist die Scheidung möglich.","Das Besuchsrecht für die Kinder gilt ein Jahr.","Die Ehegatten führen mindestens ein Jahr getrennt ihr eigenes Leben. Danach ist die Scheidung möglich."],"c":3,"x":"Beim Trennungsjahr leben die Ehepartner mindestens ein Jahr getrennt voneinander und führen ihr eigenes Leben. Danach kann die Scheidung in der Regel beantragt werden.","en":{"q":"In Germany, married couples are allowed to get divorced. Usually they have to observe the \"year of separation\". What does that mean?","a":["The divorce process takes one year.","The spouses are married for one year, then divorce is possible.","Visitation rights for the children apply for one year.","The spouses live separate lives for at least one year. After that, divorce is possible."],"x":"During the year of separation, the spouses live separately from each other and lead their own lives for at least one year. After that, a divorce can generally be applied for."}},{"id":"G255","n":255,"land":false,"cat":"Gesellschaft und Familie","q":"Bei Erziehungsproblemen können Eltern in Deutschland Hilfe erhalten vom …","a":["Ordnungsamt.","Schulamt.","Jugendamt.","Gesundheitsamt."],"c":2,"x":"Das Jugendamt unterstützt Eltern und Familien bei Problemen mit der Erziehung. Dort kann man Beratung und Hilfe bekommen.","en":{"q":"In Germany, parents can get help with parenting problems from the …","a":["public order office.","school authority.","youth welfare office.","public health office."],"x":"The youth welfare office supports parents and families with parenting problems. Advice and assistance are available there."}},{"id":"G256","n":256,"land":false,"cat":"Staat","q":"Ein Ehepaar möchte in Deutschland ein Restaurant eröffnen. Was braucht es dazu unbedingt?","a":["eine Erlaubnis der Polizei","eine Genehmigung einer Partei","eine Genehmigung des Einwohnermeldeamts","eine Gaststättenerlaubnis von der zuständigen Behörde"],"c":3,"x":"Wer ein Restaurant eröffnen möchte, braucht dafür eine Gaststättenerlaubnis von der zuständigen Behörde. Diese Erlaubnis ist für den Betrieb notwendig.","en":{"q":"A married couple wants to open a restaurant in Germany. What do they definitely need?","a":["permission from the police","approval from a political party","approval from the residents' registration office","a restaurant permit from the competent authority"],"x":"Anyone who wants to open a restaurant needs a restaurant permit from the competent authority. This permit is necessary to operate the business."}},{"id":"G257","n":257,"land":false,"cat":"Bildung und Arbeit","q":"Eine erwachsene Frau möchte in Deutschland das Abitur nachholen. Das kann sie an …","a":["einer Hochschule.","einem Abendgymnasium.","einer Hauptschule.","einer Privatuniversität."],"c":1,"x":"Auch Erwachsene können das Abitur später nachholen. Eine typische Möglichkeit dafür ist das Abendgymnasium.","en":{"q":"An adult woman in Germany wants to obtain her Abitur later in life. She can do this at …","a":["a university.","an evening grammar school.","a Hauptschule.","a private university."],"x":"Adults can also obtain the Abitur later in life. A typical option is an evening grammar school."}},{"id":"G258","n":258,"land":false,"cat":"Gesellschaft und Familie","q":"Was darf das Jugendamt in Deutschland?","a":["Es entscheidet, welche Schule das Kind besucht.","Es kann ein Kind, das geschlagen wird oder hungern muss, aus der Familie nehmen.","Es bezahlt das Kindergeld an die Eltern.","Es kontrolliert, ob das Kind einen Kindergarten besucht."],"c":1,"x":"Das Jugendamt muss Kinder schützen. Wenn ein Kind geschlagen wird oder nicht genug zu essen bekommt, kann das Jugendamt es zum Schutz aus der Familie nehmen.","en":{"q":"What is the youth welfare office allowed to do in Germany?","a":["It decides which school the child attends.","It can remove a child from the family if the child is being beaten or made to go hungry.","It pays child benefit to the parents.","It checks whether the child attends kindergarten."],"x":"The youth welfare office must protect children. If a child is being beaten or does not get enough to eat, the youth welfare office can remove the child from the family for protection."}},{"id":"G259","n":259,"land":false,"cat":"Bildung und Arbeit","q":"Das Berufsinformationszentrum BIZ bei der Bundesagentur für Arbeit in Deutschland hilft bei der …","a":["Rentenberechnung.","Lehrstellensuche.","Steuererklärung.","Krankenversicherung."],"c":1,"x":"Das Berufsinformationszentrum, kurz BIZ, informiert über Berufe, Ausbildung und Arbeit. Es hilft zum Beispiel bei der Suche nach einer Lehrstelle.","en":{"q":"The Career Information Center (BIZ) at the Federal Employment Agency in Germany helps with …","a":["pension calculations.","finding an apprenticeship.","tax returns.","health insurance."],"x":"The Career Information Center, or BIZ for short, provides information about occupations, training, and work. For example, it helps with finding an apprenticeship."}},{"id":"G260","n":260,"land":false,"cat":"Bildung und Arbeit","q":"In Deutschland hat ein Kind in der Schule …","a":["Recht auf unbegrenzte Freizeit.","Wahlfreiheit für alle Fächer.","Anspruch auf Schulgeld.","Anwesenheitspflicht."],"c":3,"x":"Kinder müssen in Deutschland regelmäßig die Schule besuchen. Deshalb gibt es eine Anwesenheitspflicht.","en":{"q":"In Germany, a child at school has …","a":["the right to unlimited free time.","freedom to choose all subjects.","a claim to school fees.","compulsory attendance."],"x":"Children in Germany must attend school regularly. That is why school attendance is compulsory."}},{"id":"G261","n":261,"land":false,"cat":"Bildung und Arbeit","q":"Ein Mann möchte mit 30 Jahren in Deutschland sein Abitur nachholen. Wo kann er das tun? An …","a":["einer Hochschule.","einem Abendgymnasium.","einer Hauptschule.","einer Privatuniversität."],"c":1,"x":"Auch mit 30 Jahren kann man das Abitur noch nachholen. Dafür gibt es zum Beispiel Abendgymnasien für Erwachsene.","en":{"q":"A man in Germany wants to obtain his Abitur at the age of 30. Where can he do this? At …","a":["a university.","an evening grammar school.","a Hauptschule.","a private university."],"x":"You can still obtain the Abitur at the age of 30. Evening grammar schools for adults are one option."}},{"id":"G262","n":262,"land":false,"cat":"Recht","q":"Was bedeutet in Deutschland der Grundsatz der Gleichbehandlung?","a":["Niemand darf z.B. wegen einer Behinderung benachteiligt werden.","Man darf andere Personen benachteiligen, wenn ausreichende persönliche Gründe hierfür vorliegen.","Niemand darf gegen Personen klagen, wenn sie benachteiligt wurden.","Es ist für alle Gesetz, benachteiligten Gruppen jährlich Geld zu spenden."],"c":0,"x":"Der Grundsatz der Gleichbehandlung bedeutet, dass Menschen nicht ohne sachlichen Grund benachteiligt werden dürfen. Eine Behinderung darf zum Beispiel kein Grund für eine Benachteiligung sein.","en":{"q":"What does the principle of equal treatment mean in Germany?","a":["No one may be disadvantaged, for example because of a disability.","You may disadvantage other people if there are sufficient personal reasons for doing so.","No one may sue people if they have been disadvantaged.","Everyone is legally required to donate money to disadvantaged groups every year."],"x":"The principle of equal treatment means that people may not be disadvantaged without an objective reason. A disability, for example, must not be a reason for discrimination."}},{"id":"G263","n":263,"land":false,"cat":"Recht","q":"In Deutschland sind Jugendliche ab 14 Jahren strafmündig. Das bedeutet: Jugendliche, die 14 Jahre und älter sind und gegen Strafgesetze verstoßen, …","a":["werden bestraft.","werden wie Erwachsene behandelt.","teilen die Strafe mit ihren Eltern.","werden nicht bestraft."],"c":0,"x":"Ab 14 Jahren können Jugendliche in Deutschland für Straftaten verantwortlich gemacht werden. Für sie gilt dabei das Jugendstrafrecht.","en":{"q":"In Germany, young people are criminally responsible from the age of 14. This means: young people aged 14 and over who violate criminal laws …","a":["are punished.","are treated like adults.","share the punishment with their parents.","are not punished."],"x":"From the age of 14, young people in Germany can be held responsible for criminal offenses. Juvenile criminal law applies to them."}},{"id":"G264","n":264,"land":false,"cat":"Religion und Kultur","q":"Zu welchem Fest tragen Menschen in Deutschland bunte Kostüme und Masken?","a":["am Rosenmontag","am Maifeiertag","beim Oktoberfest","an Pfingsten"],"c":0,"x":"Am Rosenmontag feiern viele Menschen Karneval oder Fasching. Dabei tragen sie oft bunte Kostüme und Masken.","en":{"q":"At which festival do people in Germany wear colorful costumes and masks?","a":["on Rose Monday","on May Day","at Oktoberfest","at Pentecost"],"x":"On Rose Monday, many people celebrate Carnival or Fasching. They often wear colorful costumes and masks."}},{"id":"G265","n":265,"land":false,"cat":"Gesellschaft und Familie","q":"Wohin muss man in Deutschland zuerst gehen, wenn man heiraten möchte?","a":["zum Einwohnermeldeamt","zum Ordnungsamt","zur Agentur für Arbeit","zum Standesamt"],"c":3,"x":"Wer in Deutschland heiraten möchte, muss sich zuerst an das Standesamt wenden. Dort wird die Eheschließung offiziell vorbereitet und durchgeführt.","en":{"q":"Where do you have to go first in Germany if you want to get married?","a":["to the residents' registration office","to the public order office","to the Employment Agency","to the registry office"],"x":"Anyone who wants to get married in Germany must first contact the registry office. The marriage is officially prepared and conducted there."}},{"id":"G266","n":266,"land":false,"cat":"Recht","q":"Wann beginnt die gesetzliche Nachtruhe in Deutschland?","a":["wenn die Sonne untergeht","wenn die Nachbarn schlafen gehen","um 0 Uhr, Mitternacht","um 22 Uhr"],"c":3,"x":"Die Nachtruhe beginnt in Deutschland normalerweise um 22 Uhr. In dieser Zeit soll man Lärm vermeiden und auf die Nachbarn Rücksicht nehmen.","en":{"q":"When does the statutory nighttime quiet period begin in Germany?","a":["when the sun sets","when the neighbors go to sleep","at 12 a.m., midnight","at 10 p.m."],"x":"The nighttime quiet period in Germany normally begins at 10 p.m. During this time, people should avoid noise and be considerate of their neighbors."}},{"id":"G267","n":267,"land":false,"cat":"Gesellschaft und Familie","q":"Eine junge Frau in Deutschland, 22 Jahre alt, lebt mit ihrem Freund zusammen. Die Eltern der Frau finden das nicht gut, weil ihnen der Freund nicht gefällt. Was können die Eltern tun?","a":["Sie müssen die Entscheidung der volljährigen Tochter respektieren.","Sie haben das Recht, die Tochter in die elterliche Wohnung zurückzuholen.","Sie können zur Polizei gehen und die Tochter anzeigen.","Sie suchen einen anderen Mann für die Tochter."],"c":0,"x":"Mit 22 Jahren ist die Frau volljährig und entscheidet selbst über ihr Privatleben. Ihre Eltern müssen ihre Entscheidung respektieren.","en":{"q":"A 22-year-old woman in Germany lives with her boyfriend. Her parents do not like this because they do not like her boyfriend. What can the parents do?","a":["They must respect their adult daughter's decision.","They have the right to bring their daughter back to the parental home.","They can go to the police and report their daughter.","They find another man for their daughter."],"x":"At the age of 22, the woman is an adult and makes her own decisions about her private life. Her parents must respect her decision."}},{"id":"G268","n":268,"land":false,"cat":"Gesellschaft und Familie","q":"Eine junge Frau will den Führerschein machen. Sie hat Angst vor der Prüfung, weil ihre Muttersprache nicht Deutsch ist. Was ist richtig?","a":["Sie muss mindestens zehn Jahre in Deutschland leben, bevor sie den Führerschein machen kann.","Wenn sie kein Deutsch kann, darf sie keinen Führerschein haben.","Sie muss den Führerschein in dem Land machen, in dem man ihre Sprache spricht.","Sie kann die Theorie-Prüfung vielleicht in ihrer Muttersprache machen. Es gibt mehr als zehn Sprachen zur Auswahl."],"c":3,"x":"Die Theorieprüfung für den Führerschein kann in Deutschland in mehreren Sprachen angeboten werden. Deshalb ist sie unter bestimmten Voraussetzungen auch in der Muttersprache möglich.","en":{"q":"A young woman wants to get a driving license. She is afraid of the test because German is not her native language. What is correct?","a":["She must have lived in Germany for at least ten years before she can get a driving license.","If she does not speak German, she is not allowed to have a driving license.","She must get the driving license in the country where her language is spoken.","She may be able to take the theory test in her native language. More than ten languages are available."],"x":"The theory test for a driving license in Germany can be offered in several languages. Under certain conditions, it is therefore also possible to take it in one's native language."}},{"id":"G269","n":269,"land":false,"cat":"Bildung und Arbeit","q":"In Deutschland haben Kinder ab dem Alter von drei Jahren bis zur Ersteinschulung einen Anspruch auf …","a":["monatliches Taschengeld.","einen Platz in einem Sportverein.","einen Kindergartenplatz.","einen Ferienpass."],"c":2,"x":"Kinder haben ab dem dritten Lebensjahr bis zum Schuleintritt einen Anspruch auf einen Kindergartenplatz. Eltern können dafür einen Betreuungsplatz beantragen.","en":{"q":"In Germany, children from the age of three until they start school are entitled to …","a":["monthly pocket money.","a place in a sports club.","a kindergarten place.","a holiday pass."],"x":"From the age of three until starting school, children are entitled to a kindergarten place. Parents can apply for a childcare place."}},{"id":"G270","n":270,"land":false,"cat":"Bildung und Arbeit","q":"Die Volkshochschule in Deutschland ist eine Einrichtung …","a":["für den Religionsunterricht.","nur für Jugendliche.","zur Weiterbildung.","nur für Rentnerinnen und Rentner."],"c":2,"x":"Die Volkshochschule bietet Kurse für Erwachsene an. Dort kann man sich zum Beispiel in Sprachen, Beruf oder anderen Themen weiterbilden.","en":{"q":"The adult education center (Volkshochschule) in Germany is an institution …","a":["for religious instruction.","only for young people.","for continuing education.","only for retirees."],"x":"The adult education center offers courses for adults. There you can continue your education, for example in languages, work-related topics, or other subjects."}},{"id":"G271","n":271,"land":false,"cat":"Religion und Kultur","q":"Was ist in Deutschland ein Brauch zu Weihnachten?","a":["bunte Eier verstecken","einen Tannenbaum schmücken","sich mit Masken und Kostümen verkleiden","Kürbisse vor die Tür stellen"],"c":1,"x":"Ein typischer Weihnachtsbrauch in Deutschland ist ein geschmückter Tannenbaum. Viele Familien stellen ihn in der Advents- oder Weihnachtszeit zu Hause auf.","en":{"q":"What is a Christmas custom in Germany?","a":["hiding colorful eggs","decorating a Christmas tree","dressing up with masks and costumes","putting pumpkins in front of the door"],"x":"A typical Christmas custom in Germany is a decorated Christmas tree. Many families put one up at home during Advent or the Christmas season."}},{"id":"G272","n":272,"land":false,"cat":"Gesellschaft und Familie","q":"Welche Lebensform ist in Deutschland nicht erlaubt?","a":["Mann und Frau sind geschieden und leben mit neuen Partnern zusammen.","Zwei Frauen leben zusammen.","Ein alleinerziehender Vater lebt mit seinen zwei Kindern zusammen.","Ein Mann ist mit zwei Frauen zur selben Zeit verheiratet."],"c":3,"x":"In Deutschland darf ein Mann nicht gleichzeitig mit zwei Frauen verheiratet sein. Eine Ehe mit mehreren Ehepartnern zur selben Zeit ist nicht erlaubt.","en":{"q":"Which form of living arrangement is not allowed in Germany?","a":["A man and a woman are divorced and live with new partners.","Two women live together.","A single father lives with his two children.","A man is married to two women at the same time."],"x":"In Germany, a man may not be married to two women at the same time. Marriage to multiple spouses at the same time is not permitted."}},{"id":"G273","n":273,"land":false,"cat":"Gesellschaft und Familie","q":"Bei Erziehungsproblemen gehen Sie in Deutschland …","a":["zur Ärztin / zum Arzt.","zum Gesundheitsamt.","zum Einwohnermeldeamt.","zum Jugendamt."],"c":3,"x":"Bei Problemen mit der Erziehung können Eltern zum Jugendamt gehen. Dort gibt es Beratung und Unterstützung für Familien.","en":{"q":"If you have parenting problems in Germany, you go …","a":["to a doctor.","to the public health office.","to the residents' registration office.","to the youth welfare office."],"x":"Parents can go to the youth welfare office if they have parenting problems. Advice and support for families are available there."}},{"id":"G274","n":274,"land":false,"cat":"Recht","q":"Sie haben in Deutschland absichtlich einen Brief geöffnet, der an eine andere Person adressiert ist. Was haben Sie nicht beachtet?","a":["das Schweigerecht","das Briefgeheimnis","die Schweigepflicht","die Meinungsfreiheit"],"c":1,"x":"Briefe sind durch das Briefgeheimnis geschützt. Man darf einen Brief, der an eine andere Person adressiert ist, nicht einfach ohne Erlaubnis öffnen.","en":{"q":"In Germany, you intentionally opened a letter addressed to another person. What did you fail to respect?","a":["the right to remain silent","the secrecy of correspondence","the duty of confidentiality","freedom of expression"],"x":"Letters are protected by the secrecy of correspondence. You may not simply open a letter addressed to another person without permission."}},{"id":"G275","n":275,"land":false,"cat":"Gesellschaft und Familie","q":"Was braucht man in Deutschland für eine Ehescheidung?","a":["die Einwilligung der Eltern","ein Attest einer Ärztin / eines Arztes","die Einwilligung der Kinder","die Unterstützung einer Anwältin / eines Anwalts"],"c":3,"x":"Bei einer Scheidung ist in Deutschland in der Regel anwaltliche Unterstützung notwendig. Mindestens die Person, die den Scheidungsantrag stellt, braucht eine Anwältin oder einen Anwalt.","en":{"q":"What do you need for a divorce in Germany?","a":["the parents' consent","a medical certificate","the children's consent","the assistance of a lawyer"],"x":"In Germany, legal assistance is generally required for a divorce. At least the person filing for divorce needs a lawyer."}},{"id":"G276","n":276,"land":false,"cat":"Staat","q":"Was sollten Sie tun, wenn Sie von Ihrer Ansprechpartnerin / Ihrem Ansprechpartner in einer deutschen Behörde schlecht behandelt werden?","a":["Ich kann nichts tun.","Ich muss mir diese Behandlung gefallen lassen.","Ich drohe der Person.","Ich kann mich bei der Behördenleiterin / beim Behördenleiter beschweren."],"c":3,"x":"Wenn man sich in einer Behörde schlecht behandelt fühlt, kann man sich bei der Leitung der Behörde beschweren. Man muss unangemessenes Verhalten nicht einfach akzeptieren.","en":{"q":"What should you do if you are treated badly by your contact person at a German public authority?","a":["I cannot do anything.","I have to put up with this treatment.","I threaten the person.","I can complain to the head of the authority."],"x":"If you feel you have been treated badly at a public authority, you can complain to the management of the authority. You do not simply have to accept inappropriate behavior."}},{"id":"G277","n":277,"land":false,"cat":"Recht","q":"Eine Frau, die ein zweijähriges Kind hat, bewirbt sich in Deutschland um eine Stelle. Was ist ein Beispiel für Diskriminierung? Sie bekommt die Stelle nur deshalb nicht, weil sie …","a":["kein Englisch spricht.","zu hohe Gehaltsvorstellungen hat.","keine Erfahrungen in diesem Beruf hat.","Mutter ist"],"c":3,"x":"Eine Bewerberin darf nicht allein deshalb benachteiligt werden, weil sie Mutter ist. Eine solche Benachteiligung kann Diskriminierung sein.","en":{"q":"A woman with a two-year-old child applies for a job in Germany. What is an example of discrimination? She does not get the job solely because she …","a":["does not speak English.","has salary expectations that are too high.","has no experience in this profession.","is a mother"],"x":"An applicant may not be disadvantaged solely because she is a mother. Such disadvantage can constitute discrimination."}},{"id":"G278","n":278,"land":false,"cat":"Recht","q":"Ein Mann im Rollstuhl hat sich auf eine Stelle als Buchhalter beworben. Was ist ein Beispiel für Diskriminierung? Er bekommt die Stelle nur deshalb nicht, weil er …","a":["im Rollstuhl sitzt.","keine Erfahrung hat.","zu hohe Gehaltsvorstellungen hat.","kein Englisch spricht."],"c":0,"x":"Ein Bewerber darf nicht allein wegen einer Behinderung benachteiligt werden. Dass er im Rollstuhl sitzt, darf nicht ohne sachlichen Grund gegen ihn verwendet werden.","en":{"q":"A man in a wheelchair has applied for a job as an accountant. What is an example of discrimination? He does not get the job solely because he …","a":["uses a wheelchair.","has no experience.","has salary expectations that are too high.","does not speak English."],"x":"An applicant may not be disadvantaged solely because of a disability. The fact that he uses a wheelchair must not be held against him without an objective reason."}},{"id":"G279","n":279,"land":false,"cat":"Gesellschaft und Familie","q":"In den meisten Mietshäusern in Deutschland gibt es eine \"Hausordnung\". Was steht in einer solchen \"Hausordnung\"? Sie nennt …","a":["Regeln für die Benutzung öffentlicher Verkehrsmittel.","alle Mieterinnen und Mieter im Haus.","Regeln, an die sich alle Bewohnerinnen und Bewohner halten müssen.","die Adresse des nächsten Ordnungsamtes."],"c":2,"x":"Eine Hausordnung enthält Regeln für das Zusammenleben in einem Mietshaus. Alle Bewohnerinnen und Bewohner sollen sich an diese Regeln halten.","en":{"q":"In most apartment buildings in Germany there are \"house rules\". What is stated in such \"house rules\"? They specify …","a":["rules for using public transportation.","all tenants in the building.","rules that all residents must follow.","the address of the nearest public order office."],"x":"House rules contain rules for living together in an apartment building. All residents are expected to follow these rules."}},{"id":"G280","n":280,"land":false,"cat":"Recht","q":"Wenn Sie sich in Deutschland gegen einen falschen Steuerbescheid wehren wollen, müssen Sie …","a":["nichts machen.","den Bescheid wegwerfen.","Einspruch einlegen.","warten, bis ein anderer Bescheid kommt."],"c":2,"x":"Wenn ein Steuerbescheid falsch ist, kann man dagegen Einspruch einlegen. Damit fordert man das Finanzamt auf, den Bescheid noch einmal zu prüfen.","en":{"q":"If you want to challenge an incorrect tax assessment in Germany, you must …","a":["do nothing.","throw the assessment away.","file an objection.","wait until another assessment arrives."],"x":"If a tax assessment is incorrect, you can file an objection. This asks the tax office to review the assessment again."}},{"id":"G281","n":281,"land":false,"cat":"Recht","q":"Zwei Freunde wollen in ein öffentliches Schwimmbad in Deutschland. Beide haben eine dunkle Hautfarbe und werden deshalb nicht hineingelassen. Welches Recht wird in dieser Situation verletzt? Das Recht auf …","a":["Meinungsfreiheit","Gleichbehandlung","Versammlungsfreiheit","Freizügigkeit"],"c":1,"x":"Menschen dürfen nicht wegen ihrer Hautfarbe benachteiligt werden. Werden sie deshalb nicht in ein Schwimmbad gelassen, wird der Grundsatz der Gleichbehandlung verletzt.","en":{"q":"Two friends want to enter a public swimming pool in Germany. Both have dark skin and are therefore refused entry. Which right is violated in this situation? The right to …","a":["freedom of expression","equal treatment","freedom of assembly","freedom of movement"],"x":"People may not be disadvantaged because of their skin color. If they are refused entry to a swimming pool for this reason, the principle of equal treatment is violated."}},{"id":"G282","n":282,"land":false,"cat":"Recht","q":"Welches Ehrenamt müssen deutsche Staatsbürgerinnen und Staatsbürger übernehmen, wenn sie dazu aufgefordert werden?","a":["Vereinstrainerin / Vereinstrainer","Wahlhelferin / Wahlhelfer","Bibliotheksaufsicht","Lehrerin / Lehrer"],"c":1,"x":"Wer als deutsche Staatsbürgerin oder deutscher Staatsbürger zum Wahlhelfer berufen wird, muss dieses Ehrenamt grundsätzlich übernehmen. Wahlhelfer unterstützen die ordnungsgemäße Durchführung einer Wahl.","en":{"q":"Which honorary public duty must German citizens take on if they are asked to do so?","a":["sports club coach","election worker","library supervisor","teacher"],"x":"If a German citizen is appointed as an election worker, they are generally required to perform this honorary duty. Election workers help ensure that an election is conducted properly."}},{"id":"G283","n":283,"land":false,"cat":"Recht","q":"Was tun Sie, wenn Sie eine falsche Rechnung von einer deutschen Behörde bekommen?","a":["Ich lasse die Rechnung liegen.","Ich lege Widerspruch bei der Behörde ein.","Ich schicke die Rechnung an die Behörde zurück.","Ich gehe mit der Rechnung zum Finanzamt"],"c":1,"x":"Gegen eine falsche Rechnung oder einen falschen Bescheid einer Behörde kann man sich wehren. Dafür legt man bei der Behörde Widerspruch ein.","en":{"q":"What do you do if you receive an incorrect bill from a German public authority?","a":["I leave the bill as it is.","I file an objection with the authority.","I send the bill back to the authority.","I take the bill to the tax office"],"x":"You can challenge an incorrect bill or decision from a public authority. To do so, you file an objection with the authority."}},{"id":"G284","n":284,"land":false,"cat":"Bildung und Arbeit","q":"Was man für die Arbeit können muss, ändert sich in Zukunft sehr schnell. Was kann man tun?","a":["Es ist egal, was man lernt.","Erwachsene müssen auch nach der Ausbildung immer weiter lernen.","Kinder lernen in der Schule alles, was im Beruf wichtig ist. Nach der Schule muss man nicht weiter lernen.","Alle müssen früher aufhören zu arbeiten, weil sich alles ändert."],"c":1,"x":"Berufe und Anforderungen verändern sich ständig. Deshalb ist es auch für Erwachsene wichtig, nach der Ausbildung weiterzulernen und sich fortzubilden.","en":{"q":"What you need to be able to do for work will change very quickly in the future. What can you do?","a":["It does not matter what you learn.","Adults must continue learning even after completing their training.","Children learn everything at school that is important for work. After school, you do not need to continue learning.","Everyone must stop working earlier because everything is changing."],"x":"Occupations and requirements are constantly changing. That is why it is important for adults to continue learning and training even after completing their initial training."}},{"id":"G285","n":285,"land":false,"cat":"Bildung und Arbeit","q":"Frau Frost arbeitet als fest angestellte Mitarbeiterin in einem Büro. Was muss sie nicht von ihrem Gehalt bezahlen?","a":["Lohnsteuer","Beiträge zur Arbeitslosenversicherung","Beiträge zur Renten- und Krankenversicherung","Umsatzsteuer"],"c":3,"x":"Eine fest angestellte Person zahlt vom Gehalt zum Beispiel Lohnsteuer sowie Beiträge zu Sozialversicherungen. Umsatzsteuer wird dagegen nicht direkt vom Gehalt abgezogen.","en":{"q":"Ms. Frost works as a permanently employed office worker. What does she not have to pay from her salary?","a":["wage tax","unemployment insurance contributions","pension and health insurance contributions","value-added tax"],"x":"A permanently employed person pays, for example, wage tax and social insurance contributions from their salary. Value-added tax, however, is not deducted directly from salary."}},{"id":"G286","n":286,"land":false,"cat":"Bildung und Arbeit","q":"Welche Organisation in einer Firma hilft den Arbeitnehmerinnen und Arbeitnehmern bei Problemen mit der Arbeitgeberin / dem Arbeitgeber?","a":["der Betriebsrat","die Betriebsprüferin / der Betriebsprüfer","die Betriebsgruppe","das Betriebsmanagement"],"c":0,"x":"Der Betriebsrat vertritt die Interessen der Arbeitnehmerinnen und Arbeitnehmer in einem Betrieb. Er kann bei Problemen mit dem Arbeitgeber beraten und unterstützen.","en":{"q":"Which organization in a company helps employees with problems involving the employer?","a":["the works council","the company auditor","the company group","the company management"],"x":"The works council represents the interests of employees in a company. It can provide advice and support with problems involving the employer."}},{"id":"G287","n":287,"land":false,"cat":"Bildung und Arbeit","q":"Sie möchten bei einer Firma in Deutschland ihr Arbeitsverhältnis beenden. Was müssen Sie beachten?","a":["die Gehaltszahlungen","die Arbeitszeit","die Kündigungsfrist","die Versicherungspflicht"],"c":2,"x":"Wer sein Arbeitsverhältnis beenden möchte, muss die geltende Kündigungsfrist beachten. Sie bestimmt, wie lange das Arbeitsverhältnis nach der Kündigung noch weiterläuft.","en":{"q":"You want to end your employment relationship with a company in Germany. What do you have to take into account?","a":["salary payments","working hours","the notice period","the insurance obligation"],"x":"Anyone who wants to end their employment relationship must observe the applicable notice period. It determines how long the employment relationship continues after notice is given."}},{"id":"G288","n":288,"land":false,"cat":"Geschichte","q":"Woraus begründet sich Deutschlands besondere Verantwortung für Israel?","a":["aus der Mitgliedschaft in der Europäischen Union (EU)","aus den nationalsozialistischen Verbrechen gegen Juden","aus dem Grundgesetz der Bundesrepublik Deutschland","aus der christlichen Tradition"],"c":1,"x":"Deutschlands besondere Verantwortung für Israel hängt mit den nationalsozialistischen Verbrechen an den europäischen Juden zusammen. Dazu gehört besonders die Erinnerung an den Holocaust.","en":{"q":"What is Germany's special responsibility for Israel based on?","a":["membership in the European Union (EU)","the National Socialist crimes against Jews","the Basic Law of the Federal Republic of Germany","the Christian tradition"],"x":"Germany's special responsibility for Israel is connected to the National Socialist crimes against European Jews. This includes, in particular, remembrance of the Holocaust."}},{"id":"G289","n":289,"land":false,"cat":"Recht","q":"Ein Mann mit dunkler Hautfarbe bewirbt sich um eine Stelle als Kellner in einem Restaurant in Deutschland. Was ist ein Beispiel für Diskriminierung? Er bekommt die Stelle nur deshalb nicht, weil …","a":["seine Deutschkenntnisse zu gering sind.","er zu hohe Gehaltsvorstellungen hat.","er eine dunkle Haut hat.","er keine Erfahrungen im Beruf hat."],"c":2,"x":"Ein Bewerber darf nicht allein wegen seiner Hautfarbe abgelehnt werden. Eine solche Benachteiligung ist ein Beispiel für Diskriminierung.","en":{"q":"A dark-skinned man applies for a job as a waiter in a restaurant in Germany. What is an example of discrimination? He does not get the job solely because …","a":["his German language skills are too weak.","his salary expectations are too high.","he has dark skin.","he has no professional experience."],"x":"An applicant may not be rejected solely because of his skin color. Such disadvantage is an example of discrimination."}},{"id":"G290","n":290,"land":false,"cat":"Recht","q":"Sie haben in Deutschland einen Fernseher gekauft. Zu Hause packen Sie den Fernseher aus, doch er funktioniert nicht. Der Fernseher ist kaputt. Was können Sie machen?","a":["eine Anzeige schreiben","den Fernseher reklamieren","das Gerät ungefragt austauschen","die Garantie verlängern"],"c":1,"x":"Wenn ein neu gekaufter Fernseher kaputt ist, kann man ihn beim Verkäufer reklamieren. Der Verkäufer muss sich dann mit dem Mangel beschäftigen.","en":{"q":"You bought a television in Germany. At home, you unpack it, but it does not work. The television is broken. What can you do?","a":["file a police report","make a complaint about the television","replace the device without asking","extend the warranty"],"x":"If a newly purchased television is broken, you can make a complaint to the seller. The seller must then address the defect."}},{"id":"G291","n":291,"land":false,"cat":"Religion und Kultur","q":"Warum muss man in Deutschland bei der Steuererklärung aufschreiben, ob man zu einer Kirche gehört oder nicht? Weil …","a":["es eine Kirchensteuer gibt, die an die Einkommen- und Lohnsteuer geknüpft ist.","das für die Statistik in Deutschland wichtig ist.","man mehr Steuern zahlen muss, wenn man nicht zu einer Kirche gehört.","die Kirche für die Steuererklärung verantwortlich ist."],"c":0,"x":"Mitglieder bestimmter Kirchen zahlen in Deutschland Kirchensteuer. Deshalb wird bei der Steuererklärung gefragt, ob man einer entsprechenden Religionsgemeinschaft angehört.","en":{"q":"Why do you have to state on your tax return in Germany whether or not you belong to a church? Because …","a":["there is a church tax linked to income tax and wage tax.","it is important for statistics in Germany.","you have to pay more taxes if you do not belong to a church.","the church is responsible for the tax return."],"x":"Members of certain churches in Germany pay church tax. That is why the tax return asks whether you belong to a corresponding religious community."}},{"id":"G292","n":292,"land":false,"cat":"Religion und Kultur","q":"Die Menschen in Deutschland leben nach dem Grundsatz der religiösen Toleranz. Was bedeutet das?","a":["Es dürfen keine Moscheen gebaut werden.","Alle Menschen glauben an Gott.","Jeder kann glauben, was er möchte.","Der Staat entscheidet, an welchen Gott die Menschen glauben."],"c":2,"x":"Religiöse Toleranz bedeutet, dass Menschen ihren Glauben frei wählen und ausüben dürfen. Man kann also glauben, was man möchte, solange man die Gesetze beachtet.","en":{"q":"People in Germany live according to the principle of religious tolerance. What does that mean?","a":["No mosques may be built.","Everyone believes in God.","Everyone can believe what they want.","The state decides which god people believe in."],"x":"Religious tolerance means that people may freely choose and practice their faith. In other words, people can believe what they want as long as they obey the law."}},{"id":"G293","n":293,"land":false,"cat":"Religion und Kultur","q":"Was ist in Deutschland ein Brauch zu Ostern?","a":["Kürbisse vor die Tür stellen","einen Tannenbaum schmücken","Eier bemalen","Raketen in die Luft schießen"],"c":2,"x":"Ein verbreiteter Osterbrauch ist das Bemalen von Eiern. Ostereier werden oft auch versteckt und von Kindern gesucht.","en":{"q":"What is an Easter custom in Germany?","a":["putting pumpkins in front of the door","decorating a Christmas tree","painting eggs","shooting rockets into the air"],"x":"A common Easter custom is painting eggs. Easter eggs are also often hidden and searched for by children."}},{"id":"G294","n":294,"land":false,"cat":"Religion und Kultur","q":"Pfingsten ist ein …","a":["christlicher Feiertag.","deutscher Gedenktag.","internationaler Trauertag.","bayerischer Brauch"],"c":0,"x":"Pfingsten ist ein christlicher Feiertag. Er gehört zu den wichtigen Festen des Christentums.","en":{"q":"Pentecost is a …","a":["Christian holiday.","German day of remembrance.","international day of mourning.","Bavarian custom"],"x":"Pentecost is a Christian holiday. It is one of the important festivals of Christianity."}},{"id":"G295","n":295,"land":false,"cat":"Religion und Kultur","q":"Welche Religion hat die europäische und deutsche Kultur geprägt?","a":["der Hinduismus","das Christentum","der Buddhismus","der Islam"],"c":1,"x":"Das Christentum hat die Geschichte, Feiertage, Kunst und viele Traditionen in Deutschland und Europa stark geprägt.","en":{"q":"Which religion has shaped European and German culture?","a":["Hinduism","Christianity","Buddhism","Islam"],"x":"Christianity has strongly shaped history, holidays, art, and many traditions in Germany and Europe."}},{"id":"G296","n":296,"land":false,"cat":"Religion und Kultur","q":"In Deutschland nennt man die letzten vier Wochen vor Weihnachten …","a":["den Buß- und Bettag.","das Erntedankfest.","die Adventszeit.","Allerheiligen."],"c":2,"x":"Die vier Wochen vor Weihnachten nennt man Adventszeit. In dieser Zeit bereiten sich viele Menschen auf Weihnachten vor.","en":{"q":"In Germany, the last four weeks before Christmas are called …","a":["the Day of Repentance and Prayer.","the harvest festival.","Advent.","All Saints' Day."],"x":"The four weeks before Christmas are called Advent. During this time, many people prepare for Christmas."}},{"id":"G297","n":297,"land":false,"cat":"Gesellschaft und Familie","q":"Aus welchem Land sind die meisten Migrantinnen und Migranten nach Deutschland gekommen?","a":["Italien","Polen","Marokko","Türkei"],"c":3,"x":"Nach der Darstellung im Einbürgerungstest kamen besonders viele Migrantinnen und Migranten aus der Türkei nach Deutschland. Viele von ihnen kamen im Zusammenhang mit der Arbeitsmigration.","en":{"q":"From which country did most migrants to Germany come?","a":["Italy","Poland","Morocco","Turkey"],"x":"According to the presentation in the naturalization test, particularly many migrants came to Germany from Turkey. Many of them came in connection with labor migration."}},{"id":"G298","n":298,"land":false,"cat":"Geschichte","q":"In der DDR lebten vor allem Migrantinnen und Migranten aus …","a":["Vietnam, Polen, Mosambik.","Frankreich, Rumänien, Somalia.","Chile, Ungarn, Simbabwe.","Nordkorea, Mexiko, Ägypten."],"c":0,"x":"In der DDR lebten viele ausländische Vertragsarbeiterinnen und Vertragsarbeiter, unter anderem aus Vietnam, Polen und Mosambik.","en":{"q":"In the GDR, migrants mainly came from …","a":["Vietnam, Poland, Mozambique.","France, Romania, Somalia.","Chile, Hungary, Zimbabwe.","North Korea, Mexico, Egypt."],"x":"Many foreign contract workers lived in the GDR, including people from Vietnam, Poland, and Mozambique."}},{"id":"G299","n":299,"land":false,"cat":"Geschichte","q":"Ausländische Arbeitnehmerinnen und Arbeitnehmer, die in den 50er und 60er Jahren von der Bundesrepublik Deutschland angeworben wurden, nannte man …","a":["Schwarzarbeiterinnen / Schwarzarbeiter.","Gastarbeiterinnen / Gastarbeiter.","Zeitarbeiterinnen / Zeitarbeiter.","Schichtarbeiterinnen / Schichtarbeiter."],"c":1,"x":"Ausländische Arbeitskräfte, die in den 1950er- und 1960er-Jahren für die Bundesrepublik angeworben wurden, nannte man Gastarbeiterinnen und Gastarbeiter.","en":{"q":"Foreign workers recruited by the Federal Republic of Germany in the 1950s and 1960s were called …","a":["illegal workers.","guest workers.","temporary workers.","shift wo e of election."}},{"id":"B5","n":5,"land":true,"cat":"Berlin","q":"Welche Farben hat die Landesflagge von Berlin?","a":["blau-weiß-rot","weiß-rot","grün-weiß-rot","schwarz-gold"],"c":1,"x":"Richtig ist weiß-rot. Die Landesflagge von Berlin hat die Farben weiß-rot. Diese Farbkombination ist ein offizielles Kennzeichen des Bundeslandes.","en":{"q":"What colors does the state flag of Berlin have?","a":["blue-white-red","white-red","green-white-red","black-gold"],"x":"The correct answer is white-red. The state flag of Berlin has the colors white-red. This color combination is an official symbol of the federal state."}},{"id":"B6","n":6,"land":true,"cat":"Berlin","q":"Wo können Sie sich in Berlin über politische Themen informieren?","a":["beim Ordnungsamt der Gemeinde","bei den Kirchen","bei der Verbraucherzentrale","bei der Landeszentrale für politische Bildung"],"c":3,"x":"Richtig ist bei der Landeszentrale für politische Bildung. Diese Einrichtung informiert neutral über Politik, Demokratie und gesellschaftliche Themen. Sie bietet zum Beispiel Informationsmaterial und Bildungsangebote an.","en":{"q":"Where can you get information about political topics in Berlin?","a":["at the municipal public order office","at the churches","at the consumer advice center","at the State Agency for Civic Education"],"x":"The correct answer is at the State Agency for Civic Education. This institution provides neutral information about politics, democracy, and social issues. For example, it offers informational materials and educational programs."}},{"id":"B7","n":7,"land":true,"cat":"Berlin","q":"Welches Bundesland ist ein Stadtstaat?","a":["Berlin","Saarland","Brandenburg","Hessen"],"c":0,"x":"Richtig ist Berlin. Ein Stadtstaat ist gleichzeitig Stadt und Bundesland. In Deutschland sind Berlin, Bremen und Hamburg Stadtstaaten.","en":{"q":"Which federal state is ein Stadtstaat?","a":["Berlin","Saarland","Brandenburg","Hesse"],"x":"The correct answer is Berlin. A city-state is both a city <script>
(function(){
"use strict";
const NEED0=3, PENALTY=2, LS_KEY="ebt-progress-v1";
let Q=[], byId={}, state=null, mode="learn", cur=null, answered=false, recent=[], session={ok:0,n:0,streak:0,start:Date.now()};
let test=null;
let docRef=null, saveTimer=null;

/* ---------- pure logic ---------- */
function blank(){return {v:1,updatedAt:0,q:{},settings:{shuffle:true,en:false}}}
function rec(id){return state.q[id]||(state.q[id]={need:NEED0,ok:0,bad:0})}
function today(){const d=new Date().toLocaleDateString("sv"); if(!state.day||state.day.d!==d) state.day={d,ok:0,n:0}; return state.day}
function needOf(id){const r=state.q[id];return r?r.need:NEED0}
function applyAnswer(id,correct){
  const r=rec(id);
  if(correct){r.ok++; r.need=Math.max(0,r.need-1)} else {r.bad++; r.need+=PENALTY; r.lastBad=Date.now()}
  state.updatedAt=Date.now();
}
function pool(m){return Q.filter(q=>needOf(q.id)>0&&(m!=="errors"||(state.q[q.id]&&state.q[q.id].bad>0)))}
function pick(list){
  if(!list.length) return null;
  const avoid=new Set(recent.slice(-Math.min(6,list.length-1)));
  const cand=list.filter(q=>!avoid.has(q.id));
  const src=cand.length?cand:list;
  let tot=0; for(const q of src) tot+=needOf(q.id);
  let r=Math.random()*tot;
  for(const q of src){r-=needOf(q.id); if(r<=0) return q}
  return src[src.length-1];
}
function shuffled(n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sample(arr,k){return shuffled(arr.length).slice(0,k).map(i=>arr[i])}
window.__ebt={applyAnswer,pool,pick,blank,_set:s=>{state=s}};

/* ---------- persistence ---------- */
function loadLocal(){try{const s=JSON.parse(localStorage.getItem(LS_KEY)||"null");return s&&s.q?s:null}catch(e){return null}}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){}}
/* only problems are shown; a working sync stays silent */
function setSync(t){const el=document.getElementById("sync"); const bad=t.startsWith("No se "); el.textContent=t; el.hidden=!bad}
function persist(){
  saveLocal();
  if(!docRef) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flush,1200);
}
async function flush(){
  clearTimeout(saveTimer); saveTimer=null;
  if(!docRef) return;
  try{await docRef.set({state:JSON.stringify(state)}); setSync("Guardado en tu cuenta ✓")}
  catch(e){setSync("No se pudo guardar en tu cuenta: queda guardado solo en este navegador")}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&saveTimer) flush()});
async function connectDb(){}
function ensureSettings(){state.settings=Object.assign({shuffle:true,en:false},state.settings||{})}

/* ---------- rendering ---------- */
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function label(q){return q.land?"Berlin "+q.n:"Aufgabe "+q.n}
function dots(n){const shown=Math.min(n,7);return `<span class="dots" title="Faltan ${n} aciertos">${"<i></i>".repeat(shown)}<span>${n}</span></span>`}
let toastT=null;
function toast(t){const el=$("toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),1800)}

function renderStats(){
  let done=0;
  for(const q of Q){if(needOf(q.id)===0) done++}
  const pct=Q.length?done/Q.length:0;
  $("s-done").textContent=done;
  {const t=today(); $("s-session").textContent=t.ok+"/"+t.n}
  $("ringpct").textContent=Math.round(pct*100)+"%";
  $("ringval").style.strokeDashoffset=(213.6*(1-pct)).toFixed(1);
  $("cnt-learn").textContent=pool("learn").length;
  $("cnt-errors").textContent=pool("errors").length;
  const rows=Q.filter(q=>state.q[q.id]&&state.q[q.id].bad>0).sort((a,b)=>state.q[b.id].bad-state.q[a.id].bad||needOf(b.id)-needOf(a.id)).slice(0,40);
  $("errtbody").innerHTML=rows.length?rows.map(q=>`<tr><td class="num">${esc(label(q))}</td><td>${esc(q.q)}<br><span class="hint">✔ ${esc(q.a[q.c])}</span></td><td class="num">${state.q[q.id].bad}</td></tr>`).join(""):`<tr><td colspan="3" class="hint">Ninguna todavía.</td></tr>`;
}

function animateCard(){const c=$("card"); c.classList.remove("enter"); void c.offsetWidth; c.classList.add("enter")}

function renderQuestion(){
  const card=$("card"); answered=false;
  if(!cur){
    if(mode==="errors") card.innerHTML=`<div class="empty"><p class="result">Sin errores pendientes</p><p class="hint">Todas las preguntas que fallaste ya tienen sus aciertos. Seguí en Práctica.</p><button class="btn" id="go-learn">Ir a Práctica</button></div>`;
    else card.innerHTML=`<div class="empty"><p class="result">310 / 310 dominadas</p><p class="hint">Hacé un simulacro de 33 preguntas o borrá el progreso para empezar otra vuelta.</p><button class="btn" id="go-test">Simulacro 33</button></div>`;
    const gl=$("go-learn"), gt=$("go-test"); if(gl) gl.onclick=()=>setMode("learn"); if(gt) gt.onclick=()=>setMode("test");
    animateCard(); return;
  }
  const q=cur, en=state.settings.en, order=state.settings.shuffle?shuffled(4):[0,1,2,3];
  const r=state.q[q.id];
  const testInfo=test?`<span class="chip">Simulacro ${test.i+1}/33</span>`:"";
  card.innerHTML=`
    <div class="meta">${testInfo}<span class="chip ${q.land?"land":""}">${esc(label(q))}</span>${dots(needOf(q.id))}</div>
    <p class="qtext">${esc(q.q)}</p>
    ${en?`<p class="qen">${esc(q.en.q)}</p>`:""}
    ${q.img?`<div class="fig"><img src="${q.img}" alt="Abbildung zu ${esc(label(q))}">${q.imgNote?`<small>${esc(q.imgNote)}</small>`:""}</div>`:""}
    <ol class="answers">${order.map((ai,k)=>`<li><button class="ans" data-ai="${ai}" id="ans-${k}"><span class="k">${k+1}</span><span>${esc(q.a[ai])}${en?`<span class="en">${esc(q.en.a[ai])}</span>`:""}</span></button></li>`).join("")}</ol>
    <div id="fb"></div>`;
  card.querySelectorAll(".ans").forEach(b=>b.onclick=()=>answer(+b.dataset.ai));
  animateCard();
}

function answer(ai){
  if(answered||!cur) return; answered=true;
  const q=cur, ok=ai===q.c;
  applyAnswer(q.id,ok); {const t=today(); t.n++; if(ok) t.ok++} session.n++; if(ok){session.ok++; session.streak++} else session.streak=0;
  if(test){test.ok+=ok?1:0; test.log.push({id:q.id,ok})}
  recent.push(q.id); if(recent.length>20) recent.shift();
  document.querySelectorAll(".ans").forEach(b=>{b.disabled=true;const x=+b.dataset.ai; if(x===q.c) b.classList.add("right"); else if(x===ai) b.classList.add("wrong"); else b.classList.add("dim")});
  const need=needOf(q.id), en=state.settings.en;
  const old=document.querySelector(".dots"); if(old) old.outerHTML=dots(need);
  const msg=ok?(need===0?"Correcto · dominada":"Correcto"):"Incorrecto";
  const last=test&&test.i===32;
  $("fb").innerHTML=`<div class="feedback ${ok?"ok":"bad"}"><strong>${msg}</strong>
    ${q.x?`<span class="ex">${esc(en&&q.en.x?q.en.x:q.x)}</span>`:""}</div>
    <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" id="next">${last?"Ver resultado":"Siguiente"}</button></div>`;
  $("next").onclick=next; $("next").focus({preventScroll:true});
  if(ok&&session.streak>0&&session.streak%10===0) toast(session.streak+" seguidas");
  persist(); renderStats();
}

function next(){
  if(test){
    test.i++;
    if(test.i>=33){showTestResult();return}
    cur=byId[test.ids[test.i]];
  } else cur=pick(pool(mode));
  renderQuestion();
  const top=$("card").getBoundingClientRect().top;
  if(top<0) window.scrollTo({top:window.scrollY+top-12,behavior:"instant"});
}

function showTestResult(){
  const pass=test.ok>=17, wrong=test.log.filter(l=>!l.ok).map(l=>byId[l.id]);
  cur=null;
  $("card").innerHTML=`<div class="empty"><p class="result" style="color:var(${pass?"--ok":"--bad"})">${test.ok} / 33</p>
    <p>${pass?"Aprobado":"No aprobado"} · mínimo 17 correctas</p>
    ${wrong.length?`<div class="tblwrap" style="width:100%;text-align:left"><table><thead><tr><th>Nr.</th><th>Falladas</th></tr></thead><tbody>${wrong.map(q=>`<tr><td class="num">${esc(label(q))}</td><td>${esc(q.q)}<br><span class="hint">✔ ${esc(q.a[q.c])}</span></td></tr>`).join("")}</tbody></table></div>`:""}
    <div class="row" style="justify-content:center"><button class="btn" id="again">Otro simulacro</button><button class="btn ghost" id="back">Volver a Práctica</button></div></div>`;
  test=null; animateCard();
  $("again").onclick=()=>setMode("test"); $("back").onclick=()=>setMode("learn");
}

function setMode(m){
  mode=m; test=null;
  ["learn","errors","test"].forEach(k=>$("tab-"+k).setAttribute("aria-pressed",String(k===m)));
  if(m==="test"){
    const g=Q.filter(q=>!q.land), b=Q.filter(q=>q.land);
    const chosen=[...sample(g,30),...sample(b,3)];
    test={ids:shuffled(33).map(i=>chosen[i].id),i:0,ok:0,log:[]};
    cur=byId[test.ids[0]];
  } else cur=pick(pool(m));
  renderQuestion();
}

function renderAll(keepCur){
  $("opt-shuffle").checked=state.settings.shuffle; $("opt-en").checked=state.settings.en;
  renderStats();
  if(keepCur&&cur) return;
  if(!test) cur=pick(pool(mode));
  renderQuestion();
}

/* ---------- events ---------- */
$("tab-learn").onclick=()=>setMode("learn");
$("tab-errors").onclick=()=>setMode("errors");
$("tab-test").onclick=()=>setMode("test");
$("opt-shuffle").onchange=e=>{state.settings.shuffle=e.target.checked; saveLocal(); if(!answered) renderQuestion()};
$("opt-en").onchange=e=>{state.settings.en=e.target.checked; saveLocal(); if(!answered) renderQuestion()};
function askReset(){
  $("reset-area").innerHTML=`<span>¿Borrar tus 310 preguntas y todos tus errores? No se puede deshacer.</span><button class="btn danger" id="reset-yes">Sí, borrar</button><button class="btn ghost" id="reset-no">Cancelar</button>`;
  $("reset-no").onclick=restoreReset;
  $("reset-yes").onclick=()=>{const s=state.settings; state=blank(); state.settings=s; state.updatedAt=Date.now(); session={ok:0,n:0,streak:0,start:Date.now()}; recent=[]; persist(); restoreReset(); setMode("learn"); renderStats()};
}
function restoreReset(){$("reset-area").innerHTML=`<button class="btn danger" id="reset">Borrar todo mi progreso</button>`; $("reset").onclick=askReset}
$("reset").onclick=askReset;
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.metaKey||e.ctrlKey||e.altKey) return;
  if(!answered&&cur&&/^[1-4]$/.test(e.key)){const b=$("ans-"+(+e.key-1)); if(b) b.click()}
  else if(answered&&e.key==="Enter"&&$("next")){e.preventDefault(); $("next").click()}
});

$("exp").onclick=()=>{
  const blob=new Blob([JSON.stringify(state)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="einbuergerungstest-progreso-"+new Date().toISOString().slice(0,10)+".json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000); toast("Progreso exportado");
};
$("imp").onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{const s=JSON.parse(await f.text()); if(!s||typeof s.q!=="object") throw 0;
    state=s; ensureSettings(); saveLocal(); session={ok:0,n:0,streak:0,start:Date.now()}; renderAll(false); toast("Progreso importado")}
  catch(err){toast("Archivo no válido")}
  e.target.value="";
};

/* ---------- boot ---------- */
async function start(){
  state=loadLocal()||blank(); ensureSettings();
  try{Q=JSON.parse(document.getElementById("qdata").textContent)}
  catch(e){$("card").innerHTML=`<div class="empty"><p>No se pudieron cargar las preguntas. Recargá la página.</p></div>`;return}
  Q.forEach(q=>byId[q.id]=q);
  setSync("Guardado en este navegador");
  let canStore=false;
  try{localStorage.setItem("ebt-probe","1"); canStore=localStorage.getItem("ebt-probe")==="1"; localStorage.removeItem("ebt-probe")}catch(e){}
  if(!canStore||location.protocol==="content:") setSync("No se puede guardar el progreso: Chrome no guarda datos de archivos abiertos desde el celular. Abrí la app desde su link web, o usá Ajustes → Exportar progreso al terminar.");
  renderAll(false);
  connectDb();
}
start();
})();
</script>

</body></html>
